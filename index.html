          ].map(function(a){
            return (
              <button key={a.page} onClick={function(){/* setPage is not available here — will use window event */
                document.dispatchEvent(new CustomEvent('navTo', {detail:a.page}));
              }}
                className={`relative flex items-center gap-3 p-4 rounded-2xl text-white text-left font-bold text-sm shadow-md hover:shadow-lg transition-all active:scale-95 bg-gradient-to-br ${a.color}`}>
                <span className="text-xl flex-shrink-0">{a.icon}</span>
                <span className="flex-1">{a.label}</span>
                {a.badge && (
                  <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-black px-2 py-0.5 rounded-full shadow">{a.badge}</span>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-6">
        {/* ── COLLEGE SETTINGS CARD ── */}
        <div className="bg-white rounded-2xl p-6 shadow-sm border-2 border-blue-100">
          <div className="flex items-center gap-2 mb-4">
            <span className="text-xl">🏫</span>
            <h2 className="font-black text-gray-900 text-base">College Settings</h2>
            <span className="ml-auto text-xs text-gray-400">Printed on all PDFs</span>
          </div>

          {/* Live preview strip */}
          <div className="mb-4 p-3 bg-gray-50 border border-gray-200 rounded-xl text-center font-serif">
            <div className="text-xs font-bold uppercase tracking-wide">{college.name||"YOUR COLLEGE NAME"}</div>
            {college.address && <div className="text-xs text-gray-500 mt-0.5">{college.address}</div>}
            <div className="text-xs text-gray-400 mt-0.5 italic">{college.exam_title||"ANNA UNIVERSITY..."}</div>
          </div>

          <div className="space-y-3">
            <div>
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">College Name *</label>
              <input value={college.name} onChange={e=>setCollege(c=>({...c,name:e.target.value}))}
                className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Address</label>
              <input value={college.address} onChange={e=>setCollege(c=>({...c,address:e.target.value}))}
                className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Centre Code</label>
                <input value={college.centre_code} onChange={e=>setCollege(c=>({...c,centre_code:e.target.value}))}
                  className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Phone</label>
                <input value={college.phone} onChange={e=>setCollege(c=>({...c,phone:e.target.value}))}
                  className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
              </div>
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Exam Title (on PDF header)</label>
              <input value={college.exam_title} onChange={e=>setCollege(c=>({...c,exam_title:e.target.value}))}
                className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Principal</label>
                <input value={college.principal} onChange={e=>setCollege(c=>({...c,principal:e.target.value}))}
                  className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Controller of Exams</label>
                <input value={college.coe} onChange={e=>setCollege(c=>({...c,coe:e.target.value}))}
                  className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-400"/>
              </div>
            </div>
          </div>
          <button onClick={saveCollege}
            className="mt-4 w-full py-3 rounded-xl font-black text-white text-sm transition-all"
            style={{background:collegeSaved?"linear-gradient(135deg,#059669,#10b981)":"linear-gradient(135deg,#2563eb,#7c3aed)"}}>
            {collegeSaved ? "Saved!" : "Save College Settings"}
          </button>
        </div>

        {/* ── RIGHT COLUMN ── */}
        <div className="space-y-5">
          {/* Upcoming Exams */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 className="font-black text-gray-900 mb-3 text-base"> Upcoming Exams</h2>
            {!exams.filter(e=>e.status==="scheduled").length
              ? <p className="text-gray-400 text-sm">No exams scheduled.</p>
              : exams.filter(e=>e.status==="scheduled").slice(0,5).map(e=>(
                <div key={e.id} className="flex items-center justify-between py-2.5 border-b border-gray-50 last:border-0">
                  <div><div className="font-semibold text-gray-900 text-sm">{e.subject}</div><div className="text-gray-400 text-xs">{e.date}   {e.session}</div></div>
                  {e.seatinggenerated
                    ? <span className="px-2 py-0.5 bg-green-100 text-green-700 rounded-full text-xs font-bold"> Seated</span>
                    : <span className="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full text-xs font-bold">Pending</span>}
                </div>
              ))
            }
          </div>

          {/* By Department */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 className="font-black text-gray-900 mb-3 text-base"> Students by Department</h2>
            {!Object.keys(deptMap).length
              ? <p className="text-gray-400 text-sm">No students yet.</p>
              : Object.entries(deptMap).sort((a,b)=>b[1]-a[1]).map(([dept,count])=>(
                <div key={dept} className="flex items-center gap-3 mb-2">
                  <span className={`px-2 py-0.5 rounded-lg text-xs font-bold border w-14 text-center ${deptColor(dept)}`}>{dept}</span>
                  <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full" style={{width:`${(count/students.length)*100}%`,background:deptHex(dept)}}/>
                  </div>
                  <span className="text-sm font-bold text-gray-500 w-6 text-right">{count}</span>
                </div>
              ))
            }
          </div>

          {/* Danger: Delete all students */}
          <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-5">
            <h2 className="font-black text-red-700 mb-1 text-base"> Delete Student List</h2>
            <p className="text-red-500 text-xs mb-3">Permanently removes all {students.length} student records from the database. Cannot be undone.</p>
            <button onClick={deleteAllStudents} disabled={deleting||!students.length}
              className="w-full py-2.5 rounded-xl font-bold text-sm text-white bg-red-500 hover:bg-red-600 disabled:opacity-40 transition-all">
              {deleting ? "Deleting..." : `Delete All Students (${students.length})`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── STUDENTS PAGE ─────────────────────────────────────────────────────────────
function StudentsPage({ students, setStudents, showToast }) {
  const [search,  setSearch]   = useState("");
  const [dept,    setDept]     = useState("all");
  const [year,    setYear]     = useState("all");
  const [gender,  setGender]   = useState("all");
  const [showAdd, setShowAdd]  = useState(false);
  const [editS,   setEditS]    = useState(null);
  const [form,    setForm]     = useState({regno:"",name:"",dept:"CSE",year:"1",gender:"male",password:"student@123"});
  const [saving,  setSaving]   = useState(false);
  // Multi-select for bulk actions
  const [selected, setSelected] = useState(new Set());
  const [confirmDel, setConfirmDel] = useState(null); // student to delete, or 'bulk'
  const [bulkAction, setBulkAction] = useState("");   // 'delete' | 'year2' etc
  const [processing, setProcessing] = useState(false);

  const filtered = students.filter(s=>
    (dept==="all"  ||s.dept===dept)&&
    (year==="all"  ||String(s.year)===year)&&
    (gender==="all"||s.gender===gender)&&
    (s.name?.toLowerCase().includes(search.toLowerCase())||s.regno?.toLowerCase().includes(search.toLowerCase()))
  );

  const allSelected = filtered.length > 0 && filtered.every(s => selected.has(s.id));
  function toggleAll() {
    if (allSelected) setSelected(new Set());
    else setSelected(new Set(filtered.map(s=>s.id)));
  }
  function toggleOne(id) {
    setSelected(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });
  }
  const selectedStudents = students.filter(s => selected.has(s.id));

  function openAdd() { setForm({regno:"",name:"",dept:"CSE",year:"1",gender:"male",password:"student@123"}); setEditS(null); setShowAdd(true); }
  function openEdit(s) { setForm({...s,password:""}); setEditS(s); setShowAdd(true); }

  async function saveStudent() {
    if (!form.regno||!form.name) { showToast("Register number and name required","error"); return; }
    setSaving(true);
    try {
      const s={...form,regno:form.regno.toUpperCase().trim(),dept:form.dept.toUpperCase(),year:parseInt(form.year)||1};
      if (editS) {
        const upd={...s}; if (form.password) upd.password=hashPwd(form.password); delete upd.id;
        await Store.updateStudent(editS.id,upd);
        setStudents(prev=>prev.map(x=>x.id===editS.id?{...x,...upd}:x));
        showToast("Student updated!");
      } else {
        if (students.find(x=>x.regno===s.regno && x.id!==editS?.id)) { showToast("Register number already exists in this college","error"); setSaving(false); return; }
        s.id=uid(); s.password=hashPwd(form.password||"student@123");
        await Store.addStudent(s);
        setStudents(prev=>[...prev,s]);
        showToast("Student added!");
      }
      setShowAdd(false);
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  // ── Fast single delete (no window.confirm) ─────────────────────────
  async function doDeleteOne(s) {
    setProcessing(true);
    try {
      await Store.deleteStudent(s.id);
      setStudents(prev=>prev.filter(x=>x.id!==s.id));
      setConfirmDel(null);
      showToast(`${s.name} removed`, "info");
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setProcessing(false); }
  }

  // ── Fast bulk delete (one API call) ───────────────────────────────
  async function doBulkDelete() {
    setProcessing(true);
    try {
      const ids = selectedStudents.map(s=>s.id);
      await Store.bulkDeleteStudents(ids);
      setStudents(prev=>prev.filter(s=>!selected.has(s.id)));
      setSelected(new Set());
      setConfirmDel(null);
      showToast(`✅ ${ids.length} students deleted`, "success");
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setProcessing(false); }
  }

  // ── Fast bulk year upgrade (one API call per year group) ──────────
  async function doBulkYearUpgrade(targetYear) {
    setProcessing(true);
    try {
      const toUpgrade = selectedStudents.filter(s => s.year !== targetYear);
      if (!toUpgrade.length) { showToast("All selected already at Year "+targetYear,"warn"); setProcessing(false); return; }
      await Store.bulkUpdateYear(toUpgrade.map(s=>({id:s.id, year:targetYear})));
      setStudents(prev=>prev.map(s=>selected.has(s.id)?{...s,year:targetYear}:s));
      setSelected(new Set());
      setBulkAction("");
      showToast(`✅ ${toUpgrade.length} students → Year ${targetYear}`, "success");
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setProcessing(false); }
  }

  return (
    <div className="p-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-3xl font-black text-gray-900">Students</h1>
          <p className="text-gray-400 text-sm">{filtered.length} shown / {students.length} total</p>
        </div>
        <Btn onClick={openAdd}><Ic.Plus/>Add Student</Btn>
      </div>

      {/* Filters */}
      <div className="flex gap-2 mb-4 flex-wrap">
        <div className="relative flex-1 min-w-[160px] max-w-xs">
          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Ic.Search/></div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name or reg no..."
            className="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-400"/>
        </div>
        <select value={dept} onChange={e=>setDept(e.target.value)} className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
          <option value="all">All Depts</option>
          {[...new Set(students.map(s=>s.dept))].sort().map(d=><option key={d}>{d}</option>)}
        </select>
        <select value={year} onChange={e=>setYear(e.target.value)} className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
          <option value="all">All Years</option>
          {["1","2","3","4"].map(y=><option key={y} value={y}>Year {y}</option>)}
        </select>
        <select value={gender} onChange={e=>setGender(e.target.value)} className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none">
          <option value="all">All</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      {/* ── Bulk action bar — appears when students are selected ── */}
      {selected.size > 0 && (
        <div className="mb-4 p-3 rounded-2xl flex items-center gap-3 flex-wrap shadow-md"
          style={{background:"linear-gradient(135deg,#1e293b,#1e3a8a)"}}>
          <span className="text-white font-black text-sm">{selected.size} selected</span>
          <div className="flex-1"/>

          {/* Year upgrade buttons */}
          <div className="flex items-center gap-1 bg-white/10 rounded-xl p-1">
            <span className="text-white/60 text-xs font-bold px-2">Set Year:</span>
            {[1,2,3,4].map(y=>(
              <button key={y} onClick={()=>doBulkYearUpgrade(y)} disabled={processing}
                className="w-8 h-8 rounded-lg text-white font-black text-sm hover:bg-white/20 transition-all disabled:opacity-40"
                title={`Set selected students to Year ${y}`}>
                {y}
              </button>
            ))}
          </div>

          {/* Promote +1 */}
          <button onClick={()=>{
            const updates = selectedStudents.filter(s=>s.year<4).map(s=>({id:s.id,year:s.year+1}));
            if (!updates.length) { showToast("All selected are already Year 4","warn"); return; }
            setProcessing(true);
            Store.bulkUpdateYear(updates).then(()=>{
              const upMap = {}; updates.forEach(u=>upMap[u.id]=u.year);
              setStudents(prev=>prev.map(s=>upMap[s.id]?{...s,year:upMap[s.id]}:s));
              setSelected(new Set());
              showToast(`✅ ${updates.length} students promoted +1 year`,"success");
            }).catch(e=>showToast("Error: "+e.message,"error")).finally(()=>setProcessing(false));
          }} disabled={processing}
            className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold disabled:opacity-40 transition-all">
            ⬆ Promote +1
          </button>

          {/* Bulk delete */}
          <button onClick={()=>setConfirmDel("bulk")} disabled={processing}
            className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-red-500 hover:bg-red-400 text-white text-xs font-bold disabled:opacity-40 transition-all">
            🗑 Delete {selected.size}
          </button>

          <button onClick={()=>setSelected(new Set())}
            className="text-white/60 hover:text-white text-sm px-2">✕</button>
        </div>
      )}

      {/* Student table */}
      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                <th className="p-3 w-10">
                  <input type="checkbox" checked={allSelected} onChange={toggleAll}
                    className="w-4 h-4 rounded cursor-pointer accent-blue-500"/>
                </th>
                <th className="text-left p-3 text-xs font-bold uppercase tracking-wide">Reg No</th>
                <th className="text-left p-3 text-xs font-bold uppercase tracking-wide">Name</th>
                <th className="text-center p-3 text-xs font-bold uppercase tracking-wide">Dept</th>
                <th className="text-center p-3 text-xs font-bold uppercase tracking-wide">Year</th>
                <th className="text-center p-3 text-xs font-bold uppercase tracking-wide">Gender</th>
                <th className="text-center p-3 text-xs font-bold uppercase tracking-wide">Actions</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s,i)=>(
                <tr key={s.id} className={`border-t border-gray-50 transition-colors ${selected.has(s.id)?"bg-blue-50":i%2?"bg-gray-50/30":""}`}>
                  <td className="p-3 text-center">
                    <input type="checkbox" checked={selected.has(s.id)} onChange={()=>toggleOne(s.id)}
                      className="w-4 h-4 rounded cursor-pointer accent-blue-500"/>
                  </td>
                  <td className="p-3 font-mono text-blue-600 text-xs font-bold">{s.regno}</td>
                  <td className="p-3 font-semibold text-gray-900 text-sm">{s.name}</td>
                  <td className="p-3 text-center">
                    <span className={`px-2 py-0.5 rounded-lg text-xs font-bold border ${deptColor(s.dept)}`}>{s.dept}</span>
                  </td>
                  <td className="p-3 text-center">
                    <span className={`w-7 h-7 rounded-full inline-flex items-center justify-center text-xs font-black text-white ${
                      s.year===1?"bg-blue-500":s.year===2?"bg-violet-500":s.year===3?"bg-amber-500":"bg-red-500"}`}>
                      {s.year}
                    </span>
                  </td>
                  <td className="p-3 text-center text-xs text-gray-400">{s.gender==="female"?"👩 F":"👨 M"}</td>
                  <td className="p-3 text-center">
                    <div className="flex items-center justify-center gap-1">
                      <button onClick={()=>openEdit(s)}
                        className="w-7 h-7 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition-all"
                        title="Edit"><Ic.Edit/></button>
                      <button onClick={()=>setConfirmDel(s)}
                        className="w-7 h-7 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition-all"
                        title="Delete"><Ic.Trash/></button>
                    </div>
                  </td>
                </tr>
              ))}
              {!filtered.length && (
                <tr><td colSpan={7} className="p-8 text-center text-gray-400">No students match your filters</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div className="px-4 py-2 bg-gray-50 border-t border-gray-100 text-xs text-gray-400 flex justify-between items-center">
          <span>{filtered.length} shown</span>
          {selected.size > 0 && <span className="text-blue-600 font-bold">{selected.size} selected</span>}
          <span>Tick boxes to bulk-edit</span>
        </div>
      </div>

      {/* ── Inline delete confirmation (replaces window.confirm) ── */}
      {confirmDel && (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4"
          onClick={()=>!processing&&setConfirmDel(null)}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6" onClick={e=>e.stopPropagation()}>
            <div className="text-center mb-5">
              <div className="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-3">
                <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </div>
              {confirmDel === "bulk" ? (
                <>
                  <h3 className="text-xl font-black text-gray-900">Delete {selected.size} Students?</h3>
                  <p className="text-gray-500 text-sm mt-2">This will permanently remove <b>{selected.size}</b> selected students. This cannot be undone.</p>
                  <div className="mt-3 max-h-28 overflow-y-auto text-left bg-red-50 rounded-xl p-2">
                    {selectedStudents.slice(0,10).map(s=>(
                      <div key={s.id} className="text-xs text-gray-600 py-0.5 flex gap-2">
                        <span className="font-mono text-red-600">{s.regno}</span>
                        <span>{s.name}</span>
                      </div>
                    ))}
                    {selectedStudents.length > 10 && <p className="text-xs text-gray-400 mt-1">+{selectedStudents.length-10} more…</p>}
                  </div>
                </>
              ) : (
                <>
                  <h3 className="text-xl font-black text-gray-900">Delete Student?</h3>
                  <p className="text-gray-500 text-sm mt-2">
                    <b>{confirmDel.name}</b><br/>
                    <span className="font-mono text-blue-600">{confirmDel.regno}</span> · {confirmDel.dept} · Year {confirmDel.year}
                  </p>
                </>
              )}
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setConfirmDel(null)} disabled={processing}
                className="flex-1 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:bg-gray-50 disabled:opacity-50">
                Cancel
              </button>
              <button
                onClick={confirmDel==="bulk" ? doBulkDelete : ()=>doDeleteOne(confirmDel)}
                disabled={processing}
                className="flex-1 py-3 rounded-xl bg-gradient-to-r from-red-500 to-red-600 text-white font-bold text-sm shadow-md disabled:opacity-50 flex items-center justify-center gap-2">
                {processing ? <><Ic.Spin/>Deleting…</> : "🗑 Delete"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Add/Edit modal */}
      {showAdd&&<Modal title={editS?"Edit Student":"Add Student"} onClose={()=>setShowAdd(false)}>
        <Input label="Register Number" value={form.regno} onChange={v=>setForm(p=>({...p,regno:v}))} placeholder="e.g. 953024104001" required
          hint="University register number"/>
        <Input label="Full Name" value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} placeholder="Student Name" required/>
        <Select label="Department" value={form.dept} onChange={v=>setForm(p=>({...p,dept:v}))} options={DEPTS.map(d=>({value:d,label:d}))}/>
        <Select label="Year" value={String(form.year)} onChange={v=>setForm(p=>({...p,year:v}))} options={["1","2","3","4"].map(y=>({value:y,label:"Year "+y}))}/>
        <Select label="Gender" value={form.gender} onChange={v=>setForm(p=>({...p,gender:v}))} options={[{value:"male",label:"Male"},{value:"female",label:"Female"}]}/>
        <Input label={editS?"New Password (leave blank to keep)":"Password"} value={form.password} onChange={v=>setForm(p=>({...p,password:v}))} type="password" placeholder={editS?"Leave blank to keep current":"Default: student@123"}/>
        <div className="flex gap-3 mt-2">
          <Btn variant="ghost" onClick={()=>setShowAdd(false)} className="flex-1">Cancel</Btn>
          <Btn onClick={saveStudent} disabled={saving} className="flex-1">{saving?"Saving...":editS?"Save Changes":"Add Student"}</Btn>
        </div>
      </Modal>}
    </div>
  );
}

// ── BENCH PATTERN SYSTEM ──────────────────────────────────────────────────────
// A pattern is a 2D grid where 1 = seat, 0 = aisle gap
// Each grid represents ONE bench (physical desk row in the hall)
// e.g. [[1,1,0,1,1]] = one bench with 2 seats | aisle | 2 seats

// ── PRESET PATTERNS ───────────────────────────────────────────────────────────

// ══════════════════════════════════════════════════════════════════════════════
// HALL LAYOUT SYSTEM
// ══════════════════════════════════════════════════════════════════════════════
//
// MENTAL MODEL (real classroom top-down view):
//
//   [BOARD / FRONT]
//   ┌──────────────────────────────────────────────┐
//   │  [B1]  [B1]  │aisle│  [B1]  [B1]  │aisle│  [B1] │
//   │  [B2]  [B2]  │     │  [B2]  [B2]  │     │  [B2] │
//   │  [B3]  [B3]  │     │  [B3]  [B3]  │     │  [B3] │
//   └──────────────────────────────────────────────┘
//
// A "Hall Layout" has:
//   columns       : array of bench-column groups separated by aisles
//                   each column group = { benches: N (seats side-by-side on one bench) }
//   aisleAfter    : array of bool, aisleAfter[i] = true means aisle after column group i
//   numRows       : how many bench rows front-to-back (replaces numbenches)
//
// seatsPerRow = sum of all benches across all column groups
//
// EXAMPLE: 3 column groups [2, aisle, 3, aisle, 2]
//   columns = [{seats:2},{seats:3},{seats:2}], aisleAfter=[true,true,false]
//   seatsPerRow = 2+3+2 = 7
//
// STORAGE (in hall object):
//   hall.layoutConfig = { columns:[{seats:2},{seats:3},{seats:2}], aisleAfter:[true,true,false] }
//   hall.numbenches   = numRows (total bench rows)
//   hall.studentsperbench = seatsPerRow (computed)
//   hall.capacity     = numRows * seatsPerRow

// ── HELPERS ───────────────────────────────────────────────────────────────────

function defaultLayout() {
  // 3 seat groups (S1, S2, S3) each with 1 seat = 3 students per bench
  // Matches standard hall: 15 benches × 3 seats = 45 students
  return { columns:[{seats:1},{seats:1},{seats:1}], aisleAfter:[true,true,false] };
}

function seatsPerRowFromLayout(layout) {
  if (!layout || !layout.columns) return 2;
  return layout.columns.reduce(function(a,c){
    var total = c.seats||1;
    var aisles = (c.aisleSeats||[]).length;
    return a + (total - aisles);
  }, 0);
}

// Convert layoutConfig to legacy icon 2D array (for BenchLayoutPreview compatibility)
function layoutToIcon(layout) {
  if (!layout || !layout.columns) return [[1,1]];
  var row = [];
  layout.columns.forEach(function(col, i) {
    var aisleSet = new Set(col.aisleSeats||[]);
    for (var s = 0; s < (col.seats||1); s++) {
      row.push(aisleSet.has(s) ? 0 : 1);
    }
    if (layout.aisleAfter[i]) row.push(0);
  });
  return [row];
}

// ── BENCH LAYOUT PREVIEW ──────────────────────────────────────────────────────
// Renders a single bench row as a miniature top-down diagram
// Works with either layoutConfig or legacy icon[][]
function BenchLayoutPreview({ layout, icon, small=false, highlighted=false }) {
  // Resolve to a flat row array
  var row;
  if (layout) {
    row = layoutToIcon(layout)[0];
  } else if (icon && icon.length) {
    row = icon[0]; // legacy: take first row
  } else {
    row = [1,1];
  }

  const cellW = small ? "w-3 h-4" : "w-7 h-8";
  const aisleW = small ? "w-2" : "w-3";
  const gap = small ? "gap-0.5" : "gap-1";

  return (
    <div className={"inline-flex items-center flex-shrink-0 "+gap}>
      {row.map(function(cell, ci) {
        return cell === 0
          ? <div key={ci} className={aisleW+" flex-shrink-0 self-stretch bg-gray-100 rounded-sm"}/>
          : <div key={ci} className={cellW+" rounded-sm flex-shrink-0 " + (highlighted ? "bg-yellow-400" : "bg-blue-400")}/>;
      })}
    </div>
  );
}

// ── HALL LAYOUT BUILDER ───────────────────────────────────────────────────────
// Column-wise classroom preview and editor.
// Each bench-column is shown as a vertical stack of benches.
// The user edits LEFT / CENTER / RIGHT columns independently.
// Inside each bench the seats are shown as individual boxes.
function HallLayoutBuilder({ layout, numRows, onLayoutChange, onNumRowsChange }) {
  const ly         = layout || defaultLayout();
  const cols       = ly.columns || [{seats:1},{seats:1},{seats:1}];
  const aisleAfter = ly.aisleAfter || cols.map(function(){ return true; });
  const spr        = seatsPerRowFromLayout(ly);

  function update(newCols, newAisles) {
    onLayoutChange({ columns: newCols, aisleAfter: newAisles });
  }
  function addBenchCol() {
    if (cols.length >= 6) return;
    update([...cols, {seats:1}], [...aisleAfter.slice(0,-1), true, false]);
  }
  function removeBenchCol(i) {
    if (cols.length <= 1) return;
    update(cols.filter(function(_,j){ return j!==i; }),
           aisleAfter.filter(function(_,j){ return j!==i; }));
  }
  function setSeats(i, val) {
    const nc = cols.map(function(c,j){
      return j===i ? {...c, seats: Math.max(1, Math.min(6, parseInt(val)||1)), aisleSeats:[]} : c;
    });
    update(nc, aisleAfter);
  }
  function toggleWalkAisle(i) {
    update(cols, aisleAfter.map(function(v,j){ return j===i ? !v : v; }));
  }

  const totalBenches   = parseInt(numRows) || 15;
  const benchRows      = Math.ceil(totalBenches / cols.length);
  // Correct: each bench row has spr seats (sum across all columns), times number of rows
  const capacity       = benchRows * spr;
  const previewRows    = Math.min(benchRows, 5);

  // Colour scheme per column
  const SCHEMES = [
    {name:'LEFT',   hdr:'#1d4ed8', hdrBg:'#dbeafe', bench:'#eff6ff', border:'#93c5fd', seat:'#2563eb', seatTxt:'#fff'},
    {name:'CENTER', hdr:'#15803d', hdrBg:'#dcfce7', bench:'#f0fdf4', border:'#86efac', seat:'#16a34a', seatTxt:'#fff'},
    {name:'RIGHT',  hdr:'#7e22ce', hdrBg:'#f3e8ff', bench:'#fdf4ff', border:'#d8b4fe', seat:'#9333ea', seatTxt:'#fff'},
    {name:'COL 4',  hdr:'#c2410c', hdrBg:'#ffedd5', bench:'#fff7ed', border:'#fdba74', seat:'#ea580c', seatTxt:'#fff'},
    {name:'COL 5',  hdr:'#0f766e', hdrBg:'#ccfbf1', bench:'#f0fdfa', border:'#5eead4', seat:'#0d9488', seatTxt:'#fff'},
    {name:'COL 6',  hdr:'#475569', hdrBg:'#f1f5f9', bench:'#f8fafc', border:'#94a3b8', seat:'#64748b', seatTxt:'#fff'},
  ];

  return (
    <div style={{display:'flex', flexDirection:'column', gap:16}}>

      {/* ── Bench count + capacity ── */}
      <div style={{display:'flex', alignItems:'center', gap:12}}>
        <div style={{flex:1}}>
          <div style={{fontSize:10,fontWeight:800,color:'#6b7280',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>
            Total Benches
          </div>
          <div style={{fontSize:10,color:'#9ca3af',marginBottom:6}}>
            {cols.length} columns × {benchRows} rows = {totalBenches} benches · {spr} seats/row = <b style={{color:'#4338ca'}}>{capacity} students</b>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <button onClick={function(){ var n=parseInt(String(numRows))||15; onNumRowsChange(Math.max(cols.length,n-cols.length)); }}
              style={{width:34,height:34,borderRadius:10,border:'1px solid #e2e8f0',background:'#f8fafc',fontSize:18,fontWeight:900,cursor:'pointer',color:'#374151'}}>−</button>
            <input type="number" min="1" max="500" value={numRows||15}
              onChange={function(e){ var v=parseInt(e.target.value); if(v>0) onNumRowsChange(v); }}
              style={{width:64,textAlign:'center',border:'2px solid #e2e8f0',borderRadius:10,padding:'6px 4px',fontSize:14,fontWeight:900,outline:'none'}}/>
            <button onClick={function(){ var n=parseInt(String(numRows))||15; onNumRowsChange(n+cols.length); }}
              style={{width:34,height:34,borderRadius:10,border:'1px solid #bfdbfe',background:'#eff6ff',fontSize:18,fontWeight:900,cursor:'pointer',color:'#2563eb'}}>+</button>
            <span style={{fontSize:11,color:'#9ca3af'}}>benches total</span>
          </div>
        </div>
        <div style={{
          textAlign:'center',background:'#eef2ff',border:'1.5px solid #c7d2fe',
          borderRadius:12,padding:'10px 16px',flexShrink:0,
        }}>
          <div style={{fontSize:24,fontWeight:900,color:'#4338ca',lineHeight:1}}>{capacity}</div>
          <div style={{fontSize:10,color:'#6b7280',marginTop:2}}>total students</div>
        </div>
      </div>

      {/* ════════════════════════════════════════════════════════
          CLASSROOM GRID PREVIEW — column by column
          ════════════════════════════════════════════════════════ */}
      <div style={{
        border:'2px solid #e2e8f0',borderRadius:14,overflow:'hidden',
        background:'#f8fafc',
      }}>
        {/* Board */}
        <div style={{
          background:'linear-gradient(135deg,#0f172a,#1e293b)',
          color:'#fff',textAlign:'center',padding:'9px 0',
          fontSize:12,fontWeight:800,letterSpacing:4,
        }}>⬜ BOARD / PODIUM ⬜</div>

        {/* Columns */}
        <div style={{display:'flex',alignItems:'stretch',gap:0}}>

          {cols.map(function(col, ci) {
            var sc       = SCHEMES[ci] || SCHEMES[0];
            var seats    = col.seats || 1;
            var colLabel = sc.name;

            return (
              <React.Fragment key={ci}>

                {/* ── Bench column ── */}
                <div style={{flex:'1 1 0',minWidth:0,display:'flex',flexDirection:'column'}}>

                  {/* Column header */}
                  <div style={{
                    background:sc.hdrBg,
                    borderBottom:'2px solid '+sc.border,
                    padding:'8px 6px',
                    textAlign:'center',
                  }}>
                    <div style={{fontSize:11,fontWeight:900,color:sc.hdr,letterSpacing:1,marginBottom:6}}>
                      {colLabel}
                    </div>

                    {/* Seats-per-bench stepper */}
                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:5}}>
                      <button
                        onClick={function(){ setSeats(ci, seats-1); }}
                        disabled={seats<=1}
                        style={{
                          width:22,height:22,borderRadius:6,
                          border:'1.5px solid '+sc.border,
                          background:'#fff',color:sc.hdr,fontWeight:900,fontSize:13,
                          cursor:seats<=1?'default':'pointer',
                          opacity:seats<=1?0.3:1,
                          display:'flex',alignItems:'center',justifyContent:'center',
                        }}>−</button>
                      <span style={{
                        fontSize:13,fontWeight:900,color:sc.hdr,
                        background:'#fff',border:'1.5px solid '+sc.border,
                        borderRadius:6,padding:'1px 10px',minWidth:28,textAlign:'center',
                      }}>{seats}</span>
                      <button
                        onClick={function(){ setSeats(ci, seats+1); }}
                        disabled={seats>=6}
                        style={{
                          width:22,height:22,borderRadius:6,
                          border:'1.5px solid '+sc.border,
                          background:'#fff',color:sc.hdr,fontWeight:900,fontSize:13,
                          cursor:seats>=6?'default':'pointer',
                          opacity:seats>=6?0.3:1,
                          display:'flex',alignItems:'center',justifyContent:'center',
                        }}>+</button>
                    </div>
                    <div style={{fontSize:8,color:sc.hdr,opacity:0.7,fontWeight:600}}>
                      {seats} seat{seats!==1?'s':''}/bench
                    </div>
                    {cols.length > 1 && (
                      <button onClick={function(){ removeBenchCol(ci); }}
                        style={{
                          marginTop:4,fontSize:8,color:'#ef4444',
                          background:'none',border:'none',cursor:'pointer',fontWeight:700,
                        }}>✕ remove</button>
                    )}
                  </div>

                  {/* Bench rows preview */}
                  {Array(previewRows).fill(null).map(function(_,ri){
                    var benchNum = ri * cols.length + ci + 1;
                    return (
                      <div key={ri} style={{
                        padding:'7px 6px',
                        background: ri%2===0 ? sc.bench : '#fff',
                        borderBottom:'1px solid '+sc.border,
                        display:'flex',flexDirection:'column',alignItems:'center',gap:3,
                      }}>
                        {/* Seat boxes inside bench */}
                        <div style={{display:'flex',gap:3,alignItems:'center',justifyContent:'center'}}>
                          {Array(seats).fill(null).map(function(_,si){
                            return (
                              <div key={si} style={{
                                width:26,height:28,borderRadius:6,
                                background:sc.seat,
                                color:sc.seatTxt,
                                fontSize:8,fontWeight:800,
                                display:'flex',alignItems:'center',justifyContent:'center',
                                flexShrink:0,
                                boxShadow:'0 1px 3px rgba(0,0,0,0.15)',
                              }}>S{si+1}</div>
                            );
                          })}
                        </div>
                        {/* Bench number */}
                        <div style={{fontSize:7,fontWeight:700,color:sc.hdr,opacity:0.6}}>B{benchNum}</div>
                      </div>
                    );
                  })}

                  {/* More rows */}
                  {benchRows > previewRows && (
                    <div style={{
                      padding:'5px',textAlign:'center',
                      fontSize:8,color:sc.hdr,opacity:0.5,
                      background:sc.bench,
                      borderTop:'1px dashed '+sc.border,
                    }}>+{benchRows-previewRows} more…</div>
                  )}
                </div>

                {/* ── Walking aisle between columns ── */}
                {ci < cols.length-1 && (
                  <div style={{
                    width:38,flexShrink:0,
                    display:'flex',flexDirection:'column',
                    alignItems:'center',
                    background:'#f1f5f9',
                    borderLeft:'1px solid #e2e8f0',
                    borderRight:'1px solid #e2e8f0',
                  }}>
                    {/* Toggle button */}
                    <button
                      onClick={function(){ toggleWalkAisle(ci); }}
                      style={{
                        width:34,margin:'6px 0',padding:'5px 2px',
                        borderRadius:8,cursor:'pointer',
                        border: aisleAfter[ci]?'2px solid #f59e0b':'2px dashed #d1d5db',
                        background: aisleAfter[ci]?'#fef3c7':'#f8fafc',
                        color: aisleAfter[ci]?'#92400e':'#9ca3af',
                        display:'flex',flexDirection:'column',
                        alignItems:'center',gap:1,
                        fontSize:8,fontWeight:800,
                        transition:'all 0.15s',
                      }}>
                      <span style={{fontSize:13,lineHeight:1,letterSpacing:-1}}>
                        {aisleAfter[ci]?'|||':'+'}
                      </span>
                      <span style={{fontSize:6,letterSpacing:0.5}}>
                        {aisleAfter[ci]?'AISLE':'add'}
                      </span>
                    </button>

                    {/* Dashed aisle line */}
                    <div style={{
                      flex:1,width:0,
                      borderLeft: aisleAfter[ci]?'2px dashed #fcd34d':'2px dashed #e2e8f0',
                      marginBottom:8,
                    }}/>
                  </div>
                )}

              </React.Fragment>
            );
          })}
        </div>

        {/* Add column */}
        {cols.length < 6 && (
          <div style={{
            textAlign:'center',padding:'8px 0',
            borderTop:'1px dashed #e2e8f0',
            background:'#f8fafc',
          }}>
            <button onClick={addBenchCol} style={{
              fontSize:11,fontWeight:700,color:'#4f46e5',
              background:'#eef2ff',border:'1.5px solid #c7d2fe',
              borderRadius:8,padding:'5px 18px',cursor:'pointer',
            }}>+ Add Column</button>
          </div>
        )}
      </div>

      {/* Summary strip */}
      <div style={{
        display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',
        padding:'8px 12px',
        background:'#f5f3ff',border:'1px solid #ddd6fe',borderRadius:10,
      }}>
        {cols.map(function(col,ci){
          var sc = SCHEMES[ci]||SCHEMES[0];
          var s  = col.seats||1;
          return (
            <span key={ci} style={{
              display:'flex',alignItems:'center',gap:4,
              background:'#fff',border:'1.5px solid '+sc.border,
              borderRadius:6,padding:'3px 10px',
              color:sc.hdr,fontWeight:700,fontSize:11,
            }}>
              <span style={{width:8,height:8,borderRadius:'50%',background:sc.seat,display:'inline-block'}}/>
              {sc.name}: {s} seat{s!==1?'s':''}/bench
            </span>
          );
        })}
        <span style={{
          marginLeft:'auto',fontSize:12,fontWeight:900,color:'#4338ca',
        }}>{capacity} students total</span>
      </div>
    </div>
  );
}

// ── HALL LAYOUT VISUALISER ────────────────────────────────────────────────────
// Full top-down room view showing all bench rows filled with students
function HallLayoutVisualiser({ hall, students, layout, title }) {
  const ly = layout || (hall && hall.layoutConfig) || defaultLayout();
  const spr = seatsPerRowFromLayout(ly);
  const numRows = hall ? (hall.numbenches||10) : Math.ceil(((students||[]).length)/Math.max(1,spr));
  const filled = (students||[]).slice(0, numRows*spr);

  const PALETTE = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#14b8a6"];
  const deptColorMap = {};
  var ci2 = 0;
  (students||[]).forEach(function(s){ if (s.dept && !deptColorMap[s.dept]) deptColorMap[s.dept]=PALETTE[ci2++%PALETTE.length]; });

  const icon = layoutToIcon(ly);

  return (
    <div className="bg-white border border-gray-200 rounded-2xl p-4 overflow-hidden">
      {title && <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">{title}</div>}
      {Object.keys(deptColorMap).length > 0 && (
        <div className="flex flex-wrap gap-2 mb-3">
          {Object.entries(deptColorMap).map(function([dept,col]){
            return <span key={dept} className="flex items-center gap-1 text-xs text-gray-600 font-semibold">
              <span className="w-3 h-3 rounded-sm inline-block" style={{background:col}}/>{dept}
            </span>;
          })}
          <span className="flex items-center gap-1 text-xs text-gray-400">
            <span className="w-3 h-3 rounded-sm inline-block bg-gray-200 border border-dashed border-gray-300"/>Empty
          </span>
        </div>
      )}
      <div className="w-full py-1.5 rounded-lg bg-slate-700 text-white text-xs font-bold text-center mb-3 tracking-widest">BOARD / FRONT</div>
      <div className="flex flex-col gap-1 max-h-72 overflow-y-auto pr-1">
        {Array(Math.min(numRows,50)).fill(null).map(function(_,ri){
          var rowStudents = filled.slice(ri*spr,(ri+1)*spr);
          var si = 0;
          return (
            <div key={ri} className="flex items-center gap-2">
              <span className="text-xs text-gray-400 font-mono w-6 text-right flex-shrink-0">R{ri+1}</span>
              <div className="flex items-center gap-1 bg-amber-50 border border-amber-200 rounded-xl px-2 py-1">
                {ly.columns.map(function(col,gi){
                  return (
                    <React.Fragment key={gi}>
                      <div className="flex gap-0.5">
                        {Array(col.seats||1).fill(null).map(function(_,si2){
                          const isAisle = (col.aisleSeats||[]).includes(si2);
                          if (isAisle) {
                            return <div key={si2} className="w-3 self-stretch bg-amber-200 rounded-sm flex-shrink-0"/>;
                          }
                          var stu = rowStudents[si]; si++;
                          var bg = stu && deptColorMap[stu.dept] ? deptColorMap[stu.dept] : null;
                          return <div key={si2}
                            className={"w-7 h-5 rounded text-xs font-bold flex items-center justify-center flex-shrink-0 " +
                              (stu?"text-white":"bg-gray-100 border border-dashed border-gray-200")}
                            style={stu?{background:bg||"#64748b"}:{}}
                            title={stu?(stu.name||stu.regno):"Empty"}>
                            {stu?stu.regno.slice(-3):""}
                          </div>;
                        })}
                      </div>
                      {gi < ly.columns.length-1 && ly.aisleAfter[gi] && <div className="w-3 self-stretch bg-slate-200 rounded-sm mx-0.5"/>}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
          );
        })}
        {numRows > 50 && <div className="text-center text-xs text-gray-400 py-1">+{numRows-50} more rows</div>}
      </div>
    </div>
  );
}

// Legacy compat: studentsPerBenchFromPattern still works for old seating plans
function studentsPerBenchFromPattern(p) {
  if (!p) return 2;
  if (p.layoutConfig) return seatsPerRowFromLayout(p.layoutConfig);
  if (p.icon) return p.icon.reduce(function(t,r){ return t+r.reduce(function(a,v){ return a+v; },0); },0);
  return 2;
}



// ── HALL LAYOUT EDITOR PAGE ──────────────────────────────────────────────────
// Dedicated page to edit the layout (seat groups, aisles) of any existing hall.
// Saved back to Supabase. Useful for non-university exams with different layouts.
function HallLayoutEditorPage({ halls, setHalls, showToast }) {
  const [selHallId, setSelHallId] = useState(halls.length ? halls[0].id : null);
  const [saving, setSaving] = useState(false);

  const selHall = halls.find(function(h){ return h.id === selHallId; }) || halls[0] || null;

  // Local edit state — initialised from selected hall
  const [editLayout, setEditLayout] = useState(selHall ? (selHall.layoutConfig || defaultLayout()) : defaultLayout());
  const [editBenches, setEditBenches] = useState(selHall ? String(selHall.numbenches||15) : "15");

  // When user picks a different hall, load its layout
  function selectHall(id) {
    setSelHallId(id);
    const h = halls.find(function(x){ return x.id===id; });
    if (h) {
      setEditLayout(h.layoutConfig || defaultLayout());
      setEditBenches(String(h.numbenches||15));
    }
  }

  async function saveLayout() {
    if (!selHall) return;
    setSaving(true);
    try {
      const saveNb    = parseInt(editBenches) || 15;
      const saveLy    = editLayout || defaultLayout();
      const saveSpr   = seatsPerRowFromLayout(saveLy);
      const saveNCols = (saveLy.columns||[{seats:1}]).length;
      const saveNRows = Math.ceil(saveNb / Math.max(1, saveNCols));
      const payload = {
        numbenches:       saveNb,
        studentsperbench: saveSpr,
        capacity:         saveNRows * saveSpr,
        "layoutConfig":   saveLy,
        "patternId":      "custom",
        "customGrid":     layoutToIcon(saveLy),
      };
      await Store.updateHall(selHall.id, payload);
      setHalls(function(prev){ return prev.map(function(h){ return h.id===selHall.id ? {...h,...payload} : h; }); });
      showToast("Layout saved for "+selHall.name+" ✓", "success");
    } catch(e) { showToast("Error: "+e.message, "error"); }
    finally { setSaving(false); }
  }

  if (!halls.length) return (
    <div className="p-8 text-center text-gray-400">
      <div className="text-5xl mb-4">🏛</div>
      <p className="font-medium">No halls yet. Add halls from <b>Exam Halls</b> first.</p>
    </div>
  );

  const spr = seatsPerRowFromLayout(editLayout);
  const nb  = parseInt(editBenches)||15;
  const nCols = (editLayout.columns||[{seats:1}]).length;
  const nRows = Math.ceil(nb / Math.max(1,nCols));
  const cap   = nRows * spr;

  return (
    <div className="p-6 max-w-2xl">
      <div className="mb-6">
        <h1 className="text-3xl font-black text-gray-900">Hall Layout Editor</h1>
        <p className="text-gray-400 text-sm mt-1">Edit the seating layout for any hall. Changes saved permanently — useful for non-university exams with different configurations.</p>
      </div>

      {/* Hall picker */}
      <div className="mb-5">
        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Select Hall to Edit</label>
        <div className="flex flex-wrap gap-2">
          {halls.map(function(h){
            const isSel = h.id === selHallId;
            return (
              <button key={h.id} onClick={function(){ selectHall(h.id); }}
                className={"px-4 py-2 rounded-xl text-sm font-bold border-2 transition-all " +
                  (isSel ? "border-indigo-500 bg-indigo-50 text-indigo-700" : "border-gray-200 text-gray-600 hover:border-indigo-300")}>
                {h.name}
                <span className="ml-1 text-xs font-normal opacity-60">{h.capacity||'?'} seats</span>
              </button>
            );
          })}
        </div>
      </div>

      {selHall && (<>
        {/* Current hall info */}
        <div className="mb-5 p-4 bg-indigo-50 border border-indigo-200 rounded-xl flex items-center gap-4">
          <div className="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center text-indigo-600 flex-shrink-0"><Ic.Hall/></div>
          <div className="flex-1">
            <div className="font-black text-gray-900">{selHall.name}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              Current: {selHall.numbenches} benches · {selHall.studentsperbench} seats/bench · {selHall.capacity} capacity
            </div>
          </div>
          <div className="text-right">
            <div className="text-2xl font-black text-indigo-600">{cap}</div>
            <div className="text-xs text-gray-400">new capacity</div>
          </div>
        </div>

        {/* Layout builder */}
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-5">
          <HallLayoutBuilder
            layout={editLayout}
            numRows={editBenches}
            onLayoutChange={function(ly){ setEditLayout(ly); }}
            onNumRowsChange={function(n){ setEditBenches(String(Math.max(1, parseInt(String(n))||15))); }}
          />
        </div>

        {/* Save button */}
        <div className="flex gap-3">
          <button onClick={function(){ selectHall(selHall.id); }}
            className="flex-1 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-bold hover:bg-gray-50 text-sm">
            Reset Changes
          </button>
          <button onClick={saveLayout} disabled={saving}
            className="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 text-sm disabled:opacity-50 flex items-center justify-center gap-2">
            {saving ? <><Ic.Spin/>Saving…</> : <>💾 Save Layout for {selHall.name}</>}
          </button>
        </div>
      </>)}
    </div>
  );
}

// ── HALLS PAGE ────────────────────────────────────────────────────────────────
function HallsPage({ halls, setHalls, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editHall, setEditHall] = useState(null);
  const [form, setForm] = useState({ name:"", numbenches:"15", layoutConfig:null });
  const [saving, setSaving] = useState(false);
  const [previewHall, setPreviewHall] = useState(null);

  function blankForm() { return { name:"", numbenches:"15", layoutConfig:defaultLayout() }; }

  function openAdd() { setForm(blankForm()); setEditHall(null); setShowAdd(true); }
  function openEdit(h) {
    setForm({
      name: h.name,
      numbenches: String(h.numbenches||10),
      layoutConfig: h.layoutConfig || h["layoutConfig"] || defaultLayout(),
    });
    setEditHall(h); setShowAdd(true);
  }

  const effectiveLayout = form.layoutConfig || defaultLayout();
  const spr = seatsPerRowFromLayout(effectiveLayout);
  const _benchCols = (effectiveLayout.columns||[{seats:1}]).length;
  const _benchRows = Math.ceil((parseInt(form.numbenches)||15) / Math.max(1,_benchCols));
  const capacity = _benchRows * spr;

  async function saveHall() {
    if (!form.name.trim()) { showToast("Enter hall name","error"); return; }
    setSaving(true);
    try {
      const nb    = parseInt(form.numbenches) || 15;
      const ly    = form.layoutConfig || defaultLayout();
      const spr2  = seatsPerRowFromLayout(ly);
      const nCols = (ly.columns||[{seats:1}]).length;
      const nRows = Math.ceil(nb / Math.max(1, nCols));
      const payload = {
        name: form.name.trim(),
        numbenches: nb,
        studentsperbench: spr2,
        capacity: nRows * spr2,
        "layoutConfig": ly,
        "patternId": "custom",
        "customGrid": layoutToIcon(ly),
      };
      if (editHall) {
        await Store.updateHall(editHall.id, payload);
        setHalls(prev => prev.map(h => h.id===editHall.id ? {...h,...payload} : h));
        showToast("Hall updated!");
      } else {
        const h = { id:uid(), ...payload };
        await Store.addHall(h);
        setHalls(prev => [...prev, h]);
        showToast("Hall "+h.name+" added!");
      }
      setShowAdd(false);
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  async function removeHall(hall) {
    if (!window.confirm("Remove "+hall.name+"?")) return;
    try { await Store.deleteHall(hall.id); setHalls(prev=>prev.filter(h=>h.id!==hall.id)); showToast("Removed","info"); }
    catch(e) { showToast("Error: "+e.message,"error"); }
  }

  return (
    <div className="p-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-3xl font-black text-gray-900">Exam Halls</h1>
          <p className="text-gray-400 text-sm">{halls.length} halls · {halls.reduce((a,h)=>a+(h.capacity||0),0)} total seats</p>
        </div>
        <Btn onClick={openAdd}><Ic.Plus/>Add Hall</Btn>
      </div>

      {/* Hall cards */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        {halls.map(hall => {
          const hallLy  = hall.layoutConfig || defaultLayout();
          const spr3 = seatsPerRowFromLayout(hallLy);
          const icon = layoutToIcon(hallLy);
          return (
            <div key={hall.id} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col gap-3">
              {/* Header */}
              <div className="flex justify-between items-start">
                <div className="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center text-purple-600"><Ic.Hall/></div>
                <span className="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold flex items-center gap-1">
                  <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/></svg>
                  Active
                </span>
              </div>
              <h3 className="text-xl font-black text-gray-900">{hall.name}</h3>
              {/* Stats */}
              <div className="space-y-1.5">
                {(function(){
                  const nCols3 = (hallLy.columns||[{seats:1}]).length;
                  const nRows3 = Math.ceil((hall.numbenches||15) / Math.max(1,nCols3));
                  const realCap = hall.capacity || (nRows3 * spr3);
                  return (<>
                    <div className="flex justify-between py-1.5 border-b border-gray-50 text-sm">
                      <span className="text-gray-400 flex items-center gap-1"><Ic.Hall/> Benches</span>
                      <span className="font-black text-gray-800">{hall.numbenches} <span className="text-gray-400 font-normal text-xs">({nCols3} cols × {nRows3} rows)</span></span>
                    </div>
                    <div className="flex justify-between py-1.5 border-b border-gray-50 text-sm">
                      <span className="text-gray-400 flex items-center gap-1"><Ic.Users/> Seats/row</span>
                      <span className="font-black text-gray-800">{spr3}</span>
                    </div>
                    <div className="flex justify-between py-1.5 text-sm">
                      <span className="text-gray-400">Total Capacity</span>
                      <span className="font-black text-blue-600 text-xl">{realCap}</span>
                    </div>
                  </>);
                })()}
              </div>
              {/* Mini layout preview */}
              <div className="bg-slate-50 border border-slate-200 rounded-xl p-2">
                <div className="w-full py-0.5 rounded bg-slate-700 text-white text-center mb-2" style={{fontSize:9,letterSpacing:2,fontWeight:"bold"}}>FRONT</div>
                <div className="flex flex-col gap-1">
                  {Array(Math.min(hall.numbenches,5)).fill(null).map(function(_,ri){
                    return (
                      <div key={ri} className="flex items-center gap-1">
                        <span style={{fontSize:8,color:"#94a3b8",width:12,textAlign:"right"}}>R{ri+1}</span>
                        <div className="flex items-center gap-0.5 bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5">
                          {hallLy.columns.map(function(col,gi){
                            return (
                              <React.Fragment key={gi}>
                                <div className="flex gap-0.5">
                                  {Array(col.seats||1).fill(null).map(function(_,si){
                                    const isAisle = (col.aisleSeats||[]).includes(si);
                                    return isAisle
                                      ? <div key={si} className="w-2 h-3 bg-amber-200 rounded-sm"/>
                                      : <div key={si} className="w-4 h-3 bg-blue-400 rounded-sm"/>;
                                  })}
                                </div>
                                {gi < hallLy.columns.length-1 && hallLy.aisleAfter[gi] && <div className="w-1.5 self-stretch bg-slate-200 rounded-sm mx-0.5"/>}
                              </React.Fragment>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                  {hall.numbenches > 5 && <div style={{fontSize:9}} className="text-center text-gray-400">+{hall.numbenches-5} more rows</div>}
                </div>
              </div>
              {/* Action buttons */}
              <div className="flex gap-2">
                <button onClick={()=>setPreviewHall(hall)} className="flex-1 py-1.5 text-blue-500 hover:text-blue-700 text-xs font-bold hover:bg-blue-50 rounded-xl border border-blue-100">
                  Full Preview
                </button>
                <button onClick={()=>openEdit(hall)} className="flex-1 py-1.5 text-indigo-500 hover:text-indigo-700 text-xs font-bold hover:bg-indigo-50 rounded-xl border border-indigo-100">
                  Edit
                </button>
                <button onClick={()=>removeHall(hall)} className="flex-1 py-1.5 text-red-400 hover:text-red-600 text-xs font-bold hover:bg-red-50 rounded-xl border border-red-100">
                  Remove
                </button>
              </div>
            </div>
          );
        })}
        {!halls.length && (
          <div className="col-span-3 text-center py-16 text-gray-400">
            <div className="flex justify-center mb-4 opacity-30"><Ic.Hall/></div>
            <p className="font-medium">No halls yet. Add your first exam hall.</p>
          </div>
        )}
      </div>

      {/* Full preview modal */}
      {previewHall && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={()=>setPreviewHall(null)}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-xl font-black text-gray-900">{previewHall.name} — Layout Preview</h3>
              <button onClick={()=>setPreviewHall(null)} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500">✕</button>
            </div>
            <HallLayoutVisualiser hall={previewHall} layout={previewHall.layoutConfig||defaultLayout()} title={previewHall.name}/>
          </div>
        </div>
      )}

      {/* Add / Edit modal */}
      {showAdd && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={()=>setShowAdd(false)}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[92vh] overflow-y-auto p-8" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-6">
              <h3 className="text-xl font-black text-gray-900">{editHall?"Edit Hall":"Add Exam Hall"}</h3>
              <button onClick={()=>setShowAdd(false)} className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500">✕</button>
            </div>

            <Input label="Hall Name" value={form.name} onChange={v=>setForm(p=>({...p,name:v}))} placeholder="e.g. LH 1, Lab 1" required
              hint="Name of the exam hall (e.g. LH 1, Seminar Hall)"/>

            {/* Hall structure explanation */}
            <div className="mb-4 p-3 bg-indigo-50 border border-indigo-200 rounded-xl">
              <div className="flex items-start gap-2">
                <svg className="w-4 h-4 text-indigo-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div className="text-xs text-indigo-700">
                  <b>How hall layout works:</b> Set how many <b>seat groups (S1, S2, S3…)</b> each bench has and how many benches are in the hall.
                  Your hall example: <b>3 seat groups × 3 benches per row × 5 rows = 15 benches × 3 seats = 45 students</b>.
                  Use "Number of Benches" below for total benches. Each column group = one seat group (S1/S2/S3).
                </div>
              </div>
            </div>

            {/* Quick presets — match S1/S2/S3 naming */}
            <div className="mb-4">
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Quick Presets — Seat Groups per Bench</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  {label:"S1 · S2 · S3", desc:"Your hall — 3 seats/bench",    ly:{columns:[{seats:1},{seats:1},{seats:1}],aisleAfter:[true,true,false]}, recommended:true},
                  {label:"S1 only",       desc:"1 seat per bench",              ly:{columns:[{seats:1}],aisleAfter:[false]}},
                  {label:"S1 · S2",       desc:"2 seats per bench",             ly:{columns:[{seats:1},{seats:1}],aisleAfter:[true,false]}},
                  {label:"S1·S2·S3·S4",  desc:"4 seats per bench",             ly:{columns:[{seats:1},{seats:1},{seats:1},{seats:1}],aisleAfter:[true,true,true,false]}},
                  {label:"S1(2)·S2(2)·S3(2)", desc:"6 seats/bench (2 per group)", ly:{columns:[{seats:2},{seats:2},{seats:2}],aisleAfter:[true,true,false]}},
                  {label:"S1(3)·S2(3)·S3(3)", desc:"9 seats/bench (3 per group)", ly:{columns:[{seats:3},{seats:3},{seats:3}],aisleAfter:[true,true,false]}},
                ].map(function(preset){
                  const isActive = JSON.stringify(effectiveLayout) === JSON.stringify(preset.ly);
                  return (
                    <button key={preset.label}
                      onClick={function(){ setForm(p=>({...p,layoutConfig:preset.ly})); }}
                      className={"border-2 rounded-xl p-2 text-center transition-all relative " +
                        (isActive ? "border-indigo-500 bg-indigo-50" : preset.recommended ? "border-green-400 bg-green-50 hover:border-green-500" : "border-gray-200 hover:border-indigo-300")}>
                      {preset.recommended && !isActive && (
                        <div style={{position:'absolute',top:-8,left:'50%',transform:'translateX(-50%)',
                          fontSize:7,fontWeight:800,color:'#fff',background:'#16a34a',
                          borderRadius:4,padding:'1px 6px',whiteSpace:'nowrap',letterSpacing:0.5}}>
                          ✓ RECOMMENDED
                        </div>
                      )}
                      <div className="flex justify-center mb-1">
                        <BenchLayoutPreview layout={preset.ly} small={true}/>
                      </div>
                      <div className={"font-bold text-xs " + (isActive?"text-indigo-700":preset.recommended?"text-green-700":"text-gray-700")}>{preset.label}</div>
                      <div className="text-gray-400" style={{fontSize:9}}>{seatsPerRowFromLayout(preset.ly)} seats/bench</div>
                    </button>
                  );
                })}
              </div>
            </div>

            <HallLayoutBuilder
              layout={effectiveLayout}
              numRows={form.numbenches}
              onLayoutChange={function(ly){ setForm(p=>({...p, layoutConfig:ly})); }}
              onNumRowsChange={function(n){ var v=parseInt(String(n))||1; setForm(p=>({...p, numbenches:String(Math.max(1,v))})); }}
            />

            <div className="flex gap-3 mt-6">
              <Btn variant="ghost" onClick={()=>setShowAdd(false)} className="flex-1">Cancel</Btn>
              <Btn onClick={saveHall} disabled={saving} className="flex-1">{saving?"Saving...":editHall?"Save Changes":"Add Hall"}</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ── EXAMS PAGE ────────────────────────────────────────────────────────────────
function ExamsPage({ exams, setExams, halls, students, showToast, onGenerate }) {
  const [showAdd,setShowAdd]=useState(false);
  const [editExam,setEditExam]=useState(null);
  const blankGroup = {dept:"CSE",year:"1",subjectName:"",count:"30"};
  const [form,setForm]=useState({subject:"",date:"",session:"FN",hallids:[],groups:[{...blankGroup}],status:"scheduled"});
  const [saving,setSaving]=useState(false);
  const [generating,setGenerating]=useState(null);

  function openAdd() { setForm({subject:"",date:"",session:"FN",hallids:[],groups:[{...blankGroup}],status:"scheduled"}); setEditExam(null); setShowAdd(true); }
  function openEdit(e) { setForm({...e,groups:e.groups||[{...blankGroup}],hallids:e.hallids||[]}); setEditExam(e); setShowAdd(true); }

  function addGroup() { setForm(f=>({...f,groups:[...f.groups,{...blankGroup}]})); }
  function removeGroup(i) { setForm(f=>({...f,groups:f.groups.filter((_,j)=>j!==i)})); }
  function setGroup(i,k,v) { setForm(f=>({...f,groups:f.groups.map((g,j)=>j===i?{...g,[k]:v}:g)})); }
  function toggleHall(hid) { setForm(f=>({...f,hallids:f.hallids.includes(hid)?f.hallids.filter(x=>x!==hid):[...f.hallids,hid]})); }

  async function saveExam() {
    if (!form.subject||!form.date||!form.groups.length) { showToast("Fill all required fields","error"); return; }
    setSaving(true);
    try {
      const payload = { subject:form.subject, date:form.date, session:form.session, status:form.status, groups:form.groups, hallids:form.hallids };
      if (editExam) {
        await Store.updateExam(editExam.id, payload);
        setExams(prev=>prev.map(e=>e.id===editExam.id?{...e,...payload}:e));
        showToast("Exam updated!");
      } else {
        const e={id:uid(),...payload,seatinggenerated:false};
        await Store.addExam(e);
        setExams(prev=>[...prev,e]);
        showToast("Exam created!");
      }
      setShowAdd(false);
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  async function removeExam(e) {
    if (!window.confirm(`Remove "${e.subject}"?`)) return;
    try { await Store.deleteExam(e.id); setExams(prev=>prev.filter(x=>x.id!==e.id)); showToast("Removed","info"); }
    catch(err) { showToast("Error: "+err.message,"error"); }
  }

  const sessionColor = s => s==="FN"?"bg-amber-100 text-amber-700":"bg-indigo-100 text-indigo-700";

  return (
    <div className="p-8">
      <div className="flex items-center justify-between mb-6">
        <div><h1 className="text-3xl font-black text-gray-900">Exam Sessions</h1><p className="text-gray-400 text-sm">{exams.length} exams</p></div>
        <Btn onClick={openAdd}><Ic.Plus/>Create Exam</Btn>
      </div>
      <div className="space-y-4">
        {exams.map(exam=>{
          const totalEligible = (() => {
            // Match by dept+year first, then dept only, then all
            let n = (exam.groups||[]).reduce((a,g)=>a+students.filter(s=>s.dept?.toUpperCase()===g.dept?.toUpperCase()&&String(s.year)===String(g.year)).length,0);
            if (!n) n = (exam.groups||[]).reduce((a,g)=>a+students.filter(s=>s.dept?.toUpperCase()===g.dept?.toUpperCase()).length,0);
            if (!n) n = students.length;
            return n;
          })();
          return <div key={exam.id} className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <div className="flex items-start justify-between gap-4 flex-wrap">
              <div className="flex-1">
                <div className="flex items-center gap-3 flex-wrap mb-2">
                  <h3 className="text-xl font-black text-gray-900">{exam.subject}</h3>
                  <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${sessionColor(exam.session)}`}>{exam.session==="FN"?"FN":"AN"}</span>
                  {exam.seatinggenerated?<span className="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold flex items-center gap-1"><Ic.Chk/>Seated</span>:<span className="px-2.5 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-bold">Pending</span>}
                </div>
                <div className="flex flex-wrap gap-4 text-sm text-gray-400 mb-3">
                  <span> {exam.date}</span>
                  <span> ~{totalEligible} eligible</span>
                  {exam.hallids?.length?<span> {exam.hallids.length} halls</span>:<span> All halls</span>}
                </div>
                <div className="flex gap-2 flex-wrap">
                  {(exam.groups||[]).map((g,i)=>(
                    <span key={i} className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${deptColor(g.dept)}`}>
                      {g.dept} Y{g.year}{g.subjectName?` - ${g.subjectName}`:""}
                    </span>
                  ))}
                </div>
              </div>
              <div className="flex gap-2 flex-wrap">
                <Btn variant="ghost" size="sm" onClick={()=>openEdit(exam)}><Ic.Edit/>Edit</Btn>
                <Btn onClick={async()=>{setGenerating(exam.id);await onGenerate(exam);setGenerating(null);}} disabled={generating===exam.id} size="sm">
                  {generating===exam.id?<><Ic.Spin/>Generating...</>:<><Ic.Zap/>{exam.seatinggenerated?"Re-Generate":"Generate Seating"}</>}
                </Btn>
                <Btn variant="danger" size="sm" onClick={()=>removeExam(exam)}>Remove</Btn>
              </div>
            </div>
          </div>;
        })}
        {!exams.length&&<div className="text-center py-16 text-gray-400"><div className="flex justify-center mb-4 opacity-30 scale-150"><Ic.Cal/></div><p className="font-medium mt-2">No exams yet. Create your first exam.</p></div>}
      </div>

                <div className="mb-4">
          <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Halls (leave unselected = all halls)</label>

 {h.name} ({h.numbenches}Bx{h.studentsperbench}={h.capacity})

        <div className="mb-4">
          <div className="flex items-center justify-between mb-3">
