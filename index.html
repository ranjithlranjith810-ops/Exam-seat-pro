// ── BACKUP & RESTORE PAGE ─────────────────────────────────────────────────────
function BackupRestorePage({ students, setStudents, halls, setHalls, exams, setExams, seatingPlans, setSeatingPlans, showToast }) {
  const [restoring, setRestoring] = useState(false);
  const fileRef = useRef();

  function exportBackup() {
    const backup = {
      version: "ExamSeatPro-v1",
      exported: new Date().toISOString(),
      college: ACTIVE_COLLEGE,
      data: { students, halls, exams, seatingPlans }
    };
    const json = JSON.stringify(backup, null, 2);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
    a.download=`examSeatPro_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
    addAuditEntry("Backup Exported", `${students.length} students, ${exams.length} exams`);
    showToast("Backup downloaded!");
  }

  async function handleRestore(file) {
    if (!file) return;
    if (!window.confirm("[!] Restore will overwrite ALL current data. Continue?")) return;
    setRestoring(true);
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      if (!backup.data) throw new Error("Invalid backup file format");
      const { students: s, halls: h, exams: e, seatingPlans: sp } = backup.data;

      // Restore students
      if (s?.length) {
        await sb("students","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`);
        await sb("students","POST",s);
        setStudents(s);
      }
      // Restore halls
      if (h?.length) {
        await sb("halls","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`);
        await sb("halls","POST",h);
        setHalls(h);
      }
      // Restore exams
      if (e?.length) {
        await sb("exams","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`);
        await sb("exams","POST",e);
        setExams(e);
      }
      // Restore seating plans
      if (sp && Object.keys(sp).length) {
        await sb("seating_plans","DELETE",null,"?id=gt.0");
        for (const [exam_id, plan] of Object.entries(sp)) {
          await sb("seating_plans","POST",{exam_id, plan});
        }
        setSeatingPlans(sp);
      }

      addAuditEntry("Backup Restored", `From file: ${file.name}`);
      showToast(`Restored: ${s?.length||0} students, ${e?.length||0} exams, ${h?.length||0} halls`);
    } catch(err) { showToast("Restore failed: "+err.message,"error"); }
    finally { setRestoring(false); }
  }

  const statSize = JSON.stringify({students,halls,exams,seatingPlans}).length;

  return (
    <div className="p-8 max-w-3xl">
      <h1 className="text-3xl font-black text-gray-900 mb-1">Backup & Restore</h1>
      <p className="text-gray-400 text-sm mb-6">Export all data as JSON   Import to restore on another device</p>

      <div className="grid grid-cols-2 gap-5 mb-6">
        {/* Export Card */}
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-500 mb-4"><Ic.Backup/></div>
          <h2 className="font-black text-gray-900 text-lg mb-1">Export Backup</h2>
          <p className="text-gray-400 text-sm mb-4">Download all data as a single JSON file</p>
          <div className="space-y-1 mb-4 text-xs text-gray-500">
            <div className="flex items-center gap-2"><Ic.Users/> <span>{students.length} students</span></div>
            <div className="flex items-center gap-2"><Ic.Cal/> <span>{exams.length} exams</span></div>
            <div className="flex items-center gap-2"><Ic.Hall/> <span>{halls.length} halls</span></div>
            <div className="flex items-center gap-2"><Ic.Grid/> <span>{Object.keys(seatingPlans).length} seating plans</span></div>
            <div className="flex items-center gap-2"><Ic.Down/> <span>~{Math.round(statSize/1024)} KB</span></div>
          </div>
          <Btn onClick={exportBackup} className="w-full justify-center"><Ic.Down/>Download Backup</Btn>
        </div>

        {/* Restore Card */}
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-500 mb-4"><Ic.Upload/></div>
          <h2 className="font-black text-gray-900 text-lg mb-1">Restore Backup</h2>
          <p className="text-gray-400 text-sm mb-4">Upload a previously exported JSON backup file</p>
          <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-700 text-xs mb-4">
            <div className="flex items-center gap-1.5 font-semibold"><Ic.Warn/> Warning</div>This will overwrite all existing data in the database
          </div>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={e=>{if(e.target.files[0])handleRestore(e.target.files[0]);}}/>
          <Btn onClick={()=>fileRef.current?.click()} disabled={restoring} variant="ghost" className="w-full justify-center">
            {restoring?<><Ic.Spin/>Restoring...</>:"Upload & Restore"}
          </Btn>
        </div>
      </div>

      {/* Excel Export */}
      <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 className="font-black text-gray-900 text-lg mb-1"> Export to Excel (CSV)</h2>
        <p className="text-gray-400 text-sm mb-4">Export individual tables as Excel-compatible CSV files</p>
        <div className="grid grid-cols-2 gap-3">
          {[
            {label:"Students List", onClick:()=>{
              const csv=["id,regno,name,dept,year,gender",...students.map(s=>`${s.id},${s.regno},"${s.name}",${s.dept},${s.year},${s.gender}`)].join("\n");
              const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="students.csv";a.click();
              addAuditEntry("Export Excel", "Students list");
            }},
            {label:"Exam Schedule", onClick:()=>{
              const csv=["id,subject,date,session,status",...exams.map(e=>`${e.id},"${e.subject}",${e.date},${e.session},${e.status}`)].join("\n");
              const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="exams.csv";a.click();
              addAuditEntry("Export Excel", "Exam schedule");
            }},
            {label:"Hall List", onClick:()=>{
              const csv=["id,name,numbenches,studentsperbench,capacity",...halls.map(h=>`${h.id},${h.name},${h.numbenches},${h.studentsperbench},${h.capacity}`)].join("\n");
              const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="halls.csv";a.click();
            }},
            {label:"All Seating Data", onClick:()=>{
              const rows=["exam_id,subject,date,session,hall,seatNo,regno,dept"];
              Object.entries(seatingPlans).forEach(([eid,plan])=>{
                const exam=exams.find(e=>e.id===eid);
                Object.values(plan).forEach(hp=>{
                  (hp.seats||[]).forEach(s=>{
                    rows.push(`${eid},"${exam?.subject||""}",${exam?.date||""},${exam?.session||""},${hp.hallName},${s.seatNo},${s.regno},${s.dept}`);
                  });
                });
              });
              const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="all_seating.csv";a.click();
              addAuditEntry("Export Excel", "All seating data");
            }},
          ].map(({label,onClick})=>(
            <button key={label} onClick={onClick}
              className="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-gray-200 text-gray-600 hover:border-blue-300 hover:text-blue-600 font-bold text-sm transition-all">
              <Ic.Down/>{label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

          className="w-full py-4 rounded-xl font-black text-white text-sm flex items-center justify-center gap-2 transition-all"
          style={{background: saved ? "linear-gradient(135deg,#059669,#10b981)" : "linear-gradient(135deg,#2563eb,#7c3aed)"}}>
          {saved ? "Saved!" : "Save PDF Settings"}
        </button>
      </div>
    </div>
  );
}

function addAuditEntry(action, detail) {

    logs.unshift({ ts: new Date().toISOString(), action, detail, user: "Admin" });

}


// ── DEVELOPER DASHBOARD ───────────────────────────────────────────────────────
function DevDashboard({ onLogout, students, setStudents, exams, setExams, halls, setHalls, seatingPlans, setSeatingPlans }) {
  const [colleges, setColleges] = useState([]);
  const [loadingColleges, setLoadingColleges] = useState(true);
  const [toast, setToast] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [editCol, setEditCol] = useState(null);
  const [saving, setSaving] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const [showPwd, setShowPwd] = useState(false);
  const emptyForm = { name:"", centre_code:"", admin_password:"", address:"", phone:"", email:"" };
  const [form, setForm] = useState(emptyForm);
  const showToast = useCallback(function(msg,type){ setToast({msg:msg,type:type||"success"}); },[]);

  useEffect(function(){
    (async function(){
      try {
        const res = await sb("colleges","GET",null,"?select=*&order=name.asc");
        setColleges(res||[]);
      } catch(e){ showToast("Colleges table not found. Run the SQL setup.","warn"); }
      finally { setLoadingColleges(false); }
    })();
  },[]);

  function openAdd() {
    setForm(Object.assign({}, emptyForm));
    setEditCol(null); setShowPwd(false); setShowModal(true);
  }
  function openEdit(c) {
    setForm({ name:c.name||"", centre_code:c.centre_code||"", admin_password:c.admin_password||"", address:c.address||"", phone:c.phone||"", email:c.email||"" });
    setEditCol(c); setShowPwd(false); setShowModal(true);
  }

  async function saveCollege() {
    if (!form.name.trim()) { showToast("College name required","error"); return; }
    if (!form.centre_code.trim()) { showToast("Centre code required","error"); return; }
    if (!form.admin_password.trim()) { showToast("Admin password required","error"); return; }
    setSaving(true);
    try {
      const payload = {
        name: form.name.trim(),
        centre_code: form.centre_code.trim(),
        admin_password: form.admin_password.trim(),
        address: form.address.trim(),
        phone: form.phone.trim(),
        email: form.email.trim(),
        exam_title: "ANNA UNIVERSITY CHENNAI EXAMINATIONS NOV/DEC 2025",
      };
      if (editCol) {
        await sb("colleges","PATCH",payload,"?id=eq."+editCol.id);
        setColleges(function(prev){ return prev.map(function(c){ return c.id===editCol.id ? Object.assign({},c,payload) : c; }); });
        showToast("College updated!");
      } else {
        const c = Object.assign({ id:uid() }, payload);
        await sb("colleges","POST",c);
        setColleges(function(prev){ return [...prev, c]; });
        showToast("College created! Admin can now log in.");
      }
      setShowModal(false);
    } catch(e){ showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  async function deleteCollege(c) {
    if (!window.confirm("Delete college: "+c.name+" (Centre: "+c.centre_code+")? The admin for this college will no longer be able to log in.")) return;
    try {
      await sb("colleges","DELETE",null,"?id=eq."+c.id);
      setColleges(function(prev){ return prev.filter(function(x){ return x.id!==c.id; }); });
      showToast(c.name+" deleted. Admin login disabled.","info");
    } catch(e){ showToast("Error: "+e.message,"error"); }
  }

  async function deleteAllStudents() {
    if (!window.confirm("DELETE ALL STUDENTS? This permanently removes all student records. Are you sure?")) return;
    setDeleting("students");
    try { await sb("students","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`); setStudents([]); showToast("All students deleted","info"); }
    catch(e){ showToast("Error: "+e.message,"error"); } finally { setDeleting(null); }
  }
  async function deleteAllExams() {
    if (!window.confirm("DELETE ALL EXAMS AND SEATING PLANS? Are you sure?")) return;
    setDeleting("exams");
    try {
      await sb("seating_plans","DELETE",null,"?id=gt.0");
      await sb("exams","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`);
      setExams([]); setSeatingPlans({});
      showToast("All exams and seating plans deleted","info");
    } catch(e){ showToast("Error: "+e.message,"error"); } finally { setDeleting(null); }
  }
  async function deleteAllHalls() {
    if (!window.confirm("DELETE ALL EXAM HALLS?")) return;
    setDeleting("halls");
    try { await sb("halls","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`); setHalls([]); showToast("All halls deleted","info"); }
    catch(e){ showToast("Error: "+e.message,"error"); } finally { setDeleting(null); }

// Attendance PDF Import
const BRANCH_CODE_TO_DEPT = {
  "104":"CSE","105":"EEE","106":"ECE","114":"MECH",
  "119":"CIVIL","154":"IT","243":"AIDS","244":"AIDS"
};

function guessDeptFromBranchName(name) {
  var n = (name||"").toUpperCase();
  if (n.indexOf("COMPUTER") >= 0) return "CSE";
  if (n.indexOf("ELECTRONIC") >= 0 && n.indexOf("COMMUN") >= 0) return "ECE";
  if (n.indexOf("ELECTRICAL") >= 0) return "EEE";
  if (n.indexOf("MECHANIC") >= 0) return "MECH";
  if (n.indexOf("CIVIL") >= 0) return "CIVIL";
  if (n.indexOf("INFORMATION") >= 0) return "IT";
  if (n.indexOf("ARTIFICIAL") >= 0 || n.indexOf("DATA") >= 0) return "AIDS";
  return "GEN";
}

function inferYear(regno) {
  try {
    var yy = parseInt((regno||"").slice(4,6));
    var admYear = 2000 + yy;
    return Math.min(4, Math.max(1, 2025 - admYear + 1));
  } catch(e) { return 2; }
}

function parseAttendancePDF(pages) {
  var results = [];
  var monthMap = {JAN:"01",FEB:"02",MAR:"03",APR:"04",MAY:"05",JUN:"06",JUL:"07",AUG:"08",SEP:"09",OCT:"10",NOV:"11",DEC:"12"};

  for (var pi = 0; pi < pages.length; pi++) {
    var rawText = pages[pi];
    var text = rawText.replace(/[ \t]+/g, " ");
    var noSpaceText = rawText.replace(/\s/g, "");

    var date = "";
    var dm = text.match(/(\d{2})[\/\-](\w{3,})[\/\-](\d{4})/i);
    if (dm) {
      var day = dm[1].padStart(2,"0");
      var monRaw = dm[2].toUpperCase().slice(0,3);
      var mon = monthMap[monRaw] || "12";
      date = dm[3]+"-"+mon+"-"+day;
    } else {
      var dm2 = text.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
      if (dm2) date = dm2[3]+"-"+dm2[2]+"-"+dm2[1];
    }
    var sessM = text.match(/Session\s*[:\s]*(AN|FN|Afternoon|Forenoon)/i);
    var session = sessM ? (sessM[1].toUpperCase().charAt(0)==="A" ? "AN" : "FN") : "AN";

    var branchM = text.match(/Branch\s*Code[\/\s]*Name\s*[:\s]+(\d{3})\s*[-\u2013\u2014]+\s*([^\r\n]+)/i);
    if (!branchM) branchM = text.match(/Branch\s+Code\/Name\s*[:\s]+(\d{3})\s*-+\s*([^\r\n]+)/i);
    var branchCode = "", branchName = "", dept = "GEN";
    if (branchM) {
      branchCode = branchM[1].trim();
      branchName = branchM[2].trim().replace(/\s+/g," ").replace(/\s*(Date|Session|Subject).*$/i,"").trim();
      dept = BRANCH_CODE_TO_DEPT[branchCode] || guessDeptFromBranchName(branchName);
    }

    var subjM = text.match(/Subject\s*Code[\/\s]*Name\s*[:\s]+([A-Z]{2,4}\d{3,6}[A-Z0-9]*)\s*[-\u2013\u2014]+\s*([^\r\n]+)/i);
    if (!subjM) subjM = text.match(/Subject\s+Code\/Name\s*[:\s]+([A-Z0-9]{4,10})\s*-+\s*([^\r\n]+)/i);
    if (!subjM) subjM = text.match(/\b([A-Z]{2,3}\d{4,6}[A-Z0-9]*)\s*-+\s*([A-Z][A-Za-z\s]{5,60})/);
    var subjectCode = "", subjectName = "";
    if (subjM) {
      subjectCode = subjM[1].trim();
      subjectName = (subjM[2]||"").trim().replace(/\s+/g," ").replace(/\s*(Date|Session|Branch|College).*$/i,"").slice(0,60);
    }

    if (!subjectCode || !date) continue;

    var students = [];
    var used = {};

    var rowPattern = /\b(\d{12})\b/g;
    var m;
    while ((m = rowPattern.exec(text)) !== null) {
      var regno = m[1];
      if (used[regno]) continue;
      used[regno] = true;
      // After the register number, skip optional whitespace + serial number, then capture NAME
      // PDF format: "953021104020 JEYA MELVIN SEKAR S" or "953021104020  JEYA MELVIN SEKAR S  "
      var after = text.slice(m.index + regno.length, m.index + regno.length + 200);
      // Try: optional whitespace, optional serial digits, then UPPERCASE NAME
      var nameM = after.match(/^\s+(?:\d+\s+)?([A-Z][A-Z\s\.]{1,59}?)(?:\s{2,}|\s*\n|\s*\d{6,}|$)/);
      if (!nameM) nameM = after.match(/^\s+([A-Z][A-Z\s\.]{1,59}?)(?:\s{2,}|\s*\n|$)/);
      var name = "";
      if (nameM && nameM[1]) {
        name = nameM[1].trim().replace(/\s+/g," ");
        // Reject if it looks like a column header or noise
        if (/^(ANNA|UNIVERSITY|COLLEGE|BRANCH|SUBJECT|REGISTER|DATE|SESSION|HALL|TOTAL|PAGE|PHOTO|SIGNATURE|ABSENT|CANDIDATE)/.test(name)) name = "";
        // Must be at least 2 chars and contain a letter
        if (name.length < 2) name = "";
      }
      // If name extraction failed, leave blank — will be set in import step
      students.push({regno:regno, name:name});
    }

    var regnoPatternNS = /9[0-9]{11}/g;
    while ((m = regnoPatternNS.exec(noSpaceText)) !== null) {
      var rn = m[0];
      if (rn.length !== 12) continue;
      if (used[rn]) continue;
      used[rn] = true;
      students.push({regno:rn, name:rn});
    }

    if (!students.length) continue;
    var key = subjectCode+"_"+date+"_"+session;
    var existing = null;
    for (var ri = 0; ri < results.length; ri++) {
      if (results[ri].key === key) { existing = results[ri]; break; }
    }
    if (existing) {
      var existingRegnos = {};
      existing.students.forEach(function(s){ existingRegnos[s.regno]=true; });
      students.forEach(function(s){ if (!existingRegnos[s.regno]) existing.students.push(s); });
    } else {
      results.push({key:key, date:date, session:session, subjectCode:subjectCode, subjectName:subjectName, dept:dept, branchCode:branchCode, branchName:branchName, students:students});
    }
  }
  return results;
}
// ── BENCH LAYOUT PATTERNS ─────────────────────────────────────────────────────
function AttendancePDFImportPage({ students, setStudents, exams, setExams, halls, seatingPlans, setSeatingPlans, showToast }) {
  const [status, setStatus] = useState("idle");
  const [msg, setMsg] = useState("");
  const [parsed, setParsed] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [selectedGroups, setSelectedGroups] = useState(new Set());
  // Hall selection — use admin halls
  const [selectedHallIds, setSelectedHallIds] = useState([]);
  const [layoutConfig, setLayoutConfig] = useState(defaultLayout());
  const [numBenches, setNumBenches] = useState(15);
  const [showLayoutPreview, setShowLayoutPreview] = useState(false);
  const fileRef = useRef();

  const spr = seatsPerRowFromLayout(layoutConfig || defaultLayout());

  // Auto-select first hall when halls load and sync its layout
  useEffect(function(){
    if (halls.length && !selectedHallIds.length) {
      const h = halls[0];
      setSelectedHallIds([h.id]);
      if (h.layoutConfig) setLayoutConfig(h.layoutConfig);
      if (h.numbenches)   setNumBenches(h.numbenches);
    }
  }, [halls]);

  function toggleHallSel(id) {
    setSelectedHallIds(function(prev){
      if (prev.includes(id)) return prev.filter(x=>x!==id);
      return [...prev, id];
    });
  }

  async function handleFile(file) {
    if (!file || !file.name.endsWith(".pdf")) { showToast("Please upload a PDF file","error"); return; }
    setStatus("parsing"); setMsg("Loading PDF..."); setParsed(null); setSelectedGroups(new Set());
    try {
      if (typeof pdfjsLib === "undefined") throw new Error("PDF.js not ready. Please wait and try again.");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tc = await page.getTextContent();
        const lineText = tc.items.map(function(it){ return it.str; }).join("\n");
        pages.push(lineText);
      }
      setMsg("Parsing attendance data...");
      const result = parseAttendancePDF(pages);
      if (!result.length) throw new Error("No attendance data found. Make sure this is an Anna University Examination Attendance Sheet PDF.");
      setParsed(result);
      setSelectedGroups(new Set(result.map(function(_,i){ return i; })));
      const totalStudents = result.reduce(function(a,g){ return a + g.students.length; }, 0);
      setStatus("done");
      setMsg("Found "+result.length+" subject group(s) with "+totalStudents+" students");
    } catch(e) { setStatus("error"); setMsg(e.message); }
  }

  function toggleGroup(i) {
    setSelectedGroups(function(prev) {
      const n = new Set(prev);
      if (n.has(i)) { n.delete(i); } else { n.add(i); }
      return n;
    });
  }

  async function importAndGenerateSeating() {
    if (!parsed || !selectedGroups.size) { showToast("Select at least one group","error"); return; }
    if (!selectedHallIds.length) { showToast("Select at least one hall","error"); return; }
    setSaving(true);
    try {
      const toImport = parsed.filter(function(_,i){ return selectedGroups.has(i); });
      // Upsert students
      const allStudentsMap = {};
      toImport.forEach(function(group) {
        group.students.forEach(function(s) {
          if (!allStudentsMap[s.regno]) {
            var stuName = (s.name && s.name !== s.regno && s.name.length > 1) ? s.name : s.regno;
            var stuPwd = s.regno.slice(-4); // last 4 digits of roll number
            allStudentsMap[s.regno] = { id:uid(), regno:s.regno, name:stuName, dept:group.dept, year:inferYear(s.regno), gender:"male", password:hashPwd(stuPwd) };
          }
        });
      });
      const allNew = Object.values(allStudentsMap);
      const existingRegnos = new Set(students.map(function(s){ return s.regno; }));
      // Deduplicate within allNew itself before inserting
      const seenNew = {};
      const brandNew = allNew.filter(function(s){
        if (existingRegnos.has(s.regno) || seenNew[s.regno]) return false;
        seenNew[s.regno] = true;
        return true;
      });
      if (brandNew.length > 0) {
        // Upload in chunks of 20 to avoid Supabase duplicate-constraint errors
        const CHUNK = 20;
        for (let ci = 0; ci < brandNew.length; ci += CHUNK) {
          const chunk = brandNew.slice(ci, ci + CHUNK).map(function(s){ return {...s, college_id: Store.getCollegeId()}; });
          await sb("students","POST", chunk);
        }
        setStudents(function(prev){ return [...prev, ...brandNew]; });
      }
      const mergedStudents = [...students, ...brandNew];

      // Get selected admin halls
      const selHalls = halls.filter(function(h){ return selectedHallIds.includes(h.id); });

      let examsCreated = 0, totalSeats = 0;
      for (const group of toImport) {
        const sorted = [...group.students].sort(function(a,b){ return a.regno.localeCompare(b.regno); });
        const plan = {};
        let cursor = 0;

        for (const hall of selHalls) {
          if (cursor >= sorted.length) break;
          const benches = [];
          // Calculate benches needed in this hall based on pattern seats per bench
          const benchCapacity = seatsPerRowFromLayout(layoutConfig || defaultLayout());
          const maxBenchesInHall = hall.numbenches;

          for (let b = 0; b < maxBenchesInHall && cursor < sorted.length; b++) {
            const slots = [];
            for (let s = 0; s < benchCapacity && cursor < sorted.length; s++) {
              const st = sorted[cursor];
              const dbSt = mergedStudents.find(function(x){ return x.regno===st.regno; });
              const seatNo = hall.name+"-B"+(b+1)+"S"+(s+1);
              slots.push({
                regno: st.regno,
                name: st.name||st.regno,
                dept: group.dept,
                year: dbSt ? dbSt.year : inferYear(st.regno),
                gender: "male",
                seatNo: seatNo,
                hall: hall.name,
                hallId: hall.id,
                bench: b+1,
                slot: s+1,
                groupLabel: group.subjectCode
              });
              cursor++;
            }
            benches.push({ benchNo:b+1, slots:slots, capacity:benchCapacity });
          }

          const seats = benches.flatMap(function(b){ return b.slots; });
          if (seats.length > 0) {
            plan[hall.id] = {
              hallName: hall.name,
              numbenches: benches.length,
              studentsperbench: benchCapacity,
              capacity: seats.length,
              benches: benches,
              seats: seats,
              layoutConfig: layoutConfig || defaultLayout()
            };
          }
        }

        // Warn if students overflow all halls
        if (cursor < sorted.length) {
          showToast("Warning: "+( sorted.length-cursor)+" students from "+group.subjectCode+" couldn't be seated — add more halls","warn");
        }

        const existingExam = exams.find(function(e){ return e.subject===group.subjectCode && e.date===group.date && e.session===group.session; });
        let examId;
        if (existingExam) {
          examId = existingExam.id;
          await Store.updateExam(examId, {seatinggenerated:true, hallids:selectedHallIds});
          setExams(function(prev){ return prev.map(function(e){ return e.id===examId ? Object.assign({},e,{seatinggenerated:true,hallids:selectedHallIds}) : e; }); });
        } else {
          examId = uid();
          const newExam = { id:examId, subject:group.subjectCode+" - "+group.subjectName, date:group.date, session:group.session, status:"scheduled", groups:[{dept:group.dept, year:"2", subjectName:group.subjectName, count:String(sorted.length)}], hallids:selectedHallIds, seatinggenerated:true };
          await Store.addExam(newExam);
          setExams(function(prev){ return [...prev, newExam]; });
          examsCreated++;
        }
        await Store.setSeatingPlan(examId, plan);
        setSeatingPlans(function(prev){ return Object.assign({}, prev, {[examId]:plan}); });
        totalSeats += Object.values(plan).reduce(function(a,hp){ return a+(hp.seats||[]).length; },0);
      }
      showToast("Done! "+brandNew.length+" students added, "+examsCreated+" exams created, "+totalSeats+" seats arranged");
      setParsed(null); setStatus("idle"); setMsg(""); setSelectedGroups(new Set());
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  // Icon helpers inline (JSX)
  const IcPDF = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
  const IcCheckCircle = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
  const IcXCircle = () => <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
  const IcSpinner = () => <svg className="w-10 h-10 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>;

  const IcHall2 = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/></svg>;
  const IcRows2 = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16"/></svg>;

  const dropIcon = status==="parsing" ? <IcSpinner/> : status==="done" ? <IcCheckCircle/> : status==="error" ? <IcXCircle/> : <IcCloudUp/>;
  const dropColor = dragOver ? "border-blue-500 bg-blue-50 shadow-blue-100" : status==="parsing" ? "border-blue-400 bg-blue-50" : status==="done" ? "border-emerald-400 bg-emerald-50" : status==="error" ? "border-red-400 bg-red-50" : "border-gray-200 bg-gray-50 hover:border-blue-400 hover:bg-blue-50/50 hover:shadow-lg";
  const dropIconColor = status==="done" ? "text-emerald-500" : status==="error" ? "text-red-500" : status==="parsing" ? "text-blue-500" : "text-blue-400";

  // Capacity calculation
  const totalSelected = parsed ? parsed.filter(function(_,i){ return selectedGroups.has(i); }).reduce(function(a,g){ return a+g.students.length; },0) : 0;
  const totalHallCapacity = halls.filter(function(h){ return selectedHallIds.includes(h.id); }).reduce(function(a,h){
    return a + (h.capacity || Math.ceil((h.numbenches||15)/Math.max(1,(h.layoutConfig?.columns||[1]).length)) * (h.studentsperbench||3));
  }, 0);
  const capacityOk = totalHallCapacity >= totalSelected;

  // Preview students for layout visualiser
  const previewStudents = parsed && parsed.length > 0
    ? parsed[0].students.slice(0,60).map(function(s){ return {regno:s.regno, name:s.name, dept:parsed[0].dept}; })
    : [];

  const previewHall = halls.find(function(h){ return selectedHallIds.includes(h.id); }) || (halls.length ? halls[0] : null);

  return (
    <div className="p-6 max-w-6xl">
      {/* Header */}
      <div className="mb-6 flex items-center gap-4">
        <div className="w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg flex-shrink-0" style={{background:"linear-gradient(135deg,#2563eb,#7c3aed)"}}>
          <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <div>
          <h1 className="text-2xl font-black text-gray-900 leading-tight">Import Attendance PDF</h1>
          <p className="text-gray-400 text-sm mt-0.5">Anna University Attendance Sheet → auto-create students & seating plan</p>

      </div>

      <div className="grid grid-cols-1 xl:grid-cols-5 gap-6">
        {/* ── LEFT COLUMN: Upload + Config ── */}

                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex flex-wrap items-center gap-2 mb-1">
                            <span className="font-black text-gray-900 text-sm">{group.subjectCode}</span>
                            {group.subjectName && <span className="text-gray-600 text-sm truncate max-w-xs">{group.subjectName}</span>}
                            <span className={"px-2 py-0.5 rounded-full text-xs font-bold border "+deptColor(group.dept)}>{group.dept}</span>
                          </div>
                          <div className="flex flex-wrap gap-3 text-xs text-gray-500 mb-2">
                            <span className="flex items-center gap-1"><IcCal2/><b>{group.date}</b> {group.session}</span>
                            {group.branchName && <span className="flex items-center gap-1"><IcBranch2/>{group.branchName}</span>}
                            <span className="flex items-center gap-1"><IcUsers2/><b className="text-gray-800">{group.students.length}</b> students</span>
                          </div>
                          <div className="flex flex-wrap gap-1">
                            {group.students.slice(0,6).map(function(s,j){ return <span key={j} className="text-xs bg-white border border-gray-200 text-gray-600 px-2 py-0.5 rounded font-mono">{s.regno}</span>; })}
                            {group.students.length>6 && <span className="text-xs text-gray-400">+{group.students.length-6} more</span>}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Import button */}
              <div className="rounded-2xl p-5 text-white flex items-center justify-between flex-wrap gap-4" style={{background:"linear-gradient(135deg,#2563eb,#7c3aed)"}}>
                <div>
                  <div className="font-black text-lg">{selectedGroups.size} group(s) · {totalSelected} students</div>
                  <div className="text-blue-200 text-sm">{totalHallCapacity} seats available across {selectedHallIds.length} hall(s)</div>
                </div>
                <button onClick={importAndGenerateSeating} disabled={saving||!selectedGroups.size||!selectedHallIds.length}
                  className="flex items-center gap-2 px-7 py-3 bg-white text-blue-700 font-black rounded-xl text-sm hover:bg-blue-50 disabled:opacity-50 transition-all shadow-xl">
                  {saving
                    ? <><svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>Importing...</>
                    : <><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Import & Generate Seating</>
                  }
                </button>
              </div>
            </>
          )}
        </div>

        {/* ── RIGHT COLUMN: Live Hall Layout Preview ── */}
        <div className="xl:col-span-2 space-y-4">
          <div className="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm sticky top-4">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600"><IcSeat2/></div>
                <h3 className="font-black text-gray-800 text-sm uppercase tracking-wider">Hall Layout Preview</h3>
              </div>
              <button onClick={function(){ setShowLayoutPreview(function(v){ return !v; }); }}
                className="text-xs text-blue-500 font-semibold hover:text-blue-700 bg-blue-50 px-2 py-1 rounded-lg">
                {showLayoutPreview ? "Simple" : "Detailed"}
              </button>
            </div>

            {/* Layout info card */}
            <div className="bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-100 rounded-xl p-3 mb-4">
              <div className="flex items-center gap-3">
                <div className="bg-white rounded-lg p-2 shadow-sm">
                  <BenchLayoutPreview layout={layoutConfig || defaultLayout()} small={false}/>
                </div>
                <div>
                  <div className="font-black text-gray-800 text-sm">
                    {(layoutConfig||defaultLayout()).columns.length} column group{(layoutConfig||defaultLayout()).columns.length!==1?'s':''}
                  </div>
                  <div className="text-gray-500 text-xs mt-0.5">{spr} seats across the hall width</div>
                  <div className="text-blue-600 font-bold text-xs mt-1">{spr} students per bench row</div>
                </div>
              </div>
            </div>

            {/* Hall stats */}
            {previewHall && (
              <div className="grid grid-cols-2 gap-2 mb-4">
                {[
                  {label:"Hall",     val:previewHall.name,         color:"text-purple-600"},
                  {label:"Benches",  val:previewHall.numbenches,   color:"text-blue-600"},
                  {label:"Seats/bench", val:spr,                   color:"text-amber-600"},
                  {label:"Capacity", val:previewHall.numbenches*spr, color:"text-emerald-600"},
                ].map(function(s){ return (
                  <div key={s.label} className="bg-gray-50 rounded-xl p-2.5 text-center">
                    <div className={"font-black text-lg "+s.color}>{s.val}</div>
                    <div className="text-gray-400 text-xs">{s.label}</div>
                  </div>
                ); })}
              </div>
            )}

            {/* Visual layout */}
            {showLayoutPreview && previewHall && (
              <HallLayoutVisualiser
                hall={previewHall}
                students={previewStudents}
                layout={layoutConfig || defaultLayout()}
                title={"Preview: "+previewHall.name}
              />
            )}
            {!showLayoutPreview && previewHall && (
              <div className="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Bench arrangement</div>
                <div className="w-full py-1.5 rounded bg-gray-700 text-white text-xs text-center font-bold mb-3 tracking-widest">BOARD / FRONT</div>
                <div className="flex flex-col gap-1">
                  {Array(Math.min(previewHall.numbenches,10)).fill(null).map(function(_,bi){ return (
                    <div key={bi} className="flex items-center gap-1.5">
                      <span className="text-gray-400" style={{fontSize:9,width:16,textAlign:"right"}}>R{bi+1}</span>
                      <div className="flex items-center gap-0.5 bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5">
                        {(layoutConfig||defaultLayout()).columns.map(function(col,gi){
                          return (
                            <React.Fragment key={gi}>
                              <div className="flex gap-0.5">
                                {Array(col.seats||1).fill(null).map(function(_,si){
                                  return <div key={si} className="w-4 h-3 bg-blue-400 rounded-sm"/>;
                                })}
                              </div>
                              {gi < (layoutConfig||defaultLayout()).columns.length-1 && (layoutConfig||defaultLayout()).aisleAfter[gi] && <div className="w-1.5 self-stretch bg-slate-200 rounded-sm mx-0.5"/>}
                            </React.Fragment>
                          );
                        })}
                      </div>
                    </div>
                  ); })}
                  {previewHall.numbenches>10 && <div className="text-center text-xs text-gray-400">+{previewHall.numbenches-10} more rows</div>}
                </div>
              </div>
            )}

            {!halls.length && (
              <div className="text-center py-8 text-gray-400 text-sm">
                <IcHall2/>
                <p className="mt-2">Add halls in <b>Exam Halls</b> to preview layout</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function fixHallCapacities(halls) {
  return (halls||[]).map(function(hall){
    const ly    = hall.layoutConfig || hall["layoutConfig"] || defaultLayout();
    const spr   = seatsPerRowFromLayout(ly);
    const nCols = (ly.columns||[{seats:1}]).length;
    const nRows = Math.ceil((hall.numbenches||15) / Math.max(1, nCols));
    const correctCap = nRows * spr;
    if (hall.capacity && hall.capacity > correctCap * 2) return {...hall, capacity:correctCap, studentsperbench:spr};
    if (!hall.capacity) return {...hall, capacity:correctCap, studentsperbench:spr};
    return hall;
  });
}

function App() {
  const [screen,setScreen]         = useState("login");
  const [user,setUser]             = useState(null);
  const [students,setStudents]     = useState([]);
  const [halls,setHalls]           = useState([]);
  const [exams,setExams]           = useState([]);
  const [seatingPlans,setSeatingPlans] = useState({});
  const [dataLoading,setDataLoading]   = useState(false);
  const [dataError,setDataError]       = useState("");
  const [dbOk,setDbOk]             = useState(false);  // DB reachable?
  const [orphanCount,setOrphanCount]   = useState(0);  // records with college_id='default'
  const [fixing,setFixing]         = useState(false);

  // ── Step 1: Check DB is reachable (before login) ────────────────
  useEffect(()=>{
    const timeout = setTimeout(()=>{
      setDataError("Connection timeout. Check internet and Supabase.");
      setDbOk(false);
    }, 12000);
    sb("colleges","GET",null,"?select=id&limit=1")
      .then(()=>{ clearTimeout(timeout); setDbOk(true); if(window.__hideSplash) window.__hideSplash(); })
      .catch(e=>{ clearTimeout(timeout); setDataError(e.message); if(window.__hideSplash) window.__hideSplash(); });
    return ()=>clearTimeout(timeout);
  },[]);

  // ── Step 2: Load college-scoped data AFTER login ─────────────────
  async function loadCollegeData() {
    setDataLoading(true);
    setDataError("");
    try {
      const [s,h,e] = await Promise.all([
        Store.getStudents().catch(()=>[]),
        Store.getHalls().catch(()=>[]),
        Store.getExams().catch(()=>[]),
      ]);
      setStudents(s||[]);
      setHalls(fixHallCapacities(h));
      setExams(e||[]);

      // Detect orphaned 'default' records (old data before college isolation)
      const collegeId = Store.getCollegeId();
      if (collegeId !== 'default') {
        try {
          const orphanStudents = await sb("students","GET",null,"?college_id=eq.default&select=id&limit=1");
          const orphanHalls    = await sb("halls","GET",null,"?college_id=eq.default&select=id&limit=1");
          const orphanExams    = await sb("exams","GET",null,"?college_id=eq.default&select=id&limit=1");
          const total = (orphanStudents?.length||0) + (orphanHalls?.length||0) + (orphanExams?.length||0);
          setOrphanCount(total);
        } catch(e) { /* ignore orphan check error */ }
      }

      // Load seating plans in background
      const plans = {};
      for (const exam of (e||[]).filter(x=>x.seatinggenerated)) {
        try { const p = await Store.getSeatingPlan(exam.id); if(p) plans[exam.id]=p; } catch(e2){}
      }
      setSeatingPlans(plans);
    } catch(err){ setDataError(err.message); }
    finally { setDataLoading(false); }
  }

  // ── Step 3: One-click fix to claim orphaned data ─────────────────
  async function claimOrphanData() {
    setFixing(true);
    const cid = Store.getCollegeId();
    try {
      await sb("students","PATCH",{college_id:cid},"?college_id=eq.default");
      await sb("halls",   "PATCH",{college_id:cid},"?college_id=eq.default");
      await sb("exams",   "PATCH",{college_id:cid},"?college_id=eq.default");
      setOrphanCount(0);
      await loadCollegeData();
      alert("✅ Data claimed successfully! All unassigned records are now linked to your college.");
    } catch(e){ alert("Error claiming data: "+e.message); }
    finally { setFixing(false); }
  }

  function handleLogin(u) {
    setUser(u);
    if (u && u.college) {
      // Set college BEFORE loading data so college_id filter is correct
      ACTIVE_COLLEGE = Object.assign({}, u.college);
      try { localStorage.setItem("examSeatCollegeSettings", JSON.stringify(ACTIVE_COLLEGE)); } catch(e){}
    }
    if (u && (u.role==="admin" || u.role==="developer")) {
      loadCollegeData();
    }
  }

  function handleLogout() {
    setUser(null);
    setStudents([]); setHalls([]); setExams([]); setSeatingPlans({});
    setOrphanCount(0); setDataError("");
  }

  if (!dbOk && !dataError) return <LoadingScreen message="Connecting to database..."/>;

  if (dataError && !dbOk) return (
    <div className="min-h-screen flex items-center justify-center" style={{background:"linear-gradient(135deg,#0f172a,#1e3a8a)"}}>
      <div className="bg-white rounded-2xl p-8 max-w-md text-center shadow-2xl">
        <div className="text-5xl mb-4">🔴</div>
        <h2 className="text-xl font-black text-gray-900 mb-2">Database Connection Error</h2>
        <p className="text-red-500 text-sm mb-2 font-mono break-all">{dataError}</p>
        <p className="text-gray-400 text-xs mb-4">Run the SQL migration script in Supabase SQL Editor.</p>
        <button onClick={()=>window.location.reload()} className="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm hover:bg-blue-700">Retry</button>
      </div>
    </div>
  );

  if (screen==="register") return <RegisterScreen onBack={()=>setScreen("login")} onRegistered={s=>{setStudents(prev=>[...prev,s]);setScreen("login");}}/>;
  if (!user) return <LoginScreen onLogin={handleLogin} onRegister={()=>setScreen("register")}/>;

  // ── Orphan data warning banner ────────────────────────────────────
  const OrphanBanner = orphanCount > 0 ? (
    <div style={{
      position:"fixed", top:0, left:0, right:0, zIndex:999,
      background:"linear-gradient(135deg,#f59e0b,#d97706)",
      color:"#fff", padding:"10px 16px",
      display:"flex", alignItems:"center", gap:12, flexWrap:"wrap",
    }}>
      <span style={{fontSize:18}}>⚠️</span>
      <div style={{flex:1, fontSize:12, fontWeight:700}}>
        <b>Unassigned data found!</b> There are records in the database not linked to any college (created before multi-college support).
        Click "Claim for This College" to assign them to <b>{ACTIVE_COLLEGE.name||"your college"}</b>.
        <span style={{opacity:.7}}> Only do this if these records belong to your college.</span>
      </div>
      <button
        onClick={claimOrphanData} disabled={fixing}
        style={{
          background:"#fff", color:"#d97706", fontWeight:800, fontSize:11,
          border:"none", borderRadius:8, padding:"6px 14px", cursor:"pointer",
          opacity:fixing?0.7:1,
        }}>
        {fixing ? "Claiming…" : "✅ Claim for This College"}
      </button>
      <button onClick={()=>setOrphanCount(0)} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:18,opacity:.7}}>✕</button>
    </div>
  ) : null;

  // Data still loading after login
  if (dataLoading) return (
    <div>
      {OrphanBanner}
      <LoadingScreen message={"Loading "+( ACTIVE_COLLEGE.name||"college")+" data…"}/>
    </div>
  );

  if (user.role==="developer") return <div>{OrphanBanner}<DevDashboard onLogout={handleLogout} students={students} setStudents={setStudents} exams={exams} setExams={setExams} halls={halls} setHalls={setHalls} seatingPlans={seatingPlans} setSeatingPlans={setSeatingPlans}/></div>;
  if (user.role==="admin")     return <div>{OrphanBanner}<AdminDashboard user={user} onLogout={handleLogout} students={students} setStudents={setStudents} halls={halls} setHalls={setHalls} exams={exams} setExams={setExams} seatingPlans={seatingPlans} setSeatingPlans={setSeatingPlans}/></div>;
  return <StudentDashboard user={user} onLogout={handleLogout} exams={exams} seatingPlans={seatingPlans}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
