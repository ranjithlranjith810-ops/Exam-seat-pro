            <button onClick={addGroup} className="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100">+ Add Group</button>
          </div>
          <div className="space-y-2 max-h-48 overflow-y-auto">
            {form.groups.map((g,i)=>(
              <div key={i} className="flex gap-2 items-center p-3 bg-gray-50 rounded-xl">
                <select value={g.dept} onChange={e=>setGroup(i,"dept",e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-bold bg-white focus:outline-none">
                  {DEPTS.map(d=><option key={d}>{d}</option>)}
                </select>
                <select value={g.year} onChange={e=>setGroup(i,"year",e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-bold bg-white focus:outline-none">
                  {["1","2","3","4"].map(y=><option key={y} value={y}>Y{y}</option>)}
                </select>
                <input value={g.subjectName} onChange={e=>setGroup(i,"subjectName",e.target.value)} placeholder="e.g. CS3492 (subject code)" className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-xs bg-white focus:outline-none"/>
                <div className="flex flex-col items-center">
                  <span className="text-gray-400 font-bold uppercase tracking-wider mb-0.5" style={{fontSize:8}}>Fallback Count</span>
                  <input type="number" min="1" max="500" value={g.count||30} onChange={e=>setGroup(i,"count",e.target.value)}
                    title="Fallback student count — only used when no matching student records exist in the database. If students are already imported, this number is ignored."
                    className="w-16 border-2 border-amber-200 bg-amber-50 rounded-lg px-2 py-1.5 text-xs text-center font-black text-amber-700 focus:outline-none focus:border-amber-400"/>
                </div>
                {form.groups.length>1&&<button onClick={()=>removeGroup(i)} className="text-red-400 hover:text-red-600 font-bold text-xs px-1">✕</button>}
              </div>
            ))}
          </div>
          <div className="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-xl">
            <div className="flex items-start gap-2">
              <svg className="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <div className="text-xs text-amber-700">
                <b>What is "Fallback Count"?</b> — If you have already imported students for this dept/year, the system uses those real records and <b>ignores this number</b>. The count (default 30) is only used as a placeholder when <b>no student records exist yet</b> in the database — it creates dummy seat labels so you can still generate a layout.
              </div>
            </div>
          </div>
        </div>

        <div className="flex gap-3">
          <Btn variant="ghost" onClick={()=>setShowAdd(false)} className="flex-1">Cancel</Btn>
          <Btn onClick={saveExam} disabled={saving} className="flex-1">{saving?"Saving...":editExam?"Save Changes":"Create Exam"}</Btn>
        </div>
      </Modal>}
    </div>
  );
}

// ── SEATING PAGE ──────────────────────────────────────────────────────────────
function SeatingPage({ exams, seatingPlans, college }) {
  const [selExam,setSelExam]=useState(null);
  const [selHall,setSelHall]=useState(null);
  const [search,setSearch]=useState("");
  const [result,setResult]=useState(null);
  const seatedExams=exams.filter(e=>e.seatinggenerated);
  const plan=selExam?seatingPlans[selExam]:null;
  const exam=exams.find(e=>e.id===selExam);
  const col = college || ACTIVE_COLLEGE;

  function doSearch() {
    if (!plan) return;
    let found=null;
    Object.values(plan).forEach(hp=>{const seat=(hp.seats||[]).find(s=>s.regno.toUpperCase()===search.toUpperCase());if(seat) found={...seat,hallName:hp.hallName};});
    setResult(found||"notfound");
  }

  return (
    <div className="p-8">
      <div className="mb-6"><h1 className="text-3xl font-black text-gray-900">Seating Plans</h1></div>
      <div className="flex gap-2 flex-wrap mb-5">
        {seatedExams.map(e=><button key={e.id} onClick={()=>{setSelExam(e.id);setSelHall(null);setResult(null);setSearch("");}}
          className={`px-4 py-2.5 rounded-xl text-sm font-bold transition-all ${selExam===e.id?"bg-blue-600 text-white":"bg-white border border-gray-200 text-gray-600 hover:border-blue-300"}`}>
          {e.subject} <span className="opacity-60 font-normal text-xs">  {e.date}   {e.session}</span>
        </button>)}
        {!seatedExams.length&&<div className="text-sm text-gray-400 p-4 bg-gray-50 rounded-xl">No seating plans yet. Generate from Exams page.</div>}
      </div>
      {exam&&plan&&<>
        <div className="flex flex-wrap gap-3 mb-5">
          <div className="flex gap-2">
            <input value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="🔍 Search by register number..." className="px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-400 w-48"/>
            <Btn onClick={doSearch}><Ic.Search/></Btn>
          </div>
          <Btn variant="success" onClick={()=>exportSeatingPDF(exam,plan,col)}><Ic.Down/>Export PDF</Btn>
          <Btn variant="purple" onClick={()=>generateHallNotice(exam,plan,col)}><Ic.Print/>Hall Notice</Btn>
          <Btn variant="dark" onClick={()=>window.print()}><Ic.Print/>Print</Btn>
        </div>
        {result&&<div className={`mb-5 p-4 rounded-xl text-sm font-medium ${result==="notfound"?"bg-red-50 border border-red-200 text-red-600":"bg-green-50 border border-green-200 text-green-800"}`}>
          {result==="notfound"?"Student not found":`${result.name} (${result.regno}) \u2192 ${result.hall} - Bench ${result.bench} / Slot ${result.slot} / ${result.seatNo}`}
        </div>}
        <div className="flex gap-2 flex-wrap mb-5">
          <button onClick={()=>setSelHall(null)} className={`px-4 py-2 rounded-xl text-sm font-bold ${!selHall?"bg-blue-600 text-white":"bg-white border border-gray-200 text-gray-600"}`}>
            All ({Object.values(plan).reduce((a,h)=>a+(h.seats?.length||0),0)})
          </button>
          {Object.entries(plan).map(([hid,hp])=><button key={hid} onClick={()=>setSelHall(hid)} className={`px-4 py-2 rounded-xl text-sm font-bold ${selHall===hid?"bg-blue-600 text-white":"bg-white border border-gray-200 text-gray-600"}`}>{hp.hallName} ({hp.seats?.length||0})</button>)}
        </div>
        {selHall?<BenchLayout hall={plan[selHall]} highlightRegNo={result&&result!=="notfound"?result.regno:null}/>
          :<div className="grid grid-cols-1 lg:grid-cols-2 gap-5">{Object.values(plan).map(hp=><BenchLayout key={hp.hallName} hall={hp} highlightRegNo={result&&result!=="notfound"?result.regno:null}/>)}</div>}
      </>}
    </div>
  );
}


// ── STUDENT LIFECYCLE MANAGEMENT PAGE ────────────────────────────────────────
// Handles the full academic lifecycle:
//   1. PROMOTE   — Year +1 for all / filtered students (semester start)
//   2. GRADUATE  — Remove Year 4 students (passouts) with archive option
//   3. ADMIT     — Add new Year 1 batch (via CSV or bulk)
//   4. TRANSFER  — Move students between depts/years
//   5. ARCHIVE   — Download passout list before deletion
function BulkYearPage({ students, setStudents, showToast }) {
  const [tab, setTab]             = useState("promote");
  const [filterDept, setFilterDept] = useState("all");
  const [filterYear, setFilterYear] = useState("all");
  const [targetYear, setTargetYear] = useState("2");
  const [preview, setPreview]     = useState(null);
  const [saving, setSaving]       = useState(false);
  const [gradPreview, setGradPreview] = useState(null);
  const [archiveDone, setArchiveDone] = useState(false);

  const allDepts = [...new Set(students.map(s => s.dept))].sort();
  const year4    = students.filter(s => s.year >= 4);
  const year1    = students.filter(s => s.year === 1);

  // ── PROMOTE ──────────────────────────────────────────────────────
  function buildPromotePreview() {
    let targets = students;
    if (filterDept !== "all") targets = targets.filter(s => s.dept === filterDept);
    if (filterYear !== "all") targets = targets.filter(s => String(s.year) === filterYear);
    if (tab === "promote") targets = targets.filter(s => s.year < 4);
    else targets = targets.filter(s => true);
    setPreview(targets.map(s => ({
      ...s,
      newYear: tab === "promote" ? s.year + 1 : parseInt(targetYear)
    })));
  }

  async function applyPromote() {
    if (!preview?.length) return;
    setSaving(true);
    try {
      // Single bulk call — groups by year, one PATCH per year value
      const updates = preview.map(s => ({ id: s.id, year: s.newYear }));
      await Store.bulkUpdateYear(updates);
      // Update local state instantly
      const updateMap = {};
      preview.forEach(s => { updateMap[s.id] = s.newYear; });
      setStudents(prev => prev.map(s => updateMap[s.id] ? { ...s, year: updateMap[s.id] } : s));
      setPreview(null);
      showToast(`✅ ${preview.length} students promoted!`, "success");
      addAuditEntry("Bulk Year Update", preview.length + " students promoted");
    } catch(e) { showToast("Error: " + e.message, "error"); }
    finally { setSaving(false); }
  }

  // ── GRADUATE (passout) ────────────────────────────────────────────
  function archivePassouts() {
    const csv = ["regno,name,dept,year,gender",
      ...year4.map(s => `${s.regno},"${s.name}",${s.dept},${s.year},${s.gender}`)
    ].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
    a.download = "passout_students_" + new Date().toISOString().slice(0,10) + ".csv";
    a.click();
    setArchiveDone(true);
    showToast("Passout list downloaded!", "success");
  }

  async function removePassouts() {
    if (!archiveDone && !window.confirm("⚠ You have NOT downloaded the passout archive yet!\n\nAre you sure you want to delete " + year4.length + " Year 4 students without backing up?")) return;
    if (!window.confirm("FINAL CONFIRM: Delete " + year4.length + " Year 4 passout students permanently?")) return;
    setSaving(true);
    try {
      // Single bulk delete — one API call
      await Store.bulkDeleteStudents(year4.map(s => s.id));
      setStudents(prev => prev.filter(s => s.year < 4));
      setGradPreview(null);
      setArchiveDone(false);
      showToast(`✅ ${year4.length} passout students removed`, "success");
      addAuditEntry("Passout Removal", year4.length + " Year 4 students removed");
    } catch(e) { showToast("Error: " + e.message, "error"); }
    finally { setSaving(false); }
  }

  // ── STATS ─────────────────────────────────────────────────────────
  const yearCounts = {1:0,2:0,3:0,4:0};
  students.forEach(s => { if(yearCounts[s.year]!==undefined) yearCounts[s.year]++; });
  const deptCounts = {};
  students.forEach(s => { deptCounts[s.dept] = (deptCounts[s.dept]||0)+1; });

  const TABS = [
    {id:"promote",  icon:"⬆️",  label:"Promote Year",   color:"blue"},
    {id:"graduate", icon:"🎓",  label:"Passout/Graduate",color:"green"},
    {id:"transfer", icon:"🔄",  label:"Transfer/Move",   color:"orange"},
    {id:"stats",    icon:"📊",  label:"Year-wise Stats", color:"purple"},
  ];
  const tabColor = {blue:"border-blue-500 bg-blue-50 text-blue-700",
                    green:"border-green-500 bg-green-50 text-green-700",
                    orange:"border-orange-500 bg-orange-50 text-orange-700",
                    purple:"border-purple-500 bg-purple-50 text-purple-700"};

  return (
    <div className="p-6 max-w-4xl">
      {/* Header */}
      <div className="mb-6">
        <h1 className="text-3xl font-black text-gray-900">Student Lifecycle</h1>
        <p className="text-gray-400 text-sm mt-1">Manage promotions, passouts, new admissions and transfers</p>
      </div>

      {/* Quick stats bar */}
      <div className="grid grid-cols-4 gap-3 mb-6">
        {[1,2,3,4].map(y => (
          <div key={y} className={`rounded-2xl p-4 text-center ${y===4?"bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-md":"bg-white border border-gray-100 shadow-sm"}`}>
            <div className={`text-3xl font-black ${y===4?"text-white":"text-gray-900"}`}>{yearCounts[y]}</div>
            <div className={`text-xs font-bold mt-1 ${y===4?"text-red-100":"text-gray-400"}`}>
              {y===1?"1st Year":y===2?"2nd Year":y===3?"3rd Year":"Final Year 🎓"}
            </div>
            {y===4&&yearCounts[4]>0&&<div className="text-xs text-red-200 mt-0.5">ready to passout</div>}
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div className="flex gap-2 mb-5 flex-wrap">
        {TABS.map(t => (
          <button key={t.id} onClick={()=>{setTab(t.id);setPreview(null);}}
            className={`flex items-center gap-2 px-4 py-2.5 rounded-xl border-2 text-sm font-bold transition-all ${
              tab===t.id ? tabColor[t.color] : "border-gray-200 text-gray-500 hover:border-gray-300"
            }`}>
            <span>{t.icon}</span> {t.label}
          </button>
        ))}
      </div>

      {/* ── PROMOTE TAB ── */}
      {tab==="promote" && (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 className="font-black text-gray-900 mb-1">Promote Students (Year +1)</h2>
            <p className="text-xs text-gray-400 mb-4">Use at the start of each new academic year. Year 1→2, 2→3, 3→4. Year 4 students are NOT promoted (they are passouts).</p>

            <div className="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Department</label>
                <select value={filterDept} onChange={e=>{setFilterDept(e.target.value);setPreview(null);}}
                  className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-blue-400 bg-white">
                  <option value="all">All Departments</option>
                  {allDepts.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Current Year</label>
                <select value={filterYear} onChange={e=>{setFilterYear(e.target.value);setPreview(null);}}
                  className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-blue-400 bg-white">
                  <option value="all">All Years (except Year 4)</option>
                  <option value="1">Year 1 → Year 2</option>
                  <option value="2">Year 2 → Year 3</option>
                  <option value="3">Year 3 → Year 4</option>
                </select>
              </div>
            </div>

            <div className="flex gap-3">
              <button onClick={buildPromotePreview}
                className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm shadow-md hover:shadow-lg transition-all">
                👁 Preview Changes
              </button>
            </div>
          </div>

          {preview && (
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-blue-200">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-black text-gray-900">{preview.length} students will be promoted</h3>
                <button onClick={()=>setPreview(null)} className="text-gray-400 hover:text-gray-600 text-sm">✕ Cancel</button>
              </div>
              <div className="flex flex-wrap gap-2 mb-4">
                {Object.entries(preview.reduce((acc,s)=>{const k=s.dept+" Y"+s.year+"→Y"+s.newYear;acc[k]=(acc[k]||0)+1;return acc;},{})).map(([k,v])=>(
                  <span key={k} className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold">{k}: {v}</span>
                ))}
              </div>
              <div className="max-h-48 overflow-y-auto rounded-xl border border-gray-100 mb-4">
                <table className="w-full text-xs">
                  <thead><tr className="bg-gray-50"><th className="text-left p-2 font-bold">Name</th><th className="text-left p-2 font-bold">Reg No</th><th className="text-center p-2 font-bold">Dept</th><th className="text-center p-2 font-bold">Year</th><th className="text-center p-2 font-bold text-green-600">New Year</th></tr></thead>
                  <tbody>{preview.slice(0,50).map(s=>(
                    <tr key={s.id} className="border-t border-gray-50 hover:bg-gray-50">
                      <td className="p-2 font-medium">{s.name}</td>
                      <td className="p-2 font-mono text-gray-500">{s.regno}</td>
                      <td className="p-2 text-center"><span className={`px-1.5 py-0.5 rounded text-xs font-bold ${deptColor(s.dept)}`}>{s.dept}</span></td>
                      <td className="p-2 text-center text-gray-500">{s.year}</td>
                      <td className="p-2 text-center text-green-600 font-black">{s.newYear}</td>
                    </tr>
                  ))}{preview.length>50&&<tr><td colSpan={5} className="p-2 text-center text-gray-400 text-xs">...and {preview.length-50} more</td></tr>}</tbody>
                </table>
              </div>
              <button onClick={applyPromote} disabled={saving}
                className="w-full py-3 rounded-xl bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold text-sm shadow-md disabled:opacity-50 flex items-center justify-center gap-2">
                {saving ? <><Ic.Spin/>Updating…</> : <>✅ Apply Promotion for {preview.length} Students</>}
              </button>
            </div>
          )}
        </div>
      )}

      {/* ── GRADUATE/PASSOUT TAB ── */}
      {tab==="graduate" && (
        <div className="space-y-4">
          <div className={`rounded-2xl p-5 shadow-sm border-2 ${year4.length>0?"border-red-200 bg-red-50":"border-gray-100 bg-white"}`}>
            <div className="flex items-center gap-3 mb-3">
              <span className="text-3xl">🎓</span>
              <div>
                <h2 className="font-black text-gray-900">Year 4 Passout Students</h2>
                <p className="text-sm text-gray-500">{year4.length} students ready to graduate</p>
              </div>
            </div>

            {year4.length === 0 ? (
              <div className="text-center py-8 text-gray-400">
                <div className="text-4xl mb-2">✅</div>
                <p className="font-medium">No Year 4 students found</p>
                <p className="text-xs mt-1">All passouts have already been processed</p>
              </div>
            ) : (
              <>
                {/* Dept breakdown of passouts */}
                <div className="flex flex-wrap gap-2 mb-4">
                  {Object.entries(year4.reduce((acc,s)=>{acc[s.dept]=(acc[s.dept]||0)+1;return acc;},{})).map(([d,n])=>(
                    <span key={d} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${deptColor(d)}`}>{d}: {n}</span>
                  ))}
                </div>

                {/* Step 1: Download archive */}
                <div className={`p-4 rounded-xl mb-3 border-2 ${archiveDone?"border-green-300 bg-green-50":"border-amber-300 bg-amber-50"}`}>
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">{archiveDone?"✅":"📦"}</span>
                    <div className="flex-1">
                      <div className="font-bold text-sm text-gray-800">Step 1: Download Passout Archive</div>
                      <div className="text-xs text-gray-500 mt-0.5">Save a CSV backup of all {year4.length} Year 4 students before removing them</div>
                    </div>
                    <button onClick={archivePassouts}
                      className={`px-4 py-2 rounded-xl text-white text-xs font-bold ${archiveDone?"bg-green-600":"bg-amber-600 hover:bg-amber-700"}`}>
                      {archiveDone?"Downloaded ✓":"⬇ Download CSV"}
                    </button>
                  </div>
                </div>

                {/* Step 2: Remove from DB */}
                <div className="p-4 rounded-xl border-2 border-red-200 bg-white">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🗑️</span>
                    <div className="flex-1">
                      <div className="font-bold text-sm text-gray-800">Step 2: Remove Passout Students</div>
                      <div className="text-xs text-gray-500 mt-0.5">Permanently delete {year4.length} Year 4 students from the database</div>
                    </div>
                    <button onClick={removePassouts} disabled={saving}
                      className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold disabled:opacity-50">
                      {saving?"Removing…":"Remove All"}
                    </button>
                  </div>
                </div>

                {/* Preview table */}
                <div className="max-h-48 overflow-y-auto rounded-xl border border-red-100 mt-3">
                  <table className="w-full text-xs">
                    <thead><tr className="bg-red-50"><th className="text-left p-2 font-bold">Name</th><th className="text-left p-2 font-bold">Reg No</th><th className="text-center p-2 font-bold">Dept</th></tr></thead>
                    <tbody>{year4.map(s=>(
                      <tr key={s.id} className="border-t border-red-50">
                        <td className="p-2 font-medium">{s.name}</td>
                        <td className="p-2 font-mono text-gray-500">{s.regno}</td>
                        <td className="p-2 text-center"><span className={`px-1.5 py-0.5 rounded text-xs font-bold ${deptColor(s.dept)}`}>{s.dept}</span></td>

                  <option value="all">All Departments</option>
                  {allDepts.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Filter Current Year</label>
                <select value={filterYear} onChange={e=>{setFilterYear(e.target.value);setPreview(null);}}
                  className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-blue-400 bg-white">
                  <option value="all">Any Year</option>
                  {["1","2","3","4"].map(y=><option key={y} value={y}>Year {y}</option>)}
                </select>
              </div>
            </div>

            <div className="mb-4">
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Set Year To</label>
              <div className="flex gap-3">
                {["1","2","3","4"].map(y=>(
                  <button key={y} onClick={()=>{setTargetYear(y);setPreview(null);}}
                    className={`flex-1 py-3 rounded-xl border-2 font-black text-lg transition-all ${targetYear===y?"border-orange-500 bg-orange-50 text-orange-700":"border-gray-200 text-gray-500"}`}>
                    {y}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex gap-3">
              <button onClick={()=>{
                  let targets = students;
                  if (filterDept !== "all") targets = targets.filter(s => s.dept === filterDept);
                  if (filterYear !== "all") targets = targets.filter(s => String(s.year) === filterYear);
                  setPreview(targets.map(s => ({...s, newYear: parseInt(targetYear)})));
                }}
                className="flex-1 py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm shadow-md">
                👁 Preview Transfer
              </button>
            </div>
          </div>

          {preview && (
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-orange-200">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-black text-gray-900">{preview.length} students → Year {targetYear}</h3>
                <button onClick={()=>setPreview(null)} className="text-gray-400 hover:text-gray-600 text-sm">✕</button>

              <div className="max-h-40 overflow-y-auto rounded-xl border border-gray-100 mb-4">
                <table className="w-full text-xs">
                  <thead><tr className="bg-gray-50"><th className="text-left p-2 font-bold">Name</th><th className="text-left p-2 font-bold">Reg No</th><th className="text-center p-2 font-bold">Dept</th><th className="text-center p-2 font-bold">Now</th><th className="text-center p-2 font-bold text-orange-600">→ Year</th></tr></thead>
                  <tbody>{preview.slice(0,50).map(s=>(
                    <tr key={s.id} className="border-t border-gray-50">
                      <td className="p-2 font-medium">{s.name}</td>
                      <td className="p-2 font-mono text-gray-500">{s.regno}</td>
                      <td className="p-2 text-center"><span className={`px-1.5 py-0.5 rounded text-xs font-bold ${deptColor(s.dept)}`}>{s.dept}</span></td>
                      <td className="p-2 text-center text-gray-500">{s.year}</td>
                      <td className="p-2 text-center text-orange-600 font-black">{s.newYear}</td>

                className="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm shadow-md disabled:opacity-50">

              </button>

          )}
        </div>
      )}

      {/* ── STATS TAB ── */}
      {tab==="stats" && (
        <div className="space-y-4">
          {/* Year-wise dept breakdown */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 className="font-black text-gray-900 mb-4">Year-wise Breakdown</h2>

                    {Object.entries(ydepts).sort((a,b)=>b[1]-a[1]).map(([d,n])=>(

                        {d}: {n}

          {/* Academic year workflow */}
          <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-2xl p-5 border border-indigo-200">
            <h3 className="font-black text-indigo-900 mb-3">📅 Academic Year Workflow</h3>
            <div className="space-y-2">
              {[
                {step:1, action:"Download passout archive (Year 4 CSV)", icon:"📦", color:"text-red-600"},
                {step:2, action:"Remove Year 4 passout students", icon:"🗑️", color:"text-red-600"},
                {step:3, action:"Promote all students (Year 1→2, 2→3, 3→4)", icon:"⬆️", color:"text-blue-600"},
                {step:4, action:"Upload new Year 1 batch CSV", icon:"📤", color:"text-green-600"},

                  <span className="text-lg">{s.icon}</span>
                  <span className={`text-sm font-medium ${s.color}`}>{s.action}</span>

              ))}

          </div>
        </div>

  );
}


// ── STUDENT DETAILS PAGE ─────────────────────────────────────────────────────
// Comprehensive student analytics, search, export and individual view
function StudentDetailsPage({ students, exams, seatingPlans, halls }) {
  const [search, setSearch]     = useState("");
  const [dept,   setDept]       = useState("all");
  const [year,   setYear]       = useState("all");
  const [gender, setGender]     = useState("all");
  const [sort,   setSort]       = useState("name");
  const [view,   setView]       = useState("table");   // table | cards | analytics
  const [selStu, setSelStu]     = useState(null);

  const allDepts = [...new Set(students.map(s=>s.dept))].sort();

  const filtered = students.filter(s =>
    (dept==="all"   || s.dept===dept) &&
    (year==="all"   || String(s.year)===year) &&
    (gender==="all" || s.gender===gender) &&
    (s.name?.toLowerCase().includes(search.toLowerCase()) ||
     s.regno?.toLowerCase().includes(search.toLowerCase()) ||
     s.dept?.toLowerCase().includes(search.toLowerCase()))
  ).sort((a,b) => {
    if (sort==="name")   return (a.name||"").localeCompare(b.name||"");
    if (sort==="regno")  return (a.regno||"").localeCompare(b.regno||"");
    if (sort==="dept")   return (a.dept||"").localeCompare(b.dept||"");
    if (sort==="year")   return (a.year||1) - (b.year||1);
    return 0;
  });

  // Analytics
  const yearCounts  = {1:0,2:0,3:0,4:0};
  students.forEach(s=>{ if(yearCounts[s.year]!==undefined) yearCounts[s.year]++; });
  const deptCounts  = {};
  students.forEach(s=>{ deptCounts[s.dept]=(deptCounts[s.dept]||0)+1; });
  const maleCount   = students.filter(s=>s.gender!=="female").length;
  const femaleCount = students.filter(s=>s.gender==="female").length;

  // Find seat for student
  function getStudentSeat(regno) {
    for (const [eid, plan] of Object.entries(seatingPlans||{})) {
      for (const hp of Object.values(plan)) {
        const seat = (hp.seats||[]).find(s=>s.regno===regno);
        if (seat) {
          const exam = exams.find(e=>e.id===eid);
          return { hallName: hp.hallName, seatNo: seat.seatNo, subject: exam?.subject, date: exam?.date };
        }
      }
    }
    return null;
  }

  // Export filtered list
  function exportCSV() {
    const csv = ["regno,name,dept,year,gender",
      ...filtered.map(s=>`${s.regno},"${s.name}",${s.dept},${s.year},${s.gender}`)
    ].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = `students_${dept}_year${year}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  return (
    <div className="p-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="text-3xl font-black text-gray-900">Student Details</h1>
          <p className="text-gray-400 text-sm mt-0.5">{students.length} total · {filtered.length} shown</p>
        </div>
        <div className="flex gap-2">
          {["table","cards","analytics"].map(v=>(
            <button key={v} onClick={()=>setView(v)}
              className={`px-4 py-2 rounded-xl text-xs font-bold border-2 transition-all capitalize ${
                view===v?"border-blue-500 bg-blue-50 text-blue-700":"border-gray-200 text-gray-500 hover:border-gray-300"}`}>
              {v==="table"?"📋 Table":v==="cards"?"🃏 Cards":"📊 Analytics"}
            </button>
          ))}
          <button onClick={exportCSV}
            className="px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-md">
            ⬇ Export CSV
          </button>
        </div>
      </div>

      {/* Filters */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-5">
        <div className="flex flex-wrap gap-3">
          <div className="relative flex-1 min-w-[180px]">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search name, reg no, dept..."
              className="w-full pl-8 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-400"/>
          </div>
          <select value={dept} onChange={e=>setDept(e.target.value)}
            className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white font-medium focus:outline-none focus:border-blue-400">
            <option value="all">All Depts</option>
            {allDepts.map(d=><option key={d}>{d}</option>)}
          </select>
          <select value={year} onChange={e=>setYear(e.target.value)}
            className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white font-medium focus:outline-none focus:border-blue-400">
            <option value="all">All Years</option>
            {["1","2","3","4"].map(y=><option key={y} value={y}>Year {y}</option>)}
          </select>
          <select value={gender} onChange={e=>setGender(e.target.value)}
            className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white font-medium focus:outline-none focus:border-blue-400">
            <option value="all">All Genders</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          <select value={sort} onChange={e=>setSort(e.target.value)}
            className="px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white font-medium focus:outline-none focus:border-blue-400">
            <option value="name">Sort: Name</option>
            <option value="regno">Sort: Reg No</option>
            <option value="dept">Sort: Dept</option>
            <option value="year">Sort: Year</option>
          </select>
        </div>
      </div>

      {/* ── ANALYTICS VIEW ── */}
      {view==="analytics" && (
        <div className="space-y-4">
          {/* Summary cards */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {[
              {label:"Total Students", val:students.length,  icon:"👥", grad:"from-blue-500 to-blue-600"},
              {label:"Male",           val:maleCount,         icon:"👨", grad:"from-indigo-500 to-indigo-600"},
              {label:"Female",         val:femaleCount,       icon:"👩", grad:"from-pink-500 to-rose-500"},
              {label:"Departments",    val:Object.keys(deptCounts).length, icon:"🏫", grad:"from-violet-500 to-purple-600"},
            ].map(s=>(
              <div key={s.label} className={`rounded-2xl p-4 text-white bg-gradient-to-br ${s.grad} shadow-md`}>
                <div className="text-3xl font-black">{s.val}</div>
                <div className="text-sm font-bold opacity-90 mt-1">{s.label}</div>
                <div className="text-2xl absolute opacity-10">{s.icon}</div>
              </div>
            ))}
          </div>

          {/* Year breakdown */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h3 className="font-black text-gray-900 mb-4">Year-wise Count</h3>
            {[1,2,3,4].map(y=>{
              const cnt = yearCounts[y]||0;
              const pct = students.length ? Math.round(cnt/students.length*100) : 0;
              return (
                <div key={y} className="mb-3">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-sm font-bold text-gray-700">Year {y}{y===4?" 🎓":""}</span>
                    <span className="text-sm font-black text-gray-900">{cnt} <span className="text-gray-400 font-normal">({pct}%)</span></span>
                  </div>
                  <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all" style={{
                      width:pct+"%",
                      background: y===1?"#3b82f6":y===2?"#8b5cf6":y===3?"#f59e0b":"#ef4444"
                    }}/>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Dept breakdown */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h3 className="font-black text-gray-900 mb-4">Department-wise Count</h3>
            <div className="space-y-2">
              {Object.entries(deptCounts).sort((a,b)=>b[1]-a[1]).map(([d,n])=>{
                const pct = students.length ? Math.round(n/students.length*100) : 0;
                return (
                  <div key={d} className="flex items-center gap-3">
                    <span className={`px-2 py-0.5 rounded text-xs font-bold w-16 text-center ${deptColor(d)}`}>{d}</span>
                    <div className="flex-1 h-4 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{width:pct+"%",background:deptHex(d)}}/>
                    </div>
                    <span className="text-sm font-black text-gray-800 w-16 text-right">{n} <span className="text-gray-400 font-normal text-xs">({pct}%)</span></span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Gender per year */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h3 className="font-black text-gray-900 mb-4">Gender Distribution by Year</h3>
            <div className="grid grid-cols-4 gap-3">
              {[1,2,3,4].map(y=>{
                const ys = students.filter(s=>s.year===y);
                const m  = ys.filter(s=>s.gender!=="female").length;
                const f  = ys.filter(s=>s.gender==="female").length;
                return (
                  <div key={y} className="text-center bg-gray-50 rounded-xl p-3">
                    <div className="text-xs font-bold text-gray-400 mb-2">Year {y}</div>
                    <div className="text-blue-600 font-black text-lg">{m}</div>
                    <div className="text-xs text-blue-400">Male</div>
                    <div className="text-pink-600 font-black text-lg mt-1">{f}</div>
                    <div className="text-xs text-pink-400">Female</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── TABLE VIEW ── */}
      {view==="table" && (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                  <th className="text-left p-3 font-bold text-xs uppercase tracking-wide">#</th>
                  <th className="text-left p-3 font-bold text-xs uppercase tracking-wide">Register No.</th>
                  <th className="text-left p-3 font-bold text-xs uppercase tracking-wide">Name</th>
                  <th className="text-center p-3 font-bold text-xs uppercase tracking-wide">Dept</th>
                  <th className="text-center p-3 font-bold text-xs uppercase tracking-wide">Year</th>
                  <th className="text-center p-3 font-bold text-xs uppercase tracking-wide">Gender</th>
                  <th className="text-center p-3 font-bold text-xs uppercase tracking-wide">Seat</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((s,i)=>{
                  const seat = getStudentSeat(s.regno);
                  return (
                    <tr key={s.id} onClick={()=>setSelStu(s)}
                      className="border-t border-gray-50 hover:bg-blue-50/50 cursor-pointer transition-colors">
                      <td className="p-3 text-gray-400 text-xs">{i+1}</td>
                      <td className="p-3 font-mono font-bold text-blue-700 text-xs">{s.regno}</td>
                      <td className="p-3 font-semibold text-gray-900">{s.name}</td>
                      <td className="p-3 text-center">
                        <span className={`px-2 py-0.5 rounded-lg text-xs font-bold border ${deptColor(s.dept)}`}>{s.dept}</span>
                      </td>
                      <td className="p-3 text-center">
                        <span className={`w-7 h-7 rounded-full inline-flex items-center justify-center text-xs font-black text-white ${
                          s.year===1?"bg-blue-500":s.year===2?"bg-violet-500":s.year===3?"bg-amber-500":"bg-red-500"}`}>
                          {s.year}
                        </span>
                      </td>
                      <td className="p-3 text-center text-xs font-medium text-gray-500">
                        {s.gender==="female"?"👩 F":"👨 M"}
                      </td>
                      <td className="p-3 text-center text-xs text-emerald-600 font-mono">
                        {seat ? seat.seatNo : <span className="text-gray-300">—</span>}
                      </td>
                    </tr>
                  );
                })}
                {!filtered.length && (
                  <tr><td colSpan={7} className="p-8 text-center text-gray-400">No students match your filters</td></tr>
                )}
              </tbody>
            </table>
          </div>
          <div className="px-4 py-2 bg-gray-50 border-t border-gray-100 text-xs text-gray-400 flex justify-between">
            <span>{filtered.length} students shown</span>
            <span>Click any row to view details</span>
          </div>
        </div>
      )}

      {/* ── CARDS VIEW ── */}
      {view==="cards" && (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(s=>{
            const seat = getStudentSeat(s.regno);
            return (
              <div key={s.id} onClick={()=>setSelStu(s)}
                className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md hover:border-blue-200 transition-all cursor-pointer">
                <div className="flex items-start gap-3 mb-3">
                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-lg font-black text-white flex-shrink-0 ${
                    s.year===1?"bg-gradient-to-br from-blue-400 to-blue-600":
                    s.year===2?"bg-gradient-to-br from-violet-400 to-violet-600":
                    s.year===3?"bg-gradient-to-br from-amber-400 to-amber-600":
                    "bg-gradient-to-br from-red-400 to-red-600"}`}>
                    {(s.name||"?")[0].toUpperCase()}

                    <div className="font-black text-gray-900 truncate">{s.name}</div>
                    <div className="font-mono text-xs text-blue-600 mt-0.5">{s.regno}</div>
                  </div>
                  <span className={`px-2 py-0.5 rounded-lg text-xs font-bold border flex-shrink-0 ${deptColor(s.dept)}`}>{s.dept}</span>
                </div>
                <div className="flex items-center gap-3 text-xs text-gray-500">
                  <span className="flex items-center gap-1">📚 Year {s.year}</span>

// ── UPLOAD PAGE ───────────────────────────────────────────────────────────────
function UploadPage({ students, setStudents, showToast }) {
  const [dragOver,  setDragOver]  = useState(false);
  const [preview,   setPreview]   = useState(null);
  const [uploading, setUploading] = useState(false);
  const [mode,      setMode]      = useState("skip");   // skip | update | replace
  const [progress,  setProgress]  = useState(null);
  const [result,    setResult]    = useState(null);
  const fileRef = useRef();

  function processFile(file) {
    if (!file) return;
    setResult(null);
    const r = new FileReader();
    r.onload = e => {
      try {
        const p = parseCSV(e.target.result);
        if (!p.length) { showToast("No data found in CSV", "error"); return; }

        // Detect in-file duplicates
        const seen = {};
        const inFileDupes = [];
        p.forEach(s => {
          if (seen[s.regno]) inFileDupes.push(s.regno);
          seen[s.regno] = true;
        });

        // Deduplicate within file (keep last occurrence)
        const deduped = Object.values(
          p.reduce((acc, s) => { acc[s.regno] = s; return acc; }, {})
        );

        setPreview({ raw: p, deduped, inFileDupes });
        if (inFileDupes.length)
          showToast(`⚠ ${inFileDupes.length} duplicate reg nos in CSV — deduplicated`, "warn");
        else
          showToast(`Parsed ${deduped.length} students`, "info");
      } catch(err) { showToast("Parse error: " + err.message, "error"); }
    };
    r.readAsText(file);
  }

  async function confirmUpload() {
    if (!preview) return;
    setUploading(true);
    setProgress({ done: 0, total: 0, phase: "Preparing…" });

    try {
      const { deduped } = preview;

      // Separate: new vs existing (by regno within this college)
      const existingMap = {};
      students.forEach(s => { existingMap[s.regno] = s; });

      const toAdd    = deduped.filter(s => !existingMap[s.regno]);
      const toUpdate = deduped.filter(s =>  existingMap[s.regno]);

      let added = 0, updated = 0, skipped = 0;

      // ── ADD new students in chunks of 20 ───────────────────────
      if (toAdd.length > 0) {
        const CHUNK = 20;
        setProgress({ done: 0, total: toAdd.length, phase: "Adding new students…" });
        for (let i = 0; i < toAdd.length; i += CHUNK) {
          const chunk = toAdd.slice(i, i + CHUNK).map(s => ({
            ...s, college_id: Store.getCollegeId()
          }));
          await sb("students", "POST", chunk);
          added += chunk.length;
          setProgress({ done: added, total: toAdd.length, phase: "Adding new students…" });
        }
        setStudents(prev => [...prev, ...toAdd]);
      }

      // ── UPDATE existing students ───────────────────────────────
      if (mode === "update" && toUpdate.length > 0) {
        setProgress({ done: 0, total: toUpdate.length, phase: "Updating existing…" });
        for (let i = 0; i < toUpdate.length; i++) {
          const s   = toUpdate[i];
          const upd = { name: s.name, dept: s.dept, year: s.year, gender: s.gender };
          await Store.updateStudent(existingMap[s.regno].id, upd);
          setStudents(prev => prev.map(x => x.regno === s.regno ? { ...x, ...upd } : x));
          updated++;
          setProgress({ done: i + 1, total: toUpdate.length, phase: "Updating existing…" });
        }
      } else {
        skipped = toUpdate.length;
      }

      setResult({ added, updated, skipped, dupes: preview.inFileDupes.length });
      setPreview(null);
      showToast(`✅ Done — ${added} added, ${updated} updated, ${skipped} skipped`, "success");
      addAuditEntry("CSV Upload", `${added} added, ${updated} updated, ${skipped} skipped`);

    } catch(e) {
      showToast("Upload error: " + e.message, "error");
    } finally {
      setUploading(false);
      setProgress(null);
    }
  }

  const sample = "RegNo,Name,Dept,Year,Gender\n953024104001,Arun Kumar,CSE,2,male\n953024104002,Priya Sharma,ECE,2,female\n953024104003,Ravi Raj,MECH,3,male";

  return (
    <div className="p-6 max-w-3xl">
      <h1 className="text-3xl font-black text-gray-900 mb-1">Upload Students CSV</h1>
      <p className="text-gray-400 text-sm mb-5">Bulk import · Duplicate-safe · Supports RegNo, Name, Dept, Year, Gender</p>

      {/* Template download */}
      <div className="mb-5 p-4 bg-blue-50 border border-blue-200 rounded-2xl flex items-center justify-between gap-4">
        <div>
          <p className="font-bold text-blue-900 text-sm">📄 Download CSV Template</p>
          <p className="text-blue-500 text-xs mt-0.5">Columns: RegNo, Name, Dept, Year, Gender</p>
        </div>
        <Btn size="sm" onClick={()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([sample],{type:"text/csv"}));a.download="students_template.csv";a.click();}}>
          <Ic.Down/>Template
        </Btn>
      </div>

      {/* Mode selector */}
      <div className="mb-5 bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">
          If student already exists in DB:
        </label>
        <div className="grid grid-cols-2 gap-2">
          {[
            {v:"skip",   icon:"⏭", label:"Skip existing",  desc:"Only add brand-new students"},
            {v:"update", icon:"🔄", label:"Update existing", desc:"Update name/dept/year/gender"},
          ].map(opt => (
            <button key={opt.v} onClick={()=>setMode(opt.v)}
              className={`p-3 rounded-xl border-2 text-left transition-all ${
                mode===opt.v ? "border-blue-500 bg-blue-50" : "border-gray-200 hover:border-blue-300"}`}>
              <div className="flex items-center gap-2 mb-1">
                <span>{opt.icon}</span>
                <span className={`text-sm font-bold ${mode===opt.v?"text-blue-700":"text-gray-700"}`}>{opt.label}</span>
              </div>
              <p className="text-xs text-gray-400">{opt.desc}</p>
            </button>
          ))}
        </div>
      </div>

      {/* Drop zone */}
      <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
        onDrop={e=>{e.preventDefault();setDragOver(false);processFile(e.dataTransfer.files[0]);}}
        onClick={()=>fileRef.current?.click()}
        className={`border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer transition-all ${
          dragOver?"border-blue-400 bg-blue-50":"border-gray-200 bg-gray-50 hover:border-blue-300 hover:bg-blue-50/30"}`}>
        <input ref={fileRef} type="file" accept=".csv,.CSV" className="hidden"
          onChange={e=>{processFile(e.target.files[0]); e.target.value="";}}/>
        <div className="text-5xl mb-3">📂</div>
        <h3 className="text-lg font-bold text-gray-700">Drop CSV here or tap to browse</h3>
        <p className="text-gray-400 text-sm mt-1">Accepts .csv files</p>
      </div>

      {/* Upload progress */}
      {progress && (
        <div className="mt-4 bg-blue-50 border border-blue-200 rounded-2xl p-4">
          <div className="flex items-center gap-3 mb-2">
            <Ic.Spin/>
            <span className="font-bold text-blue-700 text-sm">{progress.phase}</span>
          </div>
          {progress.total > 0 && (
            <>
              <div className="h-2 bg-blue-200 rounded-full overflow-hidden mb-1">
                <div className="h-full bg-blue-600 rounded-full transition-all"
                  style={{width: (progress.done/progress.total*100)+'%'}}/>
              </div>
              <p className="text-xs text-blue-500">{progress.done} / {progress.total}</p>
            </>
          )}
        </div>
      )}

      {/* Result summary */}
      {result && (
        <div className="mt-4 bg-green-50 border border-green-200 rounded-2xl p-4">
          <div className="font-black text-green-700 mb-2">✅ Upload Complete</div>
          <div className="grid grid-cols-2 gap-2 text-sm">
            <div className="bg-white rounded-xl p-3 text-center border border-green-100">
              <div className="text-2xl font-black text-green-600">{result.added}</div>
              <div className="text-xs text-gray-500">New students added</div>
            </div>
            <div className="bg-white rounded-xl p-3 text-center border border-green-100">
              <div className="text-2xl font-black text-blue-600">{result.updated}</div>
              <div className="text-xs text-gray-500">Students updated</div>
            </div>
            <div className="bg-white rounded-xl p-3 text-center border border-gray-100">
              <div className="text-2xl font-black text-gray-400">{result.skipped}</div>
              <div className="text-xs text-gray-500">Skipped (already exist)</div>
            </div>
            <div className="bg-white rounded-xl p-3 text-center border border-amber-100">
              <div className="text-2xl font-black text-amber-500">{result.dupes}</div>
              <div className="text-xs text-gray-500">In-file duplicates removed</div>
            </div>
          </div>
          <button onClick={()=>setResult(null)} className="mt-3 w-full py-2 rounded-xl border border-green-200 text-green-700 text-xs font-bold hover:bg-green-100">
            Upload another file
          </button>
        </div>
      )}

      {/* Preview table */}
      {preview && (
        <div className="mt-5 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
          <div className="px-5 py-4 border-b border-gray-100">
            <div className="flex items-center justify-between flex-wrap gap-3 mb-2">
              <div>
                <h4 className="font-bold text-gray-900">{preview.deduped.length} students ready to upload</h4>
                <p className="text-xs text-gray-400 mt-0.5">
                  {preview.raw.length - preview.deduped.length > 0 &&
                    `⚠ ${preview.raw.length - preview.deduped.length} in-file duplicates removed · `}
                  {preview.deduped.filter(s=>!students.find(x=>x.regno===s.regno)).length} new ·{" "}
                  {preview.deduped.filter(s=>students.find(x=>x.regno===s.regno)).length} existing
                  {mode==="skip" ? " (will skip)" : " (will update)"}
                </p>
              </div>
              <div className="flex gap-2">
                <Btn variant="ghost" size="sm" onClick={()=>{setPreview(null);setResult(null);}}>Cancel</Btn>
                <Btn size="sm" onClick={confirmUpload} disabled={uploading}>
                  {uploading ? <><Ic.Spin/>Uploading…</> : <><Ic.Chk/>Confirm Upload</>}
                </Btn>
              </div>
            </div>

            {/* In-file dupe warning */}
            {preview.inFileDupes.length > 0 && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-xs text-amber-700 font-medium">
                ⚠ Duplicate reg nos found and removed: {preview.inFileDupes.slice(0,5).join(", ")}
                {preview.inFileDupes.length > 5 && ` +${preview.inFileDupes.length-5} more`}
              </div>
            )}
          </div>

          <div className="overflow-auto max-h-64">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 sticky top-0">
                <tr>{["Reg No","Name","Dept","Year","Gender","Status"].map(h=>(
                  <th key={h} className="text-left px-3 py-2 text-xs font-bold text-gray-500 uppercase">{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {preview.deduped.slice(0,30).map((s,i) => {
                  const exists = students.find(x=>x.regno===s.regno);
                  return (
                    <tr key={i} className={i%2?"bg-gray-50/50":""}>
                      <td className="px-3 py-2 font-mono text-blue-600 text-xs">{s.regno}</td>
                      <td className="px-3 py-2 font-medium text-xs">{s.name}</td>
                      <td className="px-3 py-2">
                        <span className={`px-1.5 py-0.5 rounded text-xs font-bold border ${deptColor(s.dept)}`}>{s.dept}</span>
                      </td>
                      <td className="px-3 py-2 text-gray-500 text-xs">Y{s.year}</td>
                      <td className="px-3 py-2 text-gray-500 text-xs">{s.gender==="female"?"F":"M"}</td>
                      <td className="px-3 py-2">
                        {exists
                          ? <span className={`px-1.5 py-0.5 rounded text-xs font-bold ${mode==="update"?"bg-blue-100 text-blue-700":"bg-gray-100 text-gray-500"}`}>
                              {mode==="update"?"↻ update":"⏭ skip"}
                            </span>
                          : <span className="px-1.5 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700">+ new</span>
                        }
                      </td>
                    </tr>
                  );
                })}
                {preview.deduped.length > 30 && (
                  <tr><td colSpan={6} className="px-3 py-2 text-center text-xs text-gray-400">
                    +{preview.deduped.length-30} more rows…
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

function StudentExamCard({ exam, seatInfo, plan, student }) {

  const sessionLabel = exam.session==="FN"?"Forenoon (FN)":"Afternoon (AN)";

  function renderStudentBenchView() {
    if (!hallPlan) return null;
    return (
      <div className="mt-4">
        <div className="w-full bg-gray-800 text-white text-center py-1.5 rounded-t-lg text-xs font-bold">^ BOARD</div>
        <div className="space-y-2 mt-2">
          {hallPlan.benches.map(bench=>{
            const hasMe = bench.slots.some(s=>s.regno===student.regno);
            return (
              <div key={bench.benchNo} className={"flex items-center gap-2 "+(hasMe?"ring-2 ring-indigo-400 rounded-xl p-1":"")}>

                      <div key={si} style={{flex:1,minHeight:32,borderRadius:6,border:isMe?"2px solid #6366f1":("1.5px solid "+deptHex(seat.dept)+"80"),background:isMe?"#6366f1":(deptHex(seat.dept)+"18"),display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2px",transform:isMe?"scale(1.05)":"none"}}>
                        <div style={{fontSize:9,color:isMe?"#e0e7ff":deptHex(seat.dept),fontWeight:700,lineHeight:1.1,textAlign:"center"}}>{isMe?"YOU":seat.name.split(" ")[0]}</div>

                      </div>
                    );

// ── CONFLICT CHECKER PAGE ─────────────────────────────────────────────────────
function ConflictCheckerPage({ exams, seatingPlans, students }) {
  const conflicts = React.useMemo(() => {
    const results = [];
    const seatedExams = exams.filter(e => e.seatinggenerated && seatingPlans[e.id]);

    // Group exams by date
    const byDate = {};
    seatedExams.forEach(e => {
      if (!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });

    for (const [date, dayExams] of Object.entries(byDate)) {
      // Check within same session (real conflict - same time)
      const fnExams = dayExams.filter(e => e.session === "FN");
      const anExams = dayExams.filter(e => e.session === "AN");

      function checkWithinSession(sessionExams, sessionLabel) {
        for (let i = 0; i < sessionExams.length; i++) {
          for (let j = i + 1; j < sessionExams.length; j++) {
            const e1 = sessionExams[i], e2 = sessionExams[j];
            const seats1 = Object.values(seatingPlans[e1.id]||{}).flatMap(h=>h.seats||[]);
            const seats2 = Object.values(seatingPlans[e2.id]||{}).flatMap(h=>h.seats||[]);
            const regnos1 = new Set(seats1.map(s=>s.regno));
            const dupes = seats2.filter(s => regnos1.has(s.regno));
            dupes.forEach(s => {
              results.push({
                type: "conflict",
                severity: "high",
                date, session: sessionLabel,
                regno: s.regno,
                name: students.find(x=>x.regno===s.regno)?.name || s.regno,
                exam1: e1.subject, exam2: e2.subject,
                msg: `${s.regno} assigned to BOTH ${e1.subject} AND ${e2.subject} at same time (${sessionLabel})`
              });
            });
          }
        }
      }

      checkWithinSession(fnExams, "FN");
      checkWithinSession(anExams, "AN");

      // FN + AN same day = ALLOWED (morning + afternoon) - show as info only
      if (fnExams.length > 0 && anExams.length > 0) {
        fnExams.forEach(e1 => {
          anExams.forEach(e2 => {
            const fnSeats = Object.values(seatingPlans[e1.id]||{}).flatMap(h=>h.seats||[]);
            const anSeats = Object.values(seatingPlans[e2.id]||{}).flatMap(h=>h.seats||[]);
            const fnRegnos = new Set(fnSeats.map(s=>s.regno));
            const shared = anSeats.filter(s => fnRegnos.has(s.regno));
            if (shared.length > 0) {
              results.push({
                type: "info",
                severity: "low",
                date,
                session: "FN+AN",
                regno: `${shared.length} students`,
                name: "",
                exam1: e1.subject, exam2: e2.subject,
                msg: `${shared.length} student(s) have exams in BOTH FN (${e1.subject}) and AN (${e2.subject}) on ${date} - this is ALLOWED`
              });
            }
          });
        });
      }
    }

    // Duplicate reg nos within same session across all exams
    const regnoExamMap = {};
    seatedExams.forEach(e => {
      const seats = Object.values(seatingPlans[e.id]||{}).flatMap(h=>h.seats||[]);
      seats.forEach(s => {
        const key = `${e.date}_${e.session}_${s.regno}`;
        if (!regnoExamMap[key]) regnoExamMap[key] = [];
        regnoExamMap[key].push(e.subject);
      });
    });
    Object.entries(regnoExamMap).forEach(([key, subs]) => {
      if (subs.length > 1) {
        const [date, session, regno] = key.split("_");
        const alreadyAdded = results.find(r => r.regno===regno && r.date===date && r.session===session && r.type==="conflict");
        if (!alreadyAdded) {
          results.push({
            type: "conflict", severity: "high",
            date, session, regno,
            name: students.find(s=>s.regno===regno)?.name || regno,
            exam1: subs[0], exam2: subs.slice(1).join(", "),
            msg: `${regno} has duplicate seating in ${subs.length} exams at same session (${session})`
          });
        }
      }
    });

    return results;
  }, [exams, seatingPlans, students]);

  const high = conflicts.filter(c=>c.severity==="high");
  const low  = conflicts.filter(c=>c.severity==="low");

  return (
    <div className="p-8 max-w-5xl">
      <h1 className="text-3xl font-black text-gray-900 mb-1">Conflict Checker</h1>
      <p className="text-gray-400 text-sm mb-6">Detects students assigned to two exams at same time. FN + AN on same day is allowed.</p>

      <div className="grid grid-cols-3 gap-4 mb-6">
        {[
          {label:"Total Seating Plans", val:Object.keys(seatingPlans).length, color:"#3b82f6", Icon:Ic.Grid},
          {label:"Real Conflicts",   val:high.length, color:high.length>0?"#ef4444":"#10b981", Icon:high.length>0?Ic.Conflict:Ic.Chk},
          {label:"FN+AN Same Day",   val:low.length,  color:"#f59e0b", Icon:Ic.Cal},
        ].map(s=>(
          <div key={s.label} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 text-center">
            <div className="flex justify-center mb-2" style={{color:s.color}}><s.Icon/></div>
            <div className="text-3xl font-black" style={{color:s.color}}>{s.val}</div>
            <div className="text-gray-500 text-xs mt-1">{s.label}</div>
          </div>
        ))}
      </div>

      {high.length === 0 && low.length === 0 && (
        <div className="text-center py-16 bg-green-50 border border-green-200 rounded-2xl">
          <div className="flex justify-center mb-4 text-green-500"><svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          <div className="font-black text-green-700 text-xl">No Conflicts Found!</div>
          <div className="text-green-600 text-sm mt-2">All seating arrangements are clean</div>
        </div>
      )}

      {high.length > 0 && (
        <div className="mb-6">
          <h2 className="font-black text-red-600 text-lg mb-3"> Real Conflicts - Same Student, Same Time</h2>
          <div className="space-y-3">
            {high.map((c,i)=>(
              <div key={i} className="bg-red-50 border-2 border-red-200 rounded-2xl p-4">
                <div className="flex items-start gap-3">
                  <div className="text-red-500 mt-0.5"><Ic.Conflict/></div>
                  <div className="flex-1">
                    <div className="font-black text-red-700 text-sm">{c.name} <span className="font-mono text-xs bg-red-100 px-2 py-0.5 rounded">{c.regno}</span></div>
                    <div className="text-red-600 text-xs mt-1">{c.msg}</div>
                    <div className="flex gap-2 mt-2 flex-wrap">
                      <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">{c.date}</span>
                      <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">{c.session}</span>
                      <span className="bg-white border border-red-200 text-red-600 px-2 py-0.5 rounded text-xs">{c.exam1}</span>
                      <span className="text-red-400 text-xs self-center">&#8596;</span>
                      <span className="bg-white border border-red-200 text-red-600 px-2 py-0.5 rounded text-xs">{c.exam2}</span>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {low.length > 0 && (
        <div>
          <h2 className="font-black text-amber-600 text-lg mb-3">i FN + AN Same Day - Allowed (Student has morning & afternoon exams)</h2>
          <div className="space-y-2">
            {low.map((c,i)=>(
              <div key={i} className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3">
                <div className="text-amber-500 mt-0.5"><Ic.Cal/></div>
                <div>
                  <div className="text-amber-700 text-sm font-medium">{c.msg}</div>
                  <div className="flex gap-2 mt-1.5 flex-wrap">
                    <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-bold">{c.date}</span>
                    <span className="bg-white border border-amber-200 text-amber-600 px-2 py-0.5 rounded text-xs">{c.exam1} (FN)</span>
                    <span className="text-amber-400 text-xs self-center">&#8594;</span>
                    <span className="bg-white border border-amber-200 text-amber-600 px-2 py-0.5 rounded text-xs">{c.exam2} (AN)</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── SEAT SWAP PAGE ────────────────────────────────────────────────────────────
function SeatSwapPage({ exams, seatingPlans, setSeatingPlans, students, showToast }) {
  const [selExam, setSelExam] = useState("");
  const [search1, setSearch1] = useState("");
  const [search2, setSearch2] = useState("");
  const [seat1, setSeat1] = useState(null);
  const [seat2, setSeat2] = useState(null);
  const [saving, setSaving] = useState(false);
  const seatedExams = exams.filter(e => e.seatinggenerated && seatingPlans[e.id]);

  function findSeat(query, plan) {
    if (!plan || !query.trim()) return null;
    const q = query.trim().toUpperCase();
    for (const hp of Object.values(plan)) {
      const found = (hp.seats||[]).find(s => s.regno.toUpperCase()===q || s.seatNo?.toUpperCase()===q);
      if (found) return { ...found, hallName: hp.hallName };
    }
    return null;
  }

  const plan = selExam ? seatingPlans[selExam] : null;

  function doSearch1() { const r = findSeat(search1, plan); setSeat1(r || "notfound"); }
  function doSearch2() { const r = findSeat(search2, plan); setSeat2(r || "notfound"); }

  async function doSwap() {
    if (!seat1 || !seat2 || seat1==="notfound" || seat2==="notfound") return;
    setSaving(true);
    try {
      const newPlan = JSON.parse(JSON.stringify(plan));
      for (const hp of Object.values(newPlan)) {
        for (const seat of (hp.seats||[])) {
          if (seat.regno === seat1.regno) {
            const tmp = { regno: seat.regno, name: seat.name, dept: seat.dept, year: seat.year, gender: seat.gender, groupLabel: seat.groupLabel };
            Object.assign(seat, { regno: seat2.regno, name: seat2.name, dept: seat2.dept, year: seat2.year, gender: seat2.gender, groupLabel: seat2.groupLabel });
            seat1._tmp = tmp;
          }
        }
        for (const bench of (hp.benches||[])) {
          for (const slot of (bench.slots||[])) {
            if (slot.regno === seat1.regno) {
              const tmp2 = { ...slot };
              Object.assign(slot, { regno: seat2.regno, name: seat2.name, dept: seat2.dept, year: seat2.year, gender: seat2.gender });
              slot._t = tmp2;
            } else if (slot.regno === seat2.regno) {
              Object.assign(slot, { regno: seat1.regno, name: seat1.name, dept: seat1.dept, year: seat1.year, gender: seat1.gender });
            }
          }
        }
      }
      // Second pass for seats array
      for (const hp of Object.values(newPlan)) {
        for (const seat of (hp.seats||[])) {
          if (seat.regno === seat2.regno && seat1._tmp) {
            Object.assign(seat, seat1._tmp);
          }
        }
      }
      await sb("seating_plans","PATCH",{plan:newPlan},`?exam_id=eq.${selExam}`);
      setSeatingPlans(prev=>({...prev,[selExam]:newPlan}));
      addAuditEntry("Seat Swap", `${seat1.regno} and ${seat2.regno} swapped in exam ${selExam}`);
      showToast(`Swapped ${seat1.regno} and ${seat2.regno}`);
      setSeat1(null); setSeat2(null); setSearch1(""); setSearch2("");
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setSaving(false); }
  }

  const SeatCard = ({seat, label}) => seat && seat!=="notfound" ? (
    <div className="p-4 bg-blue-50 border-2 border-blue-200 rounded-2xl">
      <div className="text-xs text-blue-400 font-bold uppercase mb-2">{label}</div>
      <div className="font-black text-blue-700 text-lg">{seat.seatNo}</div>
      <div className="font-mono text-sm text-gray-600 mt-1">{seat.regno}</div>
      <div className="text-sm text-gray-500">{seat.name}</div>
      <div className="flex gap-2 mt-2">
        <span className={`px-2 py-0.5 rounded text-xs font-bold border ${deptColor(seat.dept)}`}>{seat.dept}</span>
        <span className="px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-xs">{seat.hallName}</span>
      </div>
    </div>
  ) : seat==="notfound" ? (
    <div className="p-4 bg-red-50 border-2 border-red-200 rounded-2xl text-red-500 text-sm font-medium"> Student not found</div>
  ) : <div className="p-4 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 text-sm text-center">Search to select student</div>;

  return (
    <div className="p-8 max-w-3xl">
      <h1 className="text-3xl font-black text-gray-900 mb-1">Seat Swap</h1>
      <p className="text-gray-400 text-sm mb-6">Search two students and swap their seat assignments</p>
      <div className="mb-5">
        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Select Exam</label>
        <select value={selExam} onChange={e=>{setSelExam(e.target.value);setSeat1(null);setSeat2(null);setSearch1("");setSearch2("");}}
          className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 text-sm font-medium focus:outline-none focus:border-blue-400 bg-white">
          <option value="">- Select exam -</option>
          {seatedExams.map(e=><option key={e.id} value={e.id}>{e.subject}   {e.date}   {e.session}</option>)}
        </select>
      </div>
      {selExam && (
        <>
          <div className="grid grid-cols-2 gap-4 mb-4">
            <div>

// ── EXAM RESULTS PAGE ─────────────────────────────────────────────────────────
function ExamResultsPage({ exams, seatingPlans, students, showToast }) {
  const [selExam, setSelExam] = useState("");
  const [attendance, setAttendance] = useState({});
  const [saving, setSaving] = useState(false);
  const seatedExams = exams.filter(e => e.seatinggenerated && seatingPlans[e.id]);

  useEffect(()=>{
    if (!selExam) return;
    try {
      const saved = JSON.parse(localStorage.getItem("examResults_"+selExam)||"{}");
      setAttendance(saved);
    } catch(e){}
  },[selExam]);

  const allSeats = selExam && seatingPlans[selExam]
    ? Object.values(seatingPlans[selExam]).flatMap(h=>(h.seats||[]).map(s=>({...s})))
    : [];

  function mark(regno, status) {
    setAttendance(prev => { const n={...prev,[regno]:status}; return n; });
  }

  function markAll(status) {
    const n={};
    allSeats.forEach(s=>{n[s.regno]=status;});
    setAttendance(n);
  }

  function saveResults() {
    try {
      localStorage.setItem("examResults_"+selExam, JSON.stringify(attendance));
      addAuditEntry("Results Saved", `Exam ${selExam} - ${Object.keys(attendance).length} entries`);
      showToast("Results saved!");
    } catch(e){ showToast("Error saving","error"); }
  }

  function exportResultsCSV() {
    const exam = exams.find(e=>e.id===selExam);
    const rows = [["RegisterNo","Name","Dept","Seat","Status"]];
    allSeats.forEach(s=>{
      const stu = students.find(x=>x.regno===s.regno);
      rows.push([s.regno, stu?.name||"-", s.dept, s.seatNo, attendance[s.regno]||"Not Marked"]);
    });
    const csv = rows.map(r=>r.join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`results_${exam?.subject||selExam}_${exam?.date||""}.csv`; a.click();
    addAuditEntry("Results Exported", exam?.subject+" "+exam?.date);
  }

  const present = allSeats.filter(s=>attendance[s.regno]==="present").length;
  const absent  = allSeats.filter(s=>attendance[s.regno]==="absent").length;
  const malpractice = allSeats.filter(s=>attendance[s.regno]==="malpractice").length;
  const unmarked = allSeats.length - present - absent - malpractice;

  const statusStyle = {
    present:     "bg-green-100 text-green-700 border-green-300",
    absent:      "bg-red-100 text-red-700 border-red-300",
    malpractice: "bg-orange-100 text-orange-700 border-orange-300",
  };

  return (
    <div className="p-8 max-w-5xl">
      <h1 className="text-3xl font-black text-gray-900 mb-1">Exam Results Entry</h1>
      <p className="text-gray-400 text-sm mb-6">Mark present/absent for each student after the exam</p>
      <div className="mb-5 flex gap-3 flex-wrap">
        <select value={selExam} onChange={e=>{setSelExam(e.target.value);setAttendance({});}}
          className="flex-1 border-2 border-gray-100 rounded-xl px-4 py-3 text-sm font-medium focus:outline-none focus:border-blue-400 bg-white min-w-[260px]">
          <option value="">- Select exam -</option>
          {seatedExams.map(e=><option key={e.id} value={e.id}>{e.subject}   {e.date}   {e.session}</option>)}
        </select>
        {selExam && <>
          <Btn onClick={()=>markAll("present")} variant="success" size="sm"> Mark All Present</Btn>
          <Btn onClick={saveResults} size="sm"> Save</Btn>
          <Btn onClick={exportResultsCSV} variant="ghost" size="sm"><Ic.Down/>Export CSV</Btn>
        </>}
      </div>

      {selExam && (
        <>
          <div className="grid grid-cols-4 gap-3 mb-5">
            {[
              {label:"Total",    val:allSeats.length, color:"#3b82f6"},
              {label:"Present",  val:present,          color:"#10b981"},
              {label:"Absent",   val:absent,           color:"#ef4444"},
              {label:"Unmarked", val:unmarked,         color:"#94a3b8"},
            ].map(s=>(
              <div key={s.label} className="bg-white rounded-xl p-4 text-center shadow-sm border border-gray-100">
                <div className="text-2xl font-black" style={{color:s.color}}>{s.val}</div>
                <div className="text-xs text-gray-400 mt-1">{s.label}</div>
              </div>
            ))}
          </div>

          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
            <table className="w-full text-sm">
              <thead className="bg-gray-50">
                <tr>
                  {["Reg No","Name","Dept","Seat","Status"].map(h=>(
                    <th key={h} className="text-left px-4 py-3 text-xs font-bold text-gray-500 uppercase">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {allSeats.map((s,i)=>{
                  const stu = students.find(x=>x.regno===s.regno);
                  const status = attendance[s.regno];
                  return (
                    <tr key={s.regno} className={i%2?"bg-gray-50/50":""}>
                      <td className="px-4 py-2.5 font-mono text-blue-600 text-xs font-bold">{s.regno}</td>
                      <td className="px-4 py-2.5 text-gray-700">{stu?.name||"-"}</td>
                      <td className="px-4 py-2.5"><span className={`px-2 py-0.5 rounded text-xs font-bold border ${deptColor(s.dept)}`}>{s.dept}</span></td>
                      <td className="px-4 py-2.5 font-mono text-xs text-gray-500">{s.seatNo}</td>
                      <td className="px-4 py-2.5">
                        <div className="flex gap-1">
                          {[["present","P"],["absent","A"],["malpractice","M"]].map(([val,lbl])=>(
                            <button key={val} onClick={()=>mark(s.regno,val)}
                              className={`px-2 py-1 rounded-lg text-xs font-bold border transition-all ${status===val?statusStyle[val]:"border-gray-200 text-gray-400 hover:border-gray-300"}`}>
                              {lbl}
                            </button>
                          ))}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}
