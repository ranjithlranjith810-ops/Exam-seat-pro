async function sb(table, method = "GET", body = null, qs = "") {
  const headers = {
    "Content-Type": "application/json",
    "apikey": SB_KEY,
    "Authorization": `Bearer ${SB_KEY}`,
    "Prefer": method === "POST" ? "resolution=merge-duplicates,return=representation" : "return=representation",
  };
  // 10 second fetch timeout per request
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(`${SB_URL}/rest/v1/${table}${qs}`, {
      method, headers, body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal,
    });
    clearTimeout(timer);
    if (!res.ok) { const txt = await res.text(); throw new Error(`DB ${res.status}: ${txt}`); }
    if (method === "DELETE") return true;
    return res.json();
  } catch(e) {
    clearTimeout(timer);
    if (e.name === "AbortError") throw new Error("Request timed out. Check internet connection.");
    throw e;
  }
}

  for (let i = 0; i < str.length; i++) { h = ((h << 5) + h) ^ str.charCodeAt(i); h >>>= 0; }

}

// ── SMART SEATING ENGINE ─────────────────────────────────────────────────────
//
// Step 1 - SORT: Arrange students so mixing is guaranteed before placement
//   - Gender split ON  -> sort males then females (block separation)
//   - Dept split ON    -> round-robin by dept:  CSE ECE MECH CSE ECE MECH...
//   - Year split ON    -> round-robin by year:  Y1 Y2 Y3 Y4 Y1 Y2 Y3...
//   - All three ON     -> dept round-robin first, then year within each dept slot
//
// Step 2 - PLACE: Fill hall benches sequentially from sorted list
//   - When hall is full -> overflow automatically to next hall
//   - Each hall gets a fresh bench grid
//
// Result: A1 B1 C1 D1 A2 B2 C2 D2... guaranteed on every bench row

function smartSort(students, rules) {
  if (!students.length) return [];
  let pool = [...students];

  // ── Gender split: males block + females block ──────────────────
  if (rules.splitGender) {
    const males   = pool.filter(s => s.gender !== "female");
    const females = pool.filter(s => s.gender === "female");
    pool = [...males, ...females];
  }

  // ── Dept round-robin ──────────────────────────────────────────
  if (rules.noSameDept) {
    const depts = [...new Set(pool.map(s => (s.dept||"GEN").toUpperCase()))].sort();
    if (depts.length > 1) {
      // Split into dept buckets
      const buckets = {};
      depts.forEach(d => { buckets[d] = pool.filter(s => (s.dept||"GEN").toUpperCase() === d); });
      // Round-robin: take 1 from each dept in order
      const sorted = [];
      const maxLen = Math.max(...depts.map(d => buckets[d].length));
      for (let i = 0; i < maxLen; i++) {
        depts.forEach(d => { if (buckets[d][i]) sorted.push(buckets[d][i]); });
      }
      pool = sorted;
    }
  }

  // ── Year round-robin (applied WITHIN the current pool order) ──
  if (rules.noSameYear) {
    const years = [...new Set(pool.map(s => String(s.year||1)))].sort();
    if (years.length > 1) {
      const buckets = {};
      years.forEach(y => { buckets[y] = pool.filter(s => String(s.year||1) === y); });
      const sorted = [];
      const maxLen = Math.max(...years.map(y => buckets[y].length));
      for (let i = 0; i < maxLen; i++) {
        years.forEach(y => { if (buckets[y][i]) sorted.push(buckets[y][i]); });
      }
      pool = sorted;
    }
  }

  return pool;
}

function generateSmartSeating(groups, halls) {
  if (!groups.length || !halls.length) return {};

  const rules = groups[0]?.rules || { splitGender:false, noSameDept:false, noSameYear:false };

  let allStudents = groups.flatMap(g =>
    g.students.map(s => ({ ...s, groupLabel: g.label||"" }))
  );
  if (!allStudents.length) return {};

  allStudents = smartSort(allStudents, rules);

  const plan = {};
  let cursor = 0;

  for (const hall of halls) {
    if (cursor >= allStudents.length) break;

    const numBenches = hall.numbenches || 15;
    const ly         = hall.layoutConfig || hall["layoutConfig"] || null;

    // If layoutConfig exists, each bench column has its OWN seat count.
    // Benches are row-major: B1,B2,B3 = row1 | B4,B5,B6 = row2 ...
    // Each bench only holds the seats for its column.
    let seatsPerBenchByCol = null;
    let numBenchCols = 1;
    if (ly && ly.columns && ly.columns.length > 1) {
      numBenchCols = ly.columns.length;
      seatsPerBenchByCol = ly.columns.map(function(col) {
        const total  = col.seats || 1;
        const aisles = (col.aisleSeats||[]).length;
        return Math.max(1, total - aisles);
      });
    }

    const studentsPerBench = hall.studentsperbench || 3;
    const benchRows = Math.ceil(numBenches / Math.max(1, numBenchCols));
    const capacity  = hall.capacity || (benchRows * studentsPerBench);

    const benches = [];
    for (let b = 0; b < numBenches && cursor < allStudents.length; b++) {
      // Which column is this bench in? (row-major: col = b % numBenchCols)
      const colIdx = b % numBenchCols;
      const spb    = seatsPerBenchByCol ? seatsPerBenchByCol[colIdx] : studentsPerBench;

      const slots = [];
      for (let s = 0; s < spb && cursor < allStudents.length; s++) {
        const st = allStudents[cursor];
        const seatNo = spb === 1
          ? `${hall.name}-B${b+1}`
          : `${hall.name}-B${b+1}S${s+1}`;
        slots.push({ ...st, seatNo, hall: hall.name, hallId: hall.id, bench: b+1, slot: s+1 });
        cursor++;
      }
      benches.push({ benchNo: b+1, slots, capacity: spb });
    }

    const seats = benches.flatMap(b => b.slots);
    plan[hall.id] = {
      hallName:         hall.name,
      numbenches:       hall.numbenches,
      studentsperbench: studentsPerBench,
      layoutConfig:     ly,
      capacity,
      benches,
      seats,
    };
  }

  return plan;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim().toLowerCase().replace(/[\s"']/g,""));
  const norm = h => {
    if (["regno","registernumber","rollno"].includes(h)) return "regno";
    if (["name","studentname","fullname"].includes(h)) return "name";
    if (["dept","department","branch"].includes(h)) return "dept";
    if (["year","sem","semester"].includes(h)) return "year";
    if (["gender","sex"].includes(h)) return "gender";
    return h;
  };
  const normH = headers.map(norm);
  return lines.slice(1).filter(l=>l.trim()).map((line,i) => {
    const vals = line.split(",").map(v=>v.trim().replace(/^["']|["']$/g,""));
    const obj = {};
    normH.forEach((h,j) => { obj[h]=vals[j]||""; });
    return {
      id: uid(),
      regno: (obj.regno||`UNK${1000+i}`).toUpperCase(),
      name: obj.name||`Student ${i+1}`,
      dept: (obj.dept||"GEN").toUpperCase(),
      year: parseInt(obj.year)||1,
      gender: (obj.gender||"male").toLowerCase() === "female" ? "female" : "male",
      password: hashPwd("student@123"),

// ── PROFORMA 1 - SEATING ARRANGEMENT ────────────────────────────────────────
// Exact Anna University format:
//   Columns: A, B, C, D, E (one per bench-column in the hall)
//   Rows:    1, 2, 3...  (one per bench row front to back)
//   Cell:    A1 / regno / DEPT  — restarts fresh for EVERY hall
function exportSeatingPDF(exam, plan, college) {
  const col = college || ACTIVE_COLLEGE;
  const w = window.open("","_blank");
  if (!w) { alert("⚠ Popup blocked!\nPlease allow popups for this site in your browser settings, then try again."); return; }
  const fmtDate = d => { try { const p=d.split("-"); return `${p[2]}.${p[1]}.${p[0]}`; } catch{return d;} };
  const ALPHA = ["A","B","C","D","E","F","G","H","I","J"];

  const hallPages = Object.values(plan).map(hp => {
    const seats      = hp.seats   || [];
    const benches    = hp.benches || [];
    const ly         = hp.layoutConfig || hp["layoutConfig"] || null;
    const numBenches = benches.length || hp.numbenches || 15;

    // Detect number of bench-columns across the hall
    const nCols = (ly && ly.columns && ly.columns.length > 1)
      ? ly.columns.length
      : (numBenches % 3 === 0 ? 3 : numBenches % 2 === 0 ? 2 : 1);
    const nRows = Math.ceil(numBenches / nCols);

    // Seats per bench per column  (each bench in col ci has seatsPerCol[ci] seats)
    const seatsPerCol = (ly && ly.columns)
      ? ly.columns.map(c => Math.max(1,(c.seats||1)-(c.aisleSeats||[]).length))
      : Array(nCols).fill(Math.round((hp.studentsperbench||3)/Math.max(1,nCols))||1);

    // Build bench lookup
    const benchMap = {};
    benches.forEach(b => { benchMap[b.benchNo] = b; });
    // If no benches array, reconstruct from flat seats array
    if (!benches.length && seats.length) {
      const fallbackSpb = hp.studentsperbench || 3;
      for (let b = 0; b < numBenches; b++) {
        const fallbackSlots = seats.slice(b*fallbackSpb, (b+1)*fallbackSpb);
        if (fallbackSlots.length) benchMap[b+1] = { benchNo: b+1, slots: fallbackSlots };
      }
    }

    // Column headers: A, B, C, D, E
    const colHdrs = Array(nCols).fill(null)
      .map((_,ci) => `<th class="ch">COLUMN ${ALPHA[ci]}</th>`)
      .join("");

    // Build grid rows — each row = one bench-row across the hall
    // Seat label = letter + row number (A1, B1, C1 in row1; A2, B2, C2 in row2...)
    // RESTARTS per hall — row numbers are 1-based within this hall
    let rowsHTML = "";
    for (let ri = 0; ri < nRows; ri++) {
      let hasAny = false;
      let cells = "";
      for (let ci = 0; ci < nCols; ci++) {
        const benchNo  = ri * nCols + ci + 1;
        const bench    = benchMap[benchNo];
        const benchSlots = bench ? (bench.slots || []) : [];
        const colSpb   = seatsPerCol[ci];
        const letter  = ALPHA[ci] || String.fromCharCode(65+ci);
        const rowNum  = ri + 1;
        const label   = letter + rowNum;   // e.g. A1, B1, C1

        if (!benchSlots.length) {
          cells += `<td class="sc empty">&nbsp;</td>`;
        } else {
          hasAny = true;
          const seat = benchSlots[0] || null;
          cells += `<td class="sc">
            <div class="sl">${label}</div>
            <div class="sr">${seat ? seat.regno : "&nbsp;"}</div>
            <div class="sd ${seat ? seat.dept : ''}">${seat ? seat.dept : "&nbsp;"}</div>
            ${colSpb > 1 ? benchSlots.slice(1).map((s2,idx2) => s2 ? `
            <div class="sep"></div>
            <div class="sl">${label}.${idx2+2}</div>
            <div class="sr">${s2.regno}</div>
            <div class="sd ${s2.dept}">${s2.dept}</div>` : '').join('') : ''}
          </td>`;
        }
      }
      if (hasAny) rowsHTML += `<tr>${cells}</tr>`;
    }

    // Subject + dept counts
    const deptCounts = {};
    seats.forEach(s => {
      const grp = s.groupLabel || s.dept;
      deptCounts[grp] = (deptCounts[grp]||0) + 1;
    });
    const subjectSummary = (exam.groups||[]).map(g => {
      const key = Object.keys(deptCounts).find(k => k.includes(g.dept));
      const cnt = key ? deptCounts[key] : seats.filter(s=>s.dept===g.dept).length;
      return g.subjectName ? `${g.subjectName}-${cnt}` : `${g.dept}-${cnt}`;
    }).filter(x=>x).join(", ");

    return `<div class="hall-page">
      <div class="hdr">
        <div class="pf">PROFORMA 1</div>
        <div class="univ">${col.exam_title || "ANNA UNIVERSITY CHENNAI EXAMINATIONS NOV/DEC 2025"}</div>
        <div class="dt">SEATING ARRANGEMENT</div>
        <div class="ctr">Centre: ${col.centre_code||""} ${col.name}</div>
      </div>
      <div class="hi">
        <span>Hall No: <b class="hn">${hp.hallName}</b></span>
        <span>Session: <b class="hn">${exam.session}</b></span>
        <span>Date: <b class="hn">${fmtDate(exam.date)}</b></span>
      </div>
      <table class="sg">
        <thead><tr>${colHdrs}</tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table>
      <div class="sum">${subjectSummary}<br/>TOTAL: ${seats.length}</div>
      <div class="sgn">
        <div class="sb">Name and sign of the Hall Superintendent</div>
        <div class="sb">${col.coe ? col.coe+"<br/>Controller of Examinations" : "Chief Superintendent Signature with<br/>College seal"}</div>
      </div>
    </div>`;
  }).join('<div class="pb"></div>');

  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">

// ── PROFORMA 1 - HALL ALLOCATION ─────────────────────────────────────────────
// Exact Anna University Hall Allocation format:
//   Hall | Subject Code | Dept | Register Numbers (abbreviated) | Count
//   TOTAL per hall, GRAND TOTAL at bottom
//   Register numbers: first full, rest last-4 abbreviated
function exportHallAllocationPDF(exam, plan, college) {
  const col = college || ACTIVE_COLLEGE;
  const w = window.open("","_blank");
  if (!w) { alert("⚠ Popup blocked!\nPlease allow popups for this site in your browser settings, then try again."); return; }
  const fmtDate = d => { try { const p=d.split("-"); return `${p[2]}.${p[1]}.${p[0]}`; } catch{return d;} };

  const allSeats    = Object.values(plan).flatMap(h => h.seats||[]);
  const grandTotal  = allSeats.length;

  function abbreviateRegnos(regnos) {
    if (!regnos.length) return "";
    // Sort numerically
    regnos = [...regnos].sort();
    const first  = regnos[0];
    const prefix = first.slice(0, -4);
    let out = first;
    for (let i = 1; i < regnos.length; i++) {
      const r = regnos[i];
      out += "," + (r.startsWith(prefix) ? r.slice(-4) : r);
      // Line break every ~10 numbers for readability
      if (i % 10 === 0 && i < regnos.length-1) out += "<br>";
    }
    return out;
  }

  let hallRowsHTML = "";
  Object.values(plan).forEach(hp => {
    const seats = hp.seats || [];
    if (!seats.length) return;

    // Group seats by subject/dept
    const groups = {};
    seats.forEach(s => {
      const key = (s.groupLabel || s.dept) + "||" + s.dept;
      if (!groups[key]) groups[key] = { label: s.groupLabel||s.dept, dept: s.dept, regnos: [], subjectCode:"" };
      groups[key].regnos.push(s.regno);
    });

    // Match subject codes from exam groups
    (exam.groups||[]).forEach(g => {
      const subjKey = Object.keys(groups).find(k => k.includes(g.dept));
      if (subjKey && g.subjectName) groups[subjKey].subjectCode = g.subjectName;
    });

    const groupArr  = Object.values(groups);
    const rowspan   = groupArr.length + 1; // +1 for TOTAL row
    let firstGroup  = true;

    groupArr.forEach(grp => {
      const hallCell = firstGroup
        ? `<td class="hall-cell" rowspan="${rowspan}">${hp.hallName}</td>`
        : "";
      firstGroup = false;
      hallRowsHTML += `<tr>
        ${hallCell}
        <td class="subj-cell">${grp.subjectCode || grp.label}</td>
        <td class="dept-cell">${grp.dept}</td>
        <td class="regno-cell">${abbreviateRegnos(grp.regnos)}</td>
        <td class="cnt-cell">${grp.regnos.length.toString().padStart(2,"0")}</td>
      </tr>`;
    });

    // TOTAL row for this hall
    hallRowsHTML += `<tr class="total-row">
      <td colspan="3" class="total-lbl">TOTAL</td>
      <td class="cnt-cell total-cnt">${seats.length}</td>
    </tr>`;
  });

  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
  <title>Hall Allocation - ${exam.subject}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Times New Roman',serif;color:#000;background:#fff;padding:24px 28px;}
    .hdr{text-align:center;margin-bottom:16px;}
    .pf{font-size:12px;font-weight:bold;letter-spacing:1px;}
    .univ{font-size:13px;font-weight:bold;text-transform:uppercase;margin:2px 0;}
    .dt{font-size:15px;font-weight:bold;text-decoration:underline;margin:3px 0;letter-spacing:1px;}
    .ctr{font-size:12px;margin-top:3px;}
    .meta{display:flex;justify-content:center;gap:48px;font-size:13px;
          margin:10px 0 14px;padding:6px 0;
          border-top:1.5px solid #000;border-bottom:1.5px solid #000;}
    .meta b{font-size:15px;}
    .alloc-table{width:100%;border-collapse:collapse;font-size:12px;}
    .alloc-table th{border:1.5px solid #000;padding:7px 8px;text-align:center;
        font-size:11px;font-weight:bold;text-transform:uppercase;
        background:#e8e8e8;letter-spacing:0.5px;}
    .alloc-table td{border:1px solid #888;padding:5px 8px;vertical-align:middle;}
    .hall-cell{font-weight:bold;font-size:16px;text-align:center;
        vertical-align:middle;background:#f9f9f9;border:1.5px solid #000;}
    .subj-cell{font-weight:bold;color:#1e40af;text-align:center;font-size:12px;}
    .dept-cell{font-weight:bold;text-align:center;font-size:12px;}
    .regno-cell{font-size:11px;color:#b45309;line-height:1.8;word-break:break-all;}
    .cnt-cell{text-align:center;font-weight:bold;font-size:13px;}
    .total-row td{background:#f0f0f0;font-weight:bold;border-top:1.5px solid #000;}
    .total-lbl{text-align:right;font-size:13px;font-weight:bold;letter-spacing:1px;padding-right:12px;}
    .total-cnt{font-size:16px;font-weight:bold;}
    .grand-row td{background:#d0d0d0;font-weight:bold;border:2px solid #000;}
    .grand-lbl{text-align:right;font-size:14px;font-weight:bold;letter-spacing:2px;padding-right:12px;}
    .grand-cnt{font-size:20px;font-weight:bold;text-align:center;}
    .sign-row{display:flex;justify-content:flex-end;margin-top:32px;}
    .sign-box{font-size:12px;text-align:center;font-weight:bold;
        border-top:1px solid #000;padding-top:6px;min-width:220px;}
    @media print{body{padding:14px 18px;}}
  </style></head><body>
  <div class="hdr">
    <div class="pf">PROFORMA 1</div>
    <div class="univ">${col.exam_title || "ANNA UNIVERSITY CHENNAI EXAMINATIONS NOV/DEC 2025"}</div>
    <div class="dt">HALL ALLOCATION</div>
    <div class="ctr">Centre: ${col.centre_code||""} ${col.name}</div>
  </div>
  <div class="meta">
    <span>Session: <b>${exam.session}</b></span>
    <span>Date: <b>${fmtDate(exam.date)}</b></span>
  </div>
  <table class="alloc-table">
    <thead>
      <tr>
        <th style="width:60px">Hall</th>
        <th style="width:80px">Subject<br>Code</th>
        <th style="width:55px">Dept</th>
        <th>Register Numbers</th>
        <th style="width:45px">Count</th>
      </tr>
    </thead>
    <tbody>
      ${hallRowsHTML}
      <tr class="grand-row">
        <td colspan="4" class="grand-lbl">GRAND TOTAL</td>
        <td class="grand-cnt">${grandTotal}</td>
      </tr>
    </tbody>
  </table>
  <div class="sign-row">
    <div class="sign-box">Chief Superintendent</div>
  </div>
  <script>window.print();<\/script></body></html>`);
  w.document.close();
}

function Btn({ children, onClick, variant="primary", size="md", disabled=false, className="" }) {

  const sizes = { sm:"px-3 py-1.5 text-xs", md:"px-5 py-2.5 text-sm", lg:"px-6 py-3.5 text-base" };
  const variants = {
    primary:"bg-gradient-to-r from-blue-600 to-blue-700 text-white hover:from-blue-700 hover:to-blue-800 shadow-md shadow-blue-200 hover:shadow-lg hover:shadow-blue-300",
    success:"bg-gradient-to-r from-emerald-500 to-emerald-600 text-white hover:from-emerald-600 hover:to-emerald-700 shadow-md shadow-emerald-200 hover:shadow-lg",
    danger:"bg-gradient-to-r from-red-500 to-red-600 text-white hover:from-red-600 hover:to-red-700 shadow-md shadow-red-200",
    ghost:"border-2 border-gray-200 text-gray-600 hover:bg-gray-50 hover:border-gray-300",
    dark:"bg-gradient-to-r from-gray-800 to-gray-900 text-white hover:from-gray-700 hover:to-gray-800 shadow-md",
    purple:"bg-gradient-to-r from-purple-600 to-violet-600 text-white hover:from-purple-700 hover:to-violet-700 shadow-md shadow-purple-200 hover:shadow-lg",
    orange:"bg-gradient-to-r from-orange-500 to-amber-500 text-white hover:from-orange-600 hover:to-amber-600 shadow-md shadow-orange-200",
    teal:"bg-gradient-to-r from-teal-500 to-cyan-500 text-white hover:from-teal-600 hover:to-cyan-600 shadow-md shadow-teal-200",
  };
  return <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]||variants.primary} ${className}`}>{children}</button>;
}

function QRCode({ data, size=72 }) {
  const hash = [...data].reduce((a,c)=>Math.imul(31,a)+c.charCodeAt(0)|0,0);
  const sz=9, cell=size/sz;
  const grid = Array(sz).fill(null).map((_,i)=>Array(sz).fill(null).map((_,j)=>{
    if((i<3&&j<3)||(i<3&&j>sz-4)||(i>sz-4&&j<3)) return 1;
    return((hash^(i*17+j*13))&1);
  }));
  return <svg width={size} height={size} style={{imageRendering:"pixelated",display:"block"}}>
    {grid.map((row,i)=>row.map((c,j)=><rect key={`${i}-${j}`} x={j*cell} y={i*cell} width={cell} height={cell} fill={c?"#0f172a":"#fff"}/>))}
  </svg>;
}

// ── BENCH LAYOUT COMPONENT ────────────────────────────────────────────────────
//
//  Real classroom (photo confirmed):
//  3 columns of long benches separated by walking aisles.
//  5 rows front → back.  Each bench = one physical bench with S1,S2,S3 seats.
//
//       ^ BOARD / PODIUM
//  ┌──────────────────────────────────────────────────────────────────────┐
//  │  COLUMN 1   ║ aisle ║   COLUMN 2   ║ aisle ║   COLUMN 3            │
//  │ ┌─────────┐ ║       ║ ┌─────────┐  ║       ║ ┌─────────┐           │
//  │ │B1:S1 S2 S3│       │ │B2:S1 S2 S3│       │ │B3:S1 S2 S3│  ← R1  │
//  │ ├─────────┤ ║       ║ ├─────────┤  ║       ║ ├─────────┤           │
//  │ │B4:S1 S2 S3│       │ │B5:S1 S2 S3│       │ │B6:S1 S2 S3│  ← R2  │
//  │ ...                                                                  │
//  │ │B13      │         │ │B14      │          │ │B15      │    ← R5  │
//  └──────────────────────────────────────────────────────────────────────┘
//
//  Within each bench, seats can be toggled as aisles (internal gaps).
//  Row-major numbering: R1=(B1,B2,B3), R2=(B4,B5,B6)...
//
function BenchLayout({ hall, highlightRegNo=null }) {
  const [hovered, setHovered] = useState(null);
  if (!hall?.benches) return null;

  const benches = hall.benches;
  const spr     = hall.studentsperbench || 3;
  const ly      = hall.layoutConfig || null;
  const totalB  = benches.length;

  // ── Grid detection ──────────────────────────────────────────────────
  function getBenchCols() {
    const map = {3:3,6:3,9:3,12:3,15:3,18:3,21:3,
                 4:2,8:2,10:2,14:2,
                 16:4,20:4};
    if (map[totalB] !== undefined) return map[totalB];
    if (totalB % 3 === 0) return 3;
    if (totalB % 2 === 0) return 2;
    return 1;
  }
  const BENCH_COLS = getBenchCols();
  const BENCH_ROWS = Math.ceil(totalB / BENCH_COLS);

  // Row-major: R1 = B1,B2,B3 | R2 = B4,B5,B6 ...
  function getBench(rowIdx, colIdx) {
    var idx = rowIdx * BENCH_COLS + colIdx;
    return idx < benches.length ? benches[idx] : null;
  }

  // Attractive per-column color schemes
  const COL_SCHEMES = [
    { bg:'linear-gradient(160deg,#dbeafe,#bfdbfe)', border:'#3b82f6', tag:'#dbeafe', tagBorder:'#93c5fd', label:'#1d4ed8' },   // Blue
    { bg:'linear-gradient(160deg,#d1fae5,#a7f3d0)', border:'#10b981', tag:'#d1fae5', tagBorder:'#6ee7b7', label:'#065f46' },   // Green
    { bg:'linear-gradient(160deg,#ede9fe,#ddd6fe)', border:'#8b5cf6', tag:'#ede9fe', tagBorder:'#c4b5fd', label:'#5b21b6' },   // Purple
    { bg:'linear-gradient(160deg,#fee2e2,#fecaca)', border:'#ef4444', tag:'#fee2e2', tagBorder:'#fca5a5', label:'#991b1b' },   // Rose
    { bg:'linear-gradient(160deg,#fef3c7,#fde68a)', border:'#f59e0b', tag:'#fef3c7', tagBorder:'#fcd34d', label:'#92400e' },   // Amber
    { bg:'linear-gradient(160deg,#cffafe,#a5f3fc)', border:'#06b6d4', tag:'#cffafe', tagBorder:'#67e8f9', label:'#164e63' },   // Cyan
  ];

  // ── Single seat on a bench ──────────────────────────────────────────
  function SeatDot({ seat, label }) {
    var isHi = !!(highlightRegNo && seat && seat.regno === highlightRegNo);
    return (
      <div style={{position:'relative', flexShrink:0, textAlign:'center'}}
        onMouseEnter={function(){ if(seat) setHovered(seat); }}
        onMouseLeave={function(){ setHovered(null); }}>
        <div style={{
          width:42, height:44, borderRadius:8,
          display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          cursor:'default', userSelect:'none',
          background: isHi ? '#fef08a' : seat ? deptHex(seat.dept)+'22' : '#f1f5f9',
          border: isHi ? '2.5px solid #facc15'
                : seat ? '2px solid '+deptHex(seat.dept)+'cc'
                       : '1.5px dashed #cbd5e1',
          color: seat ? deptHex(seat.dept) : '#94a3b8',
          boxShadow: isHi ? '0 0 0 3px #fde68a' : 'none',
          transition: 'transform 0.1s',
          transform: isHi ? 'scale(1.08)' : 'scale(1)',
        }}>
          {seat
            ? <><span style={{fontSize:9,fontWeight:900,lineHeight:1.1}}>{seat.dept}</span>
                <span style={{fontSize:7,opacity:0.7,lineHeight:1.2}}>Y{seat.year}</span></>
            : <span style={{fontSize:8,color:'#cbd5e1'}}>—</span>
          }
        </div>
        <div style={{fontSize:7,color:'#94a3b8',fontWeight:700,marginTop:2,lineHeight:1}}>{label}</div>

        {/* Hover tooltip */}
        {hovered === seat && seat && (
          <div style={{
            position:'absolute', bottom:'calc(100% + 8px)',
            left:'50%', transform:'translateX(-50%)',
            background:'#0f172a', color:'#fff', borderRadius:10,
            padding:'8px 12px', fontSize:11, whiteSpace:'nowrap',
            zIndex:500, boxShadow:'0 8px 32px rgba(0,0,0,.5)',
            pointerEvents:'none', minWidth:180,
          }}>
            <div style={{fontWeight:800,fontSize:13,marginBottom:3}}>{seat.name}</div>
            <div style={{color:'#94a3b8'}}>{seat.regno}</div>
            <div style={{color:'#cbd5e1',marginTop:2,fontSize:10}}>
              {seat.dept} · Year {seat.year} · {seat.gender==='female'?'Female':'Male'}
            </div>
            <div style={{color:'#60a5fa',fontFamily:'monospace',marginTop:2,fontSize:10}}>{seat.seatNo}</div>
            {seat.groupLabel && <div style={{color:'#fbbf24',fontSize:10,marginTop:2}}>{seat.groupLabel}</div>}
            <div style={{position:'absolute',bottom:-7,left:'50%',transform:'translateX(-50%)',
              width:0,height:0,borderLeft:'5px solid transparent',
              borderRight:'5px solid transparent',borderTop:'7px solid #0f172a'}}/>
          </div>
        )}
      </div>
    );
  }

  // ── One physical bench ───────────────────────────────────────────────
  // Looks like a long horizontal bench with S1 S2 S3 positions labelled
  function Bench({ bench, scheme }) {
    var sc = scheme || COL_SCHEMES[0];

    if (!bench) return (
      <div style={{
        height:60, borderRadius:10,
        border:'2px dashed '+sc.border+'55', background:sc.tag,
        display:'flex', alignItems:'center', justifyContent:'center', opacity:0.4,
      }}>
        <span style={{fontSize:9,color:sc.label}}>—</span>
      </div>
    );

    var slots    = bench.slots || [];
    var capacity = bench.capacity || spr;

    return (
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', width:'100%'}}>
        <div style={{
          display:'flex', alignItems:'flex-end', gap:3, flexWrap:'nowrap',
          background:sc.bg,
          border:'2.5px solid '+sc.border,
          borderRadius:10, padding:'8px 8px 6px',
          width:'100%', boxSizing:'border-box',
          justifyContent:'center',
          boxShadow:'0 3px 12px '+sc.border+'33',
        }}>
          {Array(capacity).fill(null).map(function(_, si) {
            var seat = slots[si] || null;
            return <SeatDot key={si} seat={seat} label={'S'+(si+1)}/>;
          })}
        </div>
        <div style={{
          fontSize:8, fontWeight:800, color:sc.label,
          background:sc.tag, border:'1px solid '+sc.tagBorder,
          borderRadius:'0 0 6px 6px', padding:'2px 10px',
          letterSpacing:0.5,
        }}>B{bench.benchNo}</div>
      </div>
    );
  }

  // ── Main Render ──────────────────────────────────────────────────────
  return (
    <div style={{
      background:'#fff', borderRadius:16, border:'1px solid #e5e7eb',
      boxShadow:'0 1px 4px rgba(0,0,0,0.06)', padding:'16px 14px',
      overflowX:'auto',
    }}>

      {/* ── Header ── */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                   marginBottom:10,flexWrap:'wrap',gap:4}}>
        <h3 style={{fontWeight:900,fontSize:14,color:'#111827',margin:0}}>
          🏛 {hall.hallName}

// ── REGISTER SCREEN ───────────────────────────────────────────────────────────
function RegisterScreen({ onBack, onRegistered }) {
  const [form, setForm] = useState({regno:"",name:"",dept:"CSE",year:"1",gender:"male",password:"",confirm:""});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  async function handleRegister() {
    setError("");
    if (!form.regno||!form.name||!form.password) { setError("All fields are required."); return; }
    if (form.regno.length<4) { setError("Register number too short (min 4 digits)."); return; }
    if (form.password.length<6) { setError("Password must be at least 6 characters."); return; }
    if (form.password!==form.confirm) { setError("Passwords do not match."); return; }
    setLoading(true);
    try {
      const existing = await sb("students","GET",null,`?regno=eq.${form.regno.toUpperCase().trim()}&college_id=eq.${Store.getCollegeId()}&select=id`);
      if (existing?.length>0) { setError("This register number is already registered."); setLoading(false); return; }
      const student = {
        id: uid(),
        regno: form.regno.toUpperCase().trim(),
        name: form.name.trim(),
        dept: form.dept.toUpperCase(),
        year: parseInt(form.year)||1,
        gender: form.gender,
        password: hashPwd(form.password),
      };
      await Store.addStudent(student);
      setSuccess(true);
      setTimeout(()=>onRegistered(student), 1800);
    } catch(e) { setError("Registration failed: "+e.message); }
    finally { setLoading(false); }
  }

  if (success) return (
    <div className="min-h-screen flex items-center justify-center" style={{background:"linear-gradient(135deg,#0f172a,#1e3a8a)"}}>
      <div className="text-center">

        <h2 className="text-2xl font-black text-white">Registration Successful!</h2>
        <p className="text-blue-300 mt-2">Redirecting...</p>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-10" style={{background:"linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#0f172a 100%)"}}>
      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 text-3xl shadow-2xl" style={{background:"linear-gradient(135deg,#059669,#10b981)"}}></div>
          <h1 className="text-3xl font-black text-white">Student Registration</h1>
          <p className="text-blue-300 text-sm mt-1">Create your ExamSeat account</p>
        </div>
        <div className="bg-white rounded-3xl shadow-2xl p-8">
          <Input label="Register Number" value={form.regno} onChange={v=>set("regno",v)} placeholder="e.g. 9530" required/>
          <Input label="Full Name" value={form.name} onChange={v=>set("name",v)} placeholder="Your full name" required/>
          <div className="grid grid-cols-2 gap-4">
            <Select label="Department" value={form.dept} onChange={v=>set("dept",v)} options={DEPTS}/>
            <Select label="Year" value={form.year} onChange={v=>set("year",v)} options={["1","2","3","4"]}/>
          </div>
          <div className="mb-4">
            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Gender</label>
            <div className="flex gap-3">
              {[["male","Male"],["female","Female"]].map(([v,l])=>(
                <label key={v} className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl border-2 cursor-pointer font-bold text-sm transition-all ${form.gender===v?"border-blue-500 bg-blue-50 text-blue-700":"border-gray-200 text-gray-500"}`}>

// ── LOGIN SCREEN ──────────────────────────────────────────────────────────────
function LoginScreen({ onLogin, onRegister }) {
  useEffect(()=>{ if(window.__hideSplash) window.__hideSplash(); },[]);
  const [mode, setMode] = useState("admin");
  const [password, setPassword] = useState("");
  const [centreCode, setCentreCode] = useState("");
  const [regNo, setRegNo] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [showDev, setShowDev] = useState(false);
  const [tapCount, setTapCount] = useState(0);

  function switchMode(m) { setMode(m); setPassword(""); setCentreCode(""); setRegNo(""); setError(""); }

  // Tap the logo 5× to reveal developer login
  function handleLogoTap() {
    const next = tapCount + 1;
    setTapCount(next);
    if (next >= 5) { setShowDev(true); setTapCount(0); switchMode("developer"); }
    setTimeout(()=>setTapCount(0), 3000);
  }

  async function handleLogin() {
    setError(""); setLoading(true);
    try {
      if (mode==="developer") {
        if (password===DEV_PASSWORD) { setPassword(""); onLogin({role:"developer",name:"Developer",id:"dev"}); }
        else { setPassword(""); setError("Incorrect developer password."); }
      } else if (mode==="admin") {
        if (!centreCode.trim()) { setError("Enter your Centre Code."); setLoading(false); return; }
        if (!password.trim()) { setError("Enter your admin password."); setLoading(false); return; }
        const rows = await sb("colleges","GET",null,"?centre_code=eq."+centreCode.trim()+"&select=*");
        if (!rows || !rows.length) { setPassword(""); setError("College not found. Check your Centre Code."); setLoading(false); return; }
        const college = rows[0];
        if (!college.admin_password || college.admin_password !== password.trim()) {
          setPassword(""); setError("Incorrect admin password."); setLoading(false); return;
        }
        setPassword("");
        onLogin({ role:"admin", name:"Administrator", id:"admin", college });
      } else {
        if (!regNo.trim()) { setError("Enter your register number."); setLoading(false); return; }
        const studentRows = await sb("students","GET",null,"?regno=eq."+regNo.toUpperCase().trim()+"&college_id=eq."+Store.getCollegeId()+"&select=*");
        if (!studentRows || !studentRows.length) { setPassword(""); setError("Register number not found. Contact your admin."); setLoading(false); return; }
        const student = studentRows[0];
        const enteredPwdHash = hashPwd(password);
        const defaultPwdHash = hashPwd(regNo.trim().slice(-4));
        const pwdOk = student.password === enteredPwdHash || (!password.trim() && student.password === defaultPwdHash);
        if (!pwdOk) { setPassword(""); setError("Incorrect password. Try the last 4 digits of your roll number."); setLoading(false); return; }
        setPassword(""); onLogin({...student,role:"student"});
      }
    } catch(e) { setError("Login error: "+e.message); setPassword(""); }
    finally { setLoading(false); }
  }

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:"linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#0f172a 100%)"}}>
      <div className="w-full max-w-md">
        <div className="text-center mb-10">
          {/* Tap logo 5× to reveal developer login */}
          <div onClick={handleLogoTap} className="inline-flex items-center justify-center w-20 h-20 rounded-3xl mb-5 shadow-2xl cursor-pointer select-none" style={{background:"linear-gradient(135deg,#2563eb,#7c3aed)",boxShadow:"0 0 60px rgba(99,102,241,.45)"}}>
            <svg className="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14l9-5-9-5-9 5 9 5z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.8} d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
          </div>
          <h1 className="text-4xl font-black text-white tracking-tight">ExamSeat Pro</h1>
          <p className="text-blue-300 text-sm mt-2">Smart Bench Seating · Anti-Cheating</p>
        </div>

        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden">
          {/* Admin + Student tabs only — Dev is hidden */}
          {mode !== "developer" && (
            <div className="flex border-b border-gray-100">
              {[["admin","🏫 Admin"],["student","🎓 Student"]].map(([m,label])=>(
                <button key={m} onClick={()=>switchMode(m)}
                  className={`flex-1 py-4 text-sm font-black uppercase tracking-widest transition-all ${mode===m?"bg-blue-600 text-white":"bg-gray-50 text-gray-400 hover:text-gray-600"}`}>
                  {label}
                </button>
              ))}
            </div>
          )}

          {/* Developer mode header */}
          {mode === "developer" && (
            <div className="flex items-center justify-between px-6 py-4 border-b border-purple-100 bg-purple-50">
              <div className="flex items-center gap-2">
                <svg className="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                <span className="text-purple-700 font-black text-sm uppercase tracking-wider">Developer Access</span>
              </div>
              <button onClick={()=>{ switchMode("admin"); setShowDev(false); }} className="text-purple-400 hover:text-purple-600 text-xs font-bold">← Back</button>
            </div>
          )}

          <div className="p-8" onKeyDown={e=>e.key==="Enter"&&handleLogin()}>
            {mode==="developer" ? (
              <div>
                <div className="flex items-center gap-2 mb-5 p-3 bg-purple-50 border border-purple-200 rounded-xl">
                  <svg className="w-4 h-4 text-purple-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  <span className="text-purple-700 text-xs font-medium">Authorized personnel only. Manages all colleges &amp; data.</span>
                </div>
                <Input label="Developer Password" value={password} onChange={setPassword} type="password"/>
              </div>
            ) : mode==="admin" ? (
              <div>
                <div className="flex items-center gap-2 mb-4 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                  <Ic.Shield/><span className="text-slate-600 text-xs font-medium">Login with your college Centre Code and admin password</span>
                </div>
                <Input label="Centre Code" value={centreCode} onChange={setCentreCode}
                  hint="Your college's centre code assigned by Anna University (e.g. 9530)"/>
                <Input label="Admin Password" value={password} onChange={setPassword} type="password"/>
              </div>
            ) : (
              <>
                <div className="mb-3 p-3 bg-blue-50 border border-blue-100 rounded-xl text-blue-700 text-xs font-medium">
                  📋 Enter your register number. Default password = last 4 digits of your roll number.
                </div>
                <Input label="Register Number" value={regNo} onChange={setRegNo}
                  hint="Your university register number (e.g. 953021103001)"/>
                <Input label="Password" value={password} onChange={setPassword} type="password"/>
              </>
            )}

            {error && (
              <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm flex items-center gap-2">
                <svg className="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                {error}
              </div>
            )}

            <Btn onClick={handleLogin} disabled={loading} size="lg" className="w-full mb-4">
              {loading ? <><Ic.Spin/>Signing in...</> : "Sign In →"}
            </Btn>

            {mode==="student" && (
              <div className="text-center">
                <span className="text-gray-400 text-sm">New student? </span>
                <button onClick={onRegister} className="text-blue-600 font-bold text-sm hover:text-blue-700">Register here →</button>

        {/* Hidden developer access — tap logo 5× OR click dots below */}
        {!showDev && (
          <div className="text-center mt-5">
            <button onClick={()=>{ setShowDev(true); switchMode("developer"); }}
              className="text-blue-400/20 hover:text-blue-300/60 text-xs transition-all select-none px-4 py-2"
              title="Developer Access">
              · · ·
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── ADMIN DASHBOARD ───────────────────────────────────────────────────────────
function AdminDashboard({ user, onLogout, students, setStudents, halls, setHalls, exams, setExams, seatingPlans, setSeatingPlans }) {
  const college = user && user.college ? user.college : ACTIVE_COLLEGE;
  // ACTIVE_COLLEGE is already set in App.handleLogin before data loads
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg,type="success")=>setToast({msg,type}),[]);

  // Listen for navTo events from dashboard quick actions
  useEffect(function(){
    function handleNav(e){ setPage(e.detail); }
    document.addEventListener('navTo', handleNav);
    return function(){ document.removeEventListener('navTo', handleNav); };
  }, []);

  // ── SEATING RULES CONFIRMATION DIALOG ────────────────────────
  const [confirmExam, setConfirmExam] = useState(null);
  const [rules, setRules] = useState({ splitGender: false, noSameDept: true, noSameYear: true });
  const [generating, setGenerating] = useState(false);
  const toggleRule = k => setRules(r=>({...r,[k]:!r[k]}));

  function handleGenerateSeating(exam) {
    // Show confirmation dialog instead of generating immediately
    setConfirmExam(exam);
    setRules({ splitGender: false, noSameDept: true, noSameYear: true });
  }

  async function confirmAndGenerate() {
    const exam = confirmExam;
    setGenerating(true);
    let usedPlaceholders = false;

    let groups = (exam.groups||[]).map(g => {
      // Match students: exact dept+year first
      let matched = students.filter(s =>
        s.dept?.toUpperCase() === g.dept.toUpperCase() &&
        parseInt(s.year) === parseInt(g.year)
      );
      // Fallback: dept only (used when noSameYear is ON or no exact year match)
      if (!matched.length) {
        matched = students.filter(s => s.dept?.toUpperCase() === g.dept.toUpperCase());
      }
      // Final fallback: placeholder seats from count
      if (!matched.length) {
        const count = parseInt(g.count) || 30;
        usedPlaceholders = true;
        matched = Array.from({length: count}, (_, i) => ({
          id: `PH_${g.dept}_${g.year}_${i+1}`,
          regno: `${g.dept}${g.year}_${String(i+1).padStart(3,"0")}`,
          name: `${g.dept} Y${g.year} Student ${i+1}`,
          dept: g.dept, year: parseInt(g.year)||1,
          gender: i%2===0?"male":"female", placeholder: true,
        }));
      }
      return {
        label: `${g.dept} Y${g.year}${g.subjectName ? ` (${g.subjectName})` : ""}`,
        dept: g.dept, year: parseInt(g.year), students: matched,
      };
    }).filter(g => g.students.length > 0);

    // Remove duplicate students across groups (same student in multiple groups)
    const seenIds = new Set();
    groups = groups.map(g => ({
      ...g,
      students: g.students.filter(s => {
        if (seenIds.has(s.id || s.regno)) return false;
        seenIds.add(s.id || s.regno);
        return true;
      })
    })).filter(g => g.students.length > 0);

    if (!groups.length) { showToast("No groups configured for this exam", "error"); setGenerating(false); setConfirmExam(null); return; }
    if (!halls.length) { showToast("No halls configured. Add halls first.", "error"); setGenerating(false); setConfirmExam(null); return; }
    if (usedPlaceholders) showToast("No student records - using placeholder seats", "warn");

    // ── TOTAL STUDENTS ────────────────────────────────────────────
    const totalStudents = groups.reduce((a,g) => a+g.students.length, 0);

    // ── AUTO-SELECT HALLS: use exam halls OR auto-pick enough halls ─
    // Sort halls by capacity descending so largest fills first
    let examHalls = exam.hallids?.length
      ? halls.filter(h => exam.hallids.includes(h.id))
      : [...halls].sort((a,b) => (b.capacity||0) - (a.capacity||0));

    // Auto-calculate: pick halls until total capacity >= total students
    if (!exam.hallids?.length) {
      let cap = 0;
      const needed = [];
      for (const h of examHalls) {
        needed.push(h);
        cap += h.capacity || (Math.ceil((h.numbenches||10)/Math.max(1,(h.layoutConfig?.columns||[1]).length)) * (h.studentsperbench||3));
        if (cap >= totalStudents) break;
      }
      examHalls = needed;
    }

    // Total capacity check
    const totalCap = examHalls.reduce((a,h)=>a+(h.capacity||Math.ceil((h.numbenches||10)/Math.max(1,(h.layoutConfig?.columns||[1]).length))*(h.studentsperbench||3)),0);
    if (totalCap < totalStudents) {
      showToast(`⚠ Hall capacity (${totalCap}) < students (${totalStudents}). ${totalStudents-totalCap} students won't get seats. Add more halls.`, "warn");
    }

    // ── PASS RULES TO ALGORITHM via group metadata ────────────────
    groups = [{
      label:    groups.map(g=>g.label).join(" + "),
      dept:     "MIX",
      year:     1,
      students: groups.flatMap(g => g.students),
      rules:    { splitGender: rules.splitGender, noSameDept: rules.noSameDept, noSameYear: rules.noSameYear },
    }];

    try {
      const plan = generateSmartSeating(groups, examHalls);
      await Store.setSeatingPlan(exam.id, plan);
      await Store.updateExam(exam.id, {seatinggenerated:true});
      setSeatingPlans(prev=>({...prev,[exam.id]:plan}));
      setExams(prev=>prev.map(e=>e.id===exam.id?{...e,seatinggenerated:true}:e));
      const total = Object.values(plan).reduce((a,h)=>a+(h.seats?.length||0),0);
      const rulesSummary = [
        rules.splitGender ? "Gender Split" : null,
        rules.noSameDept  ? "No Same Dept" : null,
        rules.noSameYear  ? "No Same Year" : null,
      ].filter(Boolean).join(", ");
      showToast(`Seating generated for ${total} students! Rules: ${rulesSummary||"None"}`);
      addAuditEntry("Seating Generated", `${exam.subject} / ${exam.date} / ${exam.session} / ${total} seats - Rules: ${rulesSummary||"None"}`);
      // Check for duplicate regnos across same-session exams
      const sameDaySession = exams.filter(e2 => e2.id!==exam.id && e2.date===exam.date && e2.session===exam.session && e2.seatinggenerated);
      if (sameDaySession.length > 0) {
        const newRegnos = new Set(Object.values(plan).flatMap(h=>(h.seats||[]).map(s=>s.regno)));
        const dupeWarnings = [];
        for (const e2 of sameDaySession) {
          const existingPlan = seatingPlans[e2.id];
          if (existingPlan) {
            const existing = Object.values(existingPlan).flatMap(h=>(h.seats||[]).map(s=>s.regno));
            const dupes = existing.filter(r => newRegnos.has(r));
            if (dupes.length) dupeWarnings.push(`${dupes.length} duplicate(s) with ${e2.subject}`);
          }
        }
        if (dupeWarnings.length) showToast("Duplicate detection: " + dupeWarnings.join(", "), "warn");
      }
      setConfirmExam(null);
    } catch(e) { showToast("Error: "+e.message,"error"); }
    finally { setGenerating(false); }

function AdminHome({ students, halls, exams, setStudents, showToast }) {
  const deptMap={};
  students.forEach(s=>{deptMap[s.dept]=(deptMap[s.dept]||0)+1;});
  const maleCount = students.filter(s=>s.gender!=="female").length;
  const femaleCount = students.filter(s=>s.gender==="female").length;

  // ── College Settings inline state ──────────────────────────────
  const [college, setCollege] = useState({
    name:        ACTIVE_COLLEGE.name        || "",
    address:     ACTIVE_COLLEGE.address     || "",
    centre_code: ACTIVE_COLLEGE.centre_code || "",
    exam_title:  ACTIVE_COLLEGE.exam_title  || "ANNA UNIVERSITY CHENNAI EXAMINATIONS NOV/DEC 2025",
    phone:       ACTIVE_COLLEGE.phone       || "",
    email:       ACTIVE_COLLEGE.email       || "",
    principal:   ACTIVE_COLLEGE.principal   || "",
    coe:         ACTIVE_COLLEGE.coe         || "",
  });
  const [collegeSaved, setCollegeSaved] = useState(false);

  function saveCollege() {
    if (!college.name.trim()) { showToast("College name is required","error"); return; }
    saveActiveCollege({ ...ACTIVE_COLLEGE, ...college });
    setCollegeSaved(true);
    setTimeout(()=>setCollegeSaved(false), 2500);
    addAuditEntry("College Settings Updated", college.name);
    showToast("College settings saved!");
  }

  // ── Delete all students ─────────────────────────────────────────
  const [deleting, setDeleting] = useState(false);
  async function deleteAllStudents() {
    if (!window.confirm(`[!] DELETE ALL ${students.length} STUDENTS?

This permanently removes all student records from the database.

Press OK to confirm.`)) return;
    setDeleting(true);
    try {
      await sb("students","DELETE",null,`?college_id=eq.${Store.getCollegeId()}`);
      setStudents([]);
      addAuditEntry("Deleted All Students", `${students.length} students removed`);
      showToast("All students deleted","info");
    } catch(e){ showToast("Error: "+e.message,"error"); }
    finally { setDeleting(false); }
  }

  return (
    <div className="p-6">
      {/* Header */}
      <div className="mb-6 flex items-start justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-3xl font-black text-gray-900">Dashboard</h1>
          <p className="text-gray-400 text-sm mt-1">{new Date().toLocaleDateString("en-IN",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</p>
        </div>
        <div className="flex items-center gap-2 px-4 py-2 bg-white rounded-2xl shadow-sm border border-gray-100">
          <div className="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"/>
          <span className="text-xs font-bold text-gray-600">Live — Supabase Connected</span>
        </div>
      </div>

      {/* Stats — gradient cards */}
      <div className="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        {[
          {label:"Students",     val:students.length,                              grad:"from-blue-500 to-blue-600",    icon:"👥", sub:maleCount+"M / "+femaleCount+"F"},
          {label:"Exam Halls",   val:halls.length,                                 grad:"from-violet-500 to-purple-600",icon:"🏛",  sub:halls.reduce((a,h)=>a+(h.capacity||0),0)+" total seats"},
          {label:"Exams",        val:exams.length,                                 grad:"from-amber-500 to-orange-500", icon:"📅", sub:exams.filter(e=>e.seatinggenerated).length+" seated"},
          {label:"Seated",       val:exams.filter(e=>e.seatinggenerated).length,   grad:"from-emerald-500 to-teal-500", icon:"✅", sub:"ready to print"},
        ].map(s=>(
          <div key={s.label} className={`rounded-2xl p-5 shadow-md text-white bg-gradient-to-br ${s.grad} relative overflow-hidden`}>
            <div className="absolute top-0 right-0 text-5xl opacity-10 font-black p-2">{s.icon}</div>
            <div className="text-4xl font-black mb-1 relative z-10">{s.val}</div>
            <div className="font-bold text-sm opacity-90 relative z-10">{s.label}</div>
            <div className="text-xs opacity-60 mt-0.5 relative z-10">{s.sub}</div>
          </div>

      {Object.keys(deptMap).length > 0 && (

      )}
